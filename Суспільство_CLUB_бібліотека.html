вити амбітну, велику ціль (а не дрібну), оскільки саме масштабна мета \"тягне\" за собою менші досягнення — фокус на маленькому може взагалі не привести до бажаного результату.", "Інтелектуальна робота найефективніша у форматі коротких концентрованих періодів (2-3 години максимум) без відволікань, а не розтягнута на весь день — так можна встигнути більше за менший час.", "Немає жодних гарантій у житті, тому не варто чекати підтвердження \"звідки прийдуть гроші\" — потрібно просто дозволити собі бажану суму, не прив'язуючись до джерела, і одночасно навчитися легко як витрачати, так і отримувати гроші.", "При виборі криптовалют для інвестицій варто звертати увагу на капіталізацію монети, наявність стейблкоїнів, репутацію засновників проєкту та реальну корисну функцію криптовалюти для світової економіки."], "p": false, "c": "Мастермайнди", "extra": ""}, {"t": "Зустріч з учасницями. Ольга Ковальчук. ТРАВЕНЬ", "d": "2025-05-23", "u": "https://youtu.be/jUcbLKajaAg", "s": "Це запис групового Майстермайнду, де ведуча розкриває тему масок і проєкцій — як люди накладають на інших (і на себе) образи-аватари замість того, щоб бачити справжню людину. Головна ідея — коли людина перестає дивитися на інших крізь призму статусу, регалій чи чужих думок, а бачить справжню суть, зникають страх, нерівність і напруга у стосунках, і водночас важливо зменшити владу власного внутрішнього критика (\"аватара\"), який накопичився з чужих думок і оцінок.", "th": ["Люди часто накладають проєкції на інших (статус, багатство, зовнішній вигляд) замість того, щоб бачити справжню людину — це створює штучну ієрархію \"вищий/нижчий\" і заважає щирим стосункам.", "Проведена практика візуалізації \"аватара\" — образу, зібраного з усіх чужих думок і очікувань (батьків, вчителів, підписників), який людина носить у собі; через \"промінь-зцілення\" цей аватар зменшується, і людина повертає собі право жити своє життя, а не догоджати накопиченим голосам.", "Важливо піклуватися про своє тіло (харчування, спорт, амінокислоти) як про основу довголіття та якості життя — приклад різних жінок одного віку, які виглядають зовсім по-різному залежно від способу життя.", "Чесність і чіткі домовленості в будь-яких стосунках (з клієнтами, партнерами, дітьми) запобігають образам і розчаруванням — краще одразу проговорювати умови взаємодії, ніж мовчати і накопичувати невдоволення.", "Контроль результату чи інших людей забирає енергію; натомість важливо знати, чого хочеш, робити дії, але відпускати очікування щодо того, як і коли це станеться.", "Наведені приклади \"синхронізації\" через думку/намір (масажистки, що почали працювати в унісон, відсутність заторів на дорозі) — ведуча пояснює це через принцип квантової фізики: думка є хвилею, яка впливає на простір.", "Пропонується скоротити кількість запрошених спікерів у клубі на літній період через малу кількість учасників, натомість збільшити особисту присутність ведучої та глибину матеріалу."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "Розстановки з Ольгою Ковальчук. ТРАВЕНЬ", "d": "2025-05-20", "u": "https://youtu.be/hw6m4VColRk", "s": "Це запис групового Майстер Майнду з елементами розстановок, де ведуча допомагає учасницям опрацювати запити щодо бізнесу (квіткова ферма, онлайн-магазин квітів) та особистих стосунків (переговори з колишнім чоловіком про безпеку та умови). Головна ідея — успіх у будь-якій справі залежить від чіткого визначення мети, розділення ролей та відповідальності, а також уміння відпускати контроль і довіряти партнерам.", "th": ["Коли бізнес створюється без чіткої мети заробляти гроші (а лише \"для душі\" чи як хобі), він продовжує притягувати саме такий результат — тому важливо переписати намір і мету, якщо хочеш перетворити справу на прибутковий бізнес.", "У сімейному чи партнерському бізнесі важливо чітко розділяти ролі: одна людина відповідає за \"душу\" продукту (цінності, якість), інша — за операційні бізнес-процеси (продажі, масштабування), і обидва рівні мають бути узгоджені.", "Стосунки \"брат-сестра\" чи \"чоловік-дружина\" і стосунки \"бізнес-партнери\" — це різні рівні взаємодії, які потрібно чітко розмежовувати й окремо домовлятися про умови співпраці.", "Щоб делегувати управління бізнесом, власник має чітко визначити конкретну суму грошей, яку хоче отримувати, та повністю передати оперативне управління, не втручаючись у процеси, подібно до того, як батьки довіряють вихованцям школу чи садочок.", "Постійний контроль без довіри виснажує обидві сторони (і того, хто контролює, і того, хто хоче допомогти) — рішення \"віддати\" повноваження має бути прийняте на 100%, інакше воно не спрацює.", "У складних особистих стосунках (наприклад, з колишнім чоловіком) можна домовитися на нових умовах — чітко визначити свої потреби (фінансова безпека, умови щодо дітей, особиста свобода) і відкрито про них заявити, замість мовчазного очікування чи повернення в старі шаблони стосунків.", "Кожна сторона в переговорах (бізнес-партнерство чи особисті стосунки) має чітко розуміти, що вона отримує натомість — коли обидві сторони задоволені своїми умовами, конфлікт вирішується без \"війни\" й взаємних претензій."], "p": false, "c": "Розстановки", "extra": ""}, {"t": "Дизайн людини. Наталія Поята", "d": "2025-05-08", "u": "https://youtu.be/b2ZrCJga0Gs", "s": "Це запис лекції коуча Наталії Поятої про систему Дизайн людини (Human Design), де вона пояснює чотири основні типи людей — генератор, проектор, маніфестор та рефлектор — та їхні особливості взаємодії зі світом. Головна ідея — розуміння свого типу допомагає приймати рішення, спираючись на власну природу, а не на нав'язані ззовні шаблони, і будувати гармонійні стосунки з собою та іншими.", "th": ["Генератори (70% населення) — енергетичний тип, який рухається по життю через \"відгук\": вони реагують на запитання чи ситуації внутрішнім \"так\" або \"ні\", і їм важливо діяти лише з енергією-відгуком, а не через примус, інакше енергія \"зливається\".", "Маніфестуючим генераторам (швидкий підтип) варто робити проміжні результати та святкувати їх, щоб не втрачати мотивацію на довгих проєктах і доводити справи до кінця.", "Проектори (20% населення) — неенергетичний тип, покликаний спрямовувати інших людей; їм важливо чекати на запрошення для взаємодії, а не нав'язуватися, інакше вони отримують \"гіркоту\" замість визнання та успіху.", "Проектори мають обмежений фізичний ресурс і потребують відпочинку до настання сильної втоми (на відміну від генераторів, які мають чіткий внутрішній сигнал \"вимкнення\"); їм важливо делегувати виснажливі фізичні справи.", "Маніфестори (8% населення) мають закриту, \"відштовхуючу\" ауру, тому їхня стратегія — якомога більше інформувати оточення про свої наміри, а не просто діяти без пояснень, інакше люди можуть чинити опір.", "Рефлектори (1% населення) не мають постійних визначених центрів у карті, живуть за місячним циклом (кожен день інший) і діють як \"дзеркала\", що відображають атмосферу довкола них.", "Емоційні типи людей (близько 50% населення, з коричневим трикутником у карті) потребують часу для прийняття рішень і не повинні поспішати — це їхній внутрішній авторитет, на який важливо спиратися."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "АРТ-терапія з Інною Пронтенко", "d": "2025-05-06", "u": "https://youtu.be/qRw_8_Wdyko", "s": "Це запис заняття з арт-терапії, яке проводить психологиня та мисткиня Іна для групи жінок. Головна ідея — через малювання та прості творчі техніки можна знизити емоційну напругу, подивитися на актуальні життєві ситуації з різних ракурсів і повернутися до ресурсного, гармонійного стану.", "th": ["Перша практика — малювання актуальної ситуації у восьми клітинках з різних перспектив: як зараз, через місяць, очима інших людей, через півроку, якби це сталося з іншою людиною, через рік, через 10 років, і очима Бога/Всесвіту (для чого ця ситуація була дана і який урок з неї винести).", "Погляд на власну ситуацію \"чужими очима\" (наче вона сталася не з тобою) допомагає більш об'єктивно і спокійно оцінити її, побачити, що вона не настільки критична, як здається в моменті переживання.", "Важливо під час малювання відслідковувати свій внутрішній діалог, емоції та реакції — це саме по собі вже дає багато інформації про людину.", "Друга практика — фізичне \"зім'яття\" аркуша паперу як спосіб виплеснути напругу з тіла: усю накопичену негативну енергію, тривожні думки та невирішені ситуації переносять у папір, буквально жмакаючи його \"до дірочок\".", "На пожмаканому аркуші пропонується намалювати три частини: як почуваються люди поруч, коли ти напружена/агресивна; що насправді стоїть за твоєю напругою (страх, бажання контролю, прихована вигода); та можливий вихід із напруженого стану.", "Важливо усвідомити, яку \"приховану користь\" людина може отримувати від напруги чи конфлікту (наприклад, жінки іноді свідомо чи несвідомо сваряться з чоловіком чи дітьми, щоб домогтися бажаного).", "Такі прості арт-терапевтичні техніки не потребують багато часу, їх можна використовувати миттєво в моменти стресу (наприклад, зім'яти папір на роботі), щоб не накопичувати напругу в тілі, а швидко повертатися до гармонійного, ресурсного стану."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Мастермайнд з Ольгою Ковальчук. КВІТЕНЬ", "d": "2025-04-21", "u": "https://youtu.be/t0r10E5Q7AI", "s": "Це запис Мастермайнду, де ведуча відповідає на запити учасниць — про фінанси в бізнесі та про побудову особистого бренду в соціальних мережах. Головна ідея: усвідомлене управління грошима (зарплата, резервний фонд) та чітке розуміння своєї цільової аудиторії й цінностей є основою стабільності — як фінансової, так і в публічному проявленні себе.", "th": ["Власник бізнесу має платити собі фіксовану зарплату як операційну витрату, а не жити на залишок коштів після оплати всіх інших витрат — залишок після зарплати вважається прибутком/дивідендами.", "Для кожного бізнес-напрямку варто формувати окремий резервний фонд (мінімум на кілька місяців постійних витрат), щоб форс-мажорні мінуси не створювали стресу і кассових розривів.", "Важливо заздалегідь продумувати «тормозний шлях» — план дій та термін, потрібний для згортання чи закриття бізнес-напрямку, якщо він раптом стане нежиттєздатним.", "Варто впорядкувати процес оплати рахунків і реклами через чіткий регламент (окремий чат, фіксовані дні тижня для оплат) замість хаотичного «гасіння пожеж» щодня.", "В управлінні командою краще фокусуватися на результаті, який дає людина, а не на тому, як саме вона виконує роботу («імітація бурної діяльності» без результату — проблема багатьох працівників).", "У побудові особистого бренду в соцмережах слід чітко визначити цільову аудиторію за цінностями, а не гнатися за масовістю чи кількістю підписників — тоді контент і люди навколо стають «своїми».", "Контент можна готувати наперед (банк заготовлених відео/сторіс), щоб не залежати щодня від натхнення і мати «резерв» на кілька місяців.", "Ходьба без навушників і музики, з наміром чи без нього, названа інструментом для виходу зі стану застою/депресії та для отримання нових ідей і рішень."], "p": false, "c": "Мастермайнди", "extra": ""}, {"t": "Стан і Енергія — валюта майбутнього. Ольга Редчиць", "d": "2025-04-15", "u": "https://youtu.be/s2qkxPsLhv4", "s": "Це запис вебінару спікерки Ольги (енергопрактика) на тему \"стан і енергія як валюта нинішнього часу\", де вона розповідає про зв'язок внутрішнього стану людини з фінансовим достатком. Головна ідея — гроші є побічним ефектом правильного стану та усвідомлених виборів, а не результатом важкої праці \"з нужди\", і кожні 10 секунд людина може переобрати свою реальність через зміну внутрішнього налаштування.", "th": ["Гроші притягуються не через важку працю, а через слідування власній місії — коли людина створює цінність для інших, гроші приходять як неминучий побічний ефект.", "Наша реальність формується через питання, які ми собі задаємо: замість \"чому в мене нічого не виходить\" варто питати \"якою енергією мені бути, щоб отримати бажане\" — це змінює траєкторію подій.", "Гроші порівнюються з енергією, яка \"любить тусовку\" — якщо людина живе у стані обмеження, тривоги чи відкладає задоволення \"на чорний день\", гроші так само уникають її життя.", "Кожні 10 секунд людина робить вибір, який зминює її реальність; будь-яку небажану ситуацію можна \"перевибрати\", визнавши \"я так більше не хочу\" і свідомо обравши інший стан.", "Важливо навчитися дякувати своєму тілу та собі за пройдений шлях, приймаючи поточний стан як достатній, замість постійного бігу за досягненнями — саме з розслабленого стану народжуються найкращі проєкти.", "Не варто \"схлопуватися\" через критику інших людей щодо своїх ідей — важливо слухати передусім себе, оскільки ідеї, що випереджають час, можуть здаватися недоречними, поки не настане їхній момент.", "Практика \"уяви, що можливо все\" (де б я жила, з ким, як би виглядала) допомагає розкрити підсвідомі обмеження та мріяти по-максимуму, оскільки мрії безкоштовні, а страх реалізації — це часто \"провірочний\" механізм психіки, який варто усвідомлено долати."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Розстановки КВІТЕНЬ. Ольга Ковальчук", "d": "2025-04-14", "u": "https://youtu.be/p6IoxLy4Nmg", "s": "Це запис групового Майстер Майнду з елементами розстановок, де ведуча проводить дві розстановки — для Мирослави (щодо розвитку її справи та стосунків із партнером у бізнесі) та для Яни (щодо повернення до чоловіка після розлучення), а також розстановку для Віки щодо продажу чи збереження кількох бізнесів (готель, ресторан, інстаграм, фірма). Головна ідея — справжні зміни і рух вперед стають можливими лише тоді, коли людина перестає боротися з собою, довіряє власним рішенням і вважає кожне з них правильним для себе, а не шукає підтвердження ззовні.", "th": ["Немає жодного місця на планеті, де буде \"краще\" — краще там, де людина сама вирішує бути собою і почуватися добре, і саме з цього внутрішнього стану варто починати будь-які зміни.", "Коли людина перестає боротися з важким чи неприємним станом і визнає, що навіть у ньому є свій ресурс, починаються реальні зміни — \"боротьба\" лише виснажує і затримує на місці.", "У розстановці для Мирослави виявилось, що частина \"Я\" (его, бажання бути головною) заважає розвитку справи, тоді як щирість, легкість і жіноча енергія (\"Ер\") допомагають руху вперед; справі потрібне визнання і тепла увага, а не тиск чи контроль.", "Дитині потрібно йти за батьком, а не батькам підлаштовуватися під дитину — коли мати вибирає себе, а не постійно жертвує собою заради дітей, це формує в дітей стійкість, навіть якщо в моменті їм складно.", "Кожне прийняте рішення варто вважати правильним для себе в цю секунду, замість нескінченного самокопання (\"правильно чи неправильно я зробила\") — саме сумніви і внутрішня боротьба з собою заважають довіряти собі і рухатися далі.", "У розстановці для Віки з'ясувалося, що поки фокус був лише на грошах, готель (справа \"для душі\") втрачав цінність, але коли додався ресурс (легкість, гра, цікавість), усі напрямки бізнесу \"ожили\"; зрештою фірму краще не продавати, а передати дочці, а самій зосередитися на готелі й ресторані.", "Одна з учасниць (Іра) поділилася містичним досвідом про \"чорного монаха\" і символіку локації одного з ресторанів (назва з чортами), що ілюструє тему енергетики місця та важливості довіряти інтуїтивним сигналам під час прийняття рішень."], "p": false, "c": "Розстановки", "extra": ""}, {"t": "Інвестиції в дохідну готельну нерухомість разом із Ribas Invest — від 5000$. Яна Кузнєцова", "d": "2025-04-10", "u": "https://youtu.be/KLv6Oheaq6Y", "s": "Це запис вебінару Яни Кузнецової, співвласниці компанії RebusInvest, про інвестування в дохідну готельну нерухомість в Україні та за кордоном (Балі, Польща). Головна ідея — готельна нерухомість є сучасним інструментом пасивного доходу з прогнозованою дохідністю 8-12% річних, доступним навіть з невеликим стартовим капіталом через механізм часткового інвестування.", "th": ["Готельна нерухомість відрізняється від звичайної оренди квартир тим, що керуючий готельний оператор бере на себе всю операційну роботу (ремонт, меблі, пошук гостей), а власник отримує пасивний дохід і може безкоштовно відпочивати у власному об'єкті певну кількість днів на рік.", "Компанія виділяє два основні ризики інвестора (недобудова, порушення термінів, невідповідність якості рендеру) та показує, що ці ж ризики розділяє готельний оператор, чиї інтереси співпадають з інтересами інвестора, оскільки він теж заробляє від успішної реалізації проєкту.", "Існують дві основні стратегії інвестування: \"гра вдовгу\" (утримання нерухомості для отримання пасивного доходу тривалий час) та \"фліппінг\" (купівля на ранній стадії будівництва з метою перепродажу після зростання вартості, зазвичай близько 30% за період будівництва).", "Долівé інвестування дозволяє входити в проєкт з чеком від 5-10 тисяч доларів, стаючи співвласником частки в юридично оформленому кооперативі (асоційованому товаристві), з можливістю поступово докуповувати частки та отримувати дивіденди пропорційно своїй частці.", "Більшість готельної нерухомості в Україні будується в Карпатському регіоні (Поляниця, Буковель, Яремча, Східниця) через відносну безпеку та наявність розвиненої туристичної інфраструктури, і ринок готелів там ще не насичений, попри поширену думку про \"мильну бульбашку\".", "За дослідженнями компанії, 65% інвесторів є емоційно-імпульсивними (обирають об'єкт за враженнями і концепцією), а 35% — прагматичними (орієнтуються виключно на цифри дохідності), що впливає на розробку різних концепцій готелів (тематичні номери, бутик-готелі, ділові готелі).", "Незважаючи на війну, динаміка показує зростання частки іноземних туристів (5-10% цієї зими) та стабільний інтерес українців до внутрішнього туризму, а компанія прогнозує подальше зростання популярності подорожей Україною навіть після відкриття кордонів."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Зустріч з учасницями КВІТЕНЬ. Ольга Ковальчук", "d": "2025-04-07", "u": "https://youtu.be/0CVlICX71rQ", "s": "Це запис прямого ефіру, де спікерка розповідає про поняття «ментальної бідності» — внутрішні обмеження мислення, які заважають людині дозволяти собі краще життя навіть за наявності фінансових можливостей. Головна ідея: справжнє розширення й достаток приходять не через накопичення чи контроль, а через дозвіл собі якісного життя, усвідомлення власних потреб та прийняття відповідальності за свої рішення й результати.", "th": ["«Ментальна бідність» проявляється в дрібницях — коли людина може дозволити собі дорогі речі напоказ, але економить на тому, що ніхто не бачить (приклад із туалетним папером чи орендою квартири).", "Важливо розрізняти дії та результат: брати відповідальність варто за результат, а не лише за дії — тоді навіть невдалий досвід не знецінюється і не підриває впевненість у собі.", "Віддавати свою силу (перекладати відповідальність за своє життя на обставини, інших людей чи систему) означає ставати безсильним; натомість варто усвідомлено приймати власні рішення та їх наслідки.", "Не варто конфліктувати із системою, яка більша за одну людину (державою, школою, реальністю) — краще адаптуватися або змінювати своє оточення чи умови.", "Є різниця між потребами й бажаннями: потреба — це те, що реалізується швидко й «саме собою», коли людина чує сигнали свого тіла; бажання ж можуть довго залишатися нереалізованими, доки не стануть усвідомленою потребою.", "Вміння вчасно зупинитися, відмовитись або почекати (не доводячи себе до краю) зберігає ресурс і є частиною здорової відповідальності за себе.", "Не варто порівнювати себе з іншими людьми — коректно порівнювати себе теперішнього із собою в минулому, щоб бачити власний прогрес і трансформацію.", "Досягнення результатів не повинно базуватися на «силі волі» та напруженні (це описується як більш «чоловічий» підхід) — ефективніше діяти з розслаблення, задоволення й дозволу собі, а не з примусу."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "Пігулка \"сон\" - як безкінечний ресурс. Ольга Козик", "d": "2025-04-03", "u": "https://youtu.be/_6laa-y3N9U", "s": "Відео-вебінар лікаря-сомнолога Ольги Козик про те, що якісний сон є базовим ресурсом, який визначає здоров'я, зовнішній вигляд, гормональний баланс, психоемоційний стан і успішність людини в усіх сферах життя. Головна ідея: сон недооцінений у порівнянні з харчуванням і спортом, хоча саме він є першочерговим фактором, без налагодження якого інші зусилля щодо здоров'я неефективні, а хронічне недосипання призводить до раку, серцево-судинних хвороб, Альцгеймера та скорочення життя на ~20 років.", "th": ["Під час глибокої фази сну виробляється фермент теломераза, який відновлює хромосоми клітин і уповільнює старіння організму на клітинному рівні.", "Саме уві сні НК-кілери знищують ракові клітини, а з мозку вимивається бета-амілоїдний білок, що спричиняє Альцгеймер — тому недосипання є прямим фактором ризику цих захворювань.", "Важлива не лише тривалість сну (норма — близько 8 годин), а й якість, зокрема тривалість глибокої фази сну; людина може спати 8 годин і мати лише 40 хвилин глибокої фази, що є ознакою неякісного сну.", "Основна причина порушення глибокої фази сну — перенапруга жувальних м'язів голови та шиї через «інформаційний стрес», а не гаджети чи світло самі по собі.", "Порада «не дивитись у телефон за 2 години до сну» пов'язана з мелатоніном, який є наслідком сну, а не причиною засинання (причина — аденозин); достатньо перевести гаджети в нічний режим.", "Хронотип людини (жайворонок/сова/голуб) визначається 22 генами, і насильна зміна режиму сну під «жайворонковий» стандарт шкідлива для тих, хто генетично не є жайворонком.", "Ознаки неякісного сну: складно заснути, прокидання від найменшого шуму, відчуття невиспаності після довгого сну, дратівливість, брак концентрації, забудькуватість і тривожність.", "Храп значно погіршує архітектуру сну (спричиняє «рваний сон») і, за дослідженнями, скорочує тривалість життя приблизно на 20%.", "Для здорових стосунків і довголіття обох партнерів рекомендується спати в різних приміщеннях (окремо від сексуального життя)."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Розстановки з Ольгою Ковальчук. Березень 2025", "d": "2025-03-26", "u": "https://youtu.be/vMtpnktexJA", "s": "Це запис групової сесії \"розстановок\" — методики, де учасниці по черзі виконують ролі (сама людина, її \"реалізація\", інші фігури з життя запитувача), а ведуча інтерпретує їхні відчуття для розкриття прихованих блоків. У сесії розібрано три запити: пошук власної реалізації, повторюваний сценарій стосунків з чоловіками-алкоголіками та бажання фінансової і професійної реалізації, заблокованої \"розчиненням\" у ролі \"хорошої дівчинки\" та тата.", "th": ["Розстановка дозволяє \"зі сторони\" побачити ситуацію через відчуття інших людей, які, за словами ведучої, відчувають істину ситуації, не будучи заангажованими особисто.", "Для запиту про \"повернення до себе\" й реалізацію рекомендовано щоденні прогулянки 20-30 хвилин без музики й телефону, рухаючись за \"внутрішнім компасом\" (інтуїтивно обираючи напрямок), щоб вимкнути раціональний контроль голови.", "Ключова ідея — \"здатися\": коли людина перестає намагатися все контролювати й вирішувати сама (\"я Геракл\"), а свідомо визнає, що більше не може і віддає ситуацію \"Всесвіту\", рішення часто приходять швидко й самі собою.", "У другому запиті (про повторюваний сценарій стосунків з чоловіками, які п'ють) виявлено образ \"штиря\" в чоловікові, який трактується як тиск очікувань та встановлена жінкою ментальна установка щодо \"сильних чоловіків\" — коли жінка знімає із себе й партнера очікування, стан у розстановці змінюється на легший.", "Практика \"розсоздаю, уничтожаю очікування\" з рахунком до дев'яти (символ \"смерті неусвідомленості\") використовується як спосіб енергетично звільнитися від очікувань до себе та інших.", "Ведуча застерігає: після розстановки не варто самостійно \"розковирювати\" чи аналізувати минуле, а краще переключатися на створення образу бажаного майбутнього, інакше можна \"зірвати\" вже зроблену енергетичну роботу.", "У третьому запиті (про професійну реалізацію) з'ясувалося, що жінка \"розчинилася\" в ролі слухняної дочки й дружини (образ батька, що завжди \"знає краще\"), і щоб знайти себе, запропоновано повернутися до відчуттів дитинства — фізично робити дитячі речі (стрибати на батуті, качелях), щоб \"перезапустити\" здатність мріяти і бачити власні бажання.", "Ведуча рекомендує переслуховувати запис своєї розстановки не раніше ніж через тиждень, оскільки ефект та усвідомлення розкриваються поступово, з індивідуальною швидкістю для кожної учасниці."], "p": false, "c": "Розстановки", "extra": ""}, {"t": "Мастермайнд з Ольгою Ковальчук. Березень 2025", "d": "2025-03-24", "u": "https://youtu.be/m4u8vg7Y_lE", "s": "Це запис Мастермайнду, де ведуча відповідає на запити учасниць — про синхронізацію із собою після особистісного росту, розрив стосунків та незавершені питання з колишніми партнерами, кар'єрні перевірки та розширення особистого бренду. Головна ідея: щоб отримувати бажане в житті, потрібно спочатку віддавати (енергію, увагу, турботу), а незакриті питання й недомовленості з людьми рано чи пізно \"наздоганяють\" і забирають ресурс, тому їх краще проговорювати вчасно.", "th": ["Ефект \"педалі й ручника\": коли людина рухається в розвиток діями (педаль), але підсвідомо себе стримує (ручник), стається різкий спад чи \"відторгнення\" — це перевірка на шляху до нового рівня, і повернутися до руху допомагає практика відчуття власних тілесних меж/кордонів.", "Незакриті домовленості (наприклад, технічна залежність від колишнього чоловіка, недомовлене бізнес-партнерство) створюють \"канатик\", який тримає людину прив'язаною до іншої людини навіть після формального розставання — це потрібно вчасно проговорювати й завершувати.", "Утримання зв'язку з колишнім партнером часто дає приховану \"вигоду\" (відчуття потрібності, відсутність самотності), і поки людина не усвідомить цю вигоду й не відпустить, нові стосунки чи можливості не зможуть з'явитися.", "Жалість до себе чи до іншої людини — низька вібрація; замість жалю рекомендується дозволяти собі сум, але не звинувачувати себе за прийняті рішення.", "Для отримання бажаного результату (наприклад, кращих стосунків із колишнім чоловіком заради дітей) потрібно спочатку \"віддати\" на енергетичному рівні (побажати іншому добра, більшої любові дітей до нього тощо), а не намагатися одразу отримати, нічого не віддавши.", "Практика щирого побажання добра іншій людині (від серця, з налаштуванням на її потреби) описується як спосіб отримати бажаний результат у взаємодії з людьми — наведено особистий приклад оформлення страховок у Німеччині.", "Кар'єрні пропозиції, які людина відхиляє (наприклад, повторні пропозиції керівної посади), можуть бути \"перевіркою\" готовності людини дозріти до масштабування власної справи чи особистого бренду, а не просто випадковістю.", "Наведено особисту історію про діагностику за допомогою \"принтів\" (тканинних платків) у бутику Хелісен, яка нібито точно розповіла деталі минулого (включно з фактом зради чоловіка) — цей досвід описаний як поштовх до роздумів про можливість \"не підлаштовуватися\" під партнера в стосунках з фінансово успішною людиною."], "p": false, "c": "Мастермайнди", "extra": ""}, {"t": "Євгенія Розумна. Енергія впливу: як внутрішні трансформації формують успішний бізнес і життя", "d": "2025-03-20", "u": "https://youtu.be/IUHSr10rFuU", "s": "Це запис лекції трансформаційного бізнес-коуча та енерготерапевта Євгенії Розумної про вплив енергії на бізнес і особисте життя. Вона розповідає про свої методи роботи (бізнес-розстановки на метафоричних картах, тілесно-енергетичні практики Access Consciousness, медіацію), демонструє розстановку наживо з учасницею та завершує зустріч груповою енергетичною медитацією.", "th": ["Всесвіт складається з енергії, і за квантовою фізикою хвиля перетворюється на матерію (частку-електрон) тільки в момент спостереження — тобто те, на що людина спрямовує увагу та енергію, стає її реальністю.", "Кожна думка має електричний заряд, а емоція — магнітне випромінювання; разом вони формують унікальне електромагнітне поле людини, з якого вибудовується її життя.", "Одночасно існує багато «гілок реальності» (варіантів майбутнього), і щоб потрапити в бажаний варіант, потрібно змінити свою вібрацію (спосіб мислення) на ту, яка відповідає цій реальності.", "У бізнес-розстановках на метафоричних картах бізнес символізується окремою карткою, і часто виявляється, що людина проєктує на бізнес особисті стосунки (з дитиною, батьками, партнером тощо), а не ставиться до нього суто по-бізнесовому — усвідомлення цього змінює мислення і рішення.", "Бізнес створюється як «енергетична сутність» із власною ДНК/початковим завданням (наприклад, довести щось батькам), і якщо ця мета вже неактуальна або сформована з травми, бізнес продовжує «прагнути» її виконати, поки ДНК не оновити.", "Інструменти Access Consciousness (зокрема Access Bars — торкання точок на голові) дозволяють глибоко розслабити мозок і дістатися до базових підсвідомих переконань («коріння»), а не проробляти окремі наслідки («листочки») роками.", "Все, що не подобається людині в оточенні чи інших людях (тригери, кривдники), є віддзеркаленням того, як вона сама ставиться до себе; зміни варто починати з усвідомлення власного ставлення до себе та чіткого бачення того, чого людина хоче замість наявної ситуації."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Софія Поцелова. Жіноче здоровʼя та сексуальна енергія.", "d": "2025-03-11", "u": "https://youtu.be/ZEZlvF8gaQk", "s": "Це запис лекції жіночого тренера та вчителя кундаліні-йоги Софії Поцелової про жіноче здоров'я, сексуальну енергію та тренування інтимних м'язів. Вона поєднує знання даоських практик з фізіологією, пояснює зв'язок кровообігу в тазовій ділянці з жіночим збудженням і проводить з учасницями три практичні вправи для активації сексуальної енергії.", "th": ["За даоськими практиками, у жінки є \"сексуальний насос\" (куприк/крижі), що накачує сексуальну енергію — джерело харизми, притягальності та здатності повноцінно проживати життя.", "М'язи тазового дна (\"королівське сідло\") утримують сексуальну енергію в трьох центрах (вагіна, уретра, анус); фізіологічні проблеми в цих зонах (нетримання, слабкі м'язи після пологів) означають, що енергія \"витікає\" і не утримується.", "Розтирання куприка кулачками (не більше 3 хвилин) активує кровообіг у промежності та є помічником при проблемах зі збудженням і зволоженням, оскільки посилений кровообіг фізично викликаний рухом клітора.", "Жінку збуджують зверху вниз, а чоловіка знизу вгору; фінальним індикатором потягу є саме стан інтимних м'язів і кровообіг у піхві, а не просто бажання в голові.", "При збудженні піхва стає теплішою за статевий член чоловіка на кілька градусів — це фізіологічний сигнал, який чоловік відчуває і який неможливо підробити.", "Регулярне стискання м'язів тазового дна (техніка Кегеля в поєднанні з рухом тазом) покращує кровообіг у репродуктивних органах, є профілактикою застійних явищ (фіброматозні вузли, кісти, поліпи) та опосередковано впливає на роботу яєчників.", "Масаж яєчників долонями (рухи \"на себе\" з попереднім розтиранням долонь) описаний як практика для \"розігріву\" яєчників, оскільки за даоською концепцією жіноча енергія холодна, і розігріті яєчники сприяють енергообміну з чоловіком, а не забиранню в нього енергії.", "Авторка підкреслює, що жінка є емоційно й енергетично сильнішою за чоловіка (\"у 9 разів потужніша\"), і коли жінка бере відповідальність за власний стан і \"повертається\" в тіло та жіночність, чоловік поруч автоматично починає більше проявляти чоловічу роль."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Оксана Загорулько - «Vita Vertebra: оздоровлення тіла через дихання та рух». Практична частина", "d": "2025-03-06", "u": "https://youtu.be/A7SN0YJUKrU", "s": "Це продовження практичного заняття тренерки Оксани з методики \"Віта Вертебра\" — вона демонструє учасницям конкретні вправи (дихання зі звуком \"тя\", силову хвилю, вакуумне втягування живота, кошку-собаку, вправи Кегеля, пальчикову гімнастику) з поясненням правильної постави, постановки стоп та дихання. Головна ідея: прості щоденні рухи у поєднанні з особливим диханням відновлюють природну біомеханіку тіла, знімають напругу та стрес без виснаження організму.", "th": ["Стопи завжди мають стояти паралельно одна одній (і сидячи, і стоячи) — це анатомічно правильне положення, яке забезпечує природну опору тілу; неправильна постановка стопи веде до проблем з колінами, тазом, поперековим відділом, шиєю та навіть мігренями.", "Сидіти потрібно на сідничних буграх, а не на стегнах, розвантаживши сідниці, інакше пережимаються вени.", "Особливе дихання зі звуком «тя» на видиху — запатентований елемент методики: воно розтягує й масажує носогубну складку та обличчя (природний ліфтинг), а також насичує організм киснем.", "Діафрагма — головний м'яз дихання; коли вона розправлена і працює правильно, покращується кровообіг, нормалізується тиск і краще функціонують органи ШКТ.", "Вправу Кегеля (для тазового дна) рекомендується робити щодня — і жінкам, і чоловікам, оскільки вона запобігає опущенню внутрішніх органів та сексуальній дисфункції.", "Після кожної вправи важливо «скидати напругу» силовою хвилею (природний рух п'ятка-носок з коливаннями хребта), щоб м'язи та фасції не залишалися перезажатими.", "Є прості вправи для конкретних потреб: «кошка-собака» для зняття болю в спині, вправа для зменшення набряків на ногах (лімфодренаж), «конструктор лего» (по хребцю вставляння хребта) та дихання частинами тіла для полегшення засинання.", "Певні популярні вправи з йоги/пілатесу (поза кобри з максимальним підйомом голови, «королівський гол», глибокі нахили) вважаються травмонебезпечними і в цій методиці виключені або виконуються в полегшеному варіанті."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Оксана Загорулько - «Vita Vertebra: оздоровлення тіла через дихання та рух». Теоретична частина", "d": "2025-03-06", "u": "https://youtu.be/4PiQVfGRhCY", "s": "Це запис презентації тренерки (Оксани), яка розповідає про авторську оздоровчу методику Vita Vertebra на основі дихальної гімнастики та м'яких вітальних рухів, розроблену Любов'ю Володимирівною. Головна ідея: регулярне правильне дихання й рух здатні відновлювати тіло, зупиняти хронічні захворювання та уповільнювати процеси старіння без вікових чи гендерних обмежень.", "th": ["Методика виникла завдяки досвіду засновниці, яка працювала при ЮНЕСКО з біженцями, після того як сама пережила серцевий напад, і почала застосовувати відпрацьовану на інших методику на собі.", "Заняття побудовані так, що людина не виснажується (не робить багато повторів, а виконує вправи з особливим диханням), і після них залишається енергія на інші справи, а не лише на відпочинок.", "Хронічний стрес призводить до постійного напруження м'язів, фасцій і внутрішньоклітинного матриксу, через що поживні речовини (зокрема кальцій) не доходять до потрібних органів і тканин, що, зокрема, пояснює ризик остеопорозу та переломів шийки стегна.", "Правильне дихання і вітальний (м'який, хвилеподібний) рух відновлюють нормальну роботу фасцій, крові, лімфи та інших внутрішніх систем організму.", "За методикою, за 3-4 місяці занять уповільнюється «біологічний годинник старіння» (згадується Нобелівська премія 2017 року за відкриття цього механізму).", "Методика позитивно впливає на нормалізацію артеріального тиску та є профілактикою серцево-судинних захворювань, які є основною причиною смертності у світі.", "Є прості вправи для швидкого зняття стресу та болю (наприклад, кілька дихальних циклів, вправа «кішка-собака» зі спеціальним диханням від болю в спині), які можна виконувати за кілька секунд в машині, офісі чи ліфті.", "Практикувати методику можна за будь-якого віку, статі та наявності хронічних захворювань, окрім гострих станів (закладений ніс, температура, свіжі травми), які потребують звернення до лікаря."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Мастермайнд з Ольгою Ковальчук. Березень 2025", "d": "2025-03-05", "u": "https://youtu.be/gyZLuaz6x2c", "s": "Це запис Мастермайнду, де ведуча розмірковує про вибір \"себе\" замість грошей у щоденних рішеннях (комфорт, речі, подорожі), ділиться особистим досвідом розширення внутрішніх стандартів дозволеності та обговорює з учасницями теми грошей, роботи і поточні новини. Головна ідея: коли людина систематично обирає власний комфорт і легкість замість економії \"заради грошей\", фінансовий рівень поступово підіймається, тоді як жертвування собою заради заощаджень блокує розширення.", "th": ["Питання \"кого я зараз вибираю — гроші чи себе\" пропонується задавати в побутових ситуаціях (тягати важкі сумки/воду самій замість замовити доставку, стояти в черзі замість VIP-проходу) — це показник того, чи людина ставить гроші вище за власний комфорт.", "Гроші названі \"поворотним ресурсом\" — нестабільною субстанцією, яка може з'явитися і зникнути, тому жертвувати собою заради їх накопичення, на думку ведучої, нераціонально.", "Коли людина вже раз побачила, \"як можна по-іншому\" (наприклад, відпочивати у VIP-ложі чи літати преміум-класом), їй важче повертатися до гіршого варіанту — досвід кращого сервісу підвищує внутрішній стандарт дозволеності.", "Рекомендується приміряти речі в магазинах, не дивлячись спочатку на цінник, а орієнтуючись на те, що подобається, і лише потім вирішувати \"так\" чи \"ні\" — щоб цінник не блокував вибір на рівні бажання.", "Особистий \"рівень дозволеності\" з часом розширюється поступово (приклад із сумками Hermès: спочатку повне заперечення бажання, з часом — усвідомлене бажання і знання деталей) і має розширюватися через легкість, а не через стрес чи надрив бюджету.", "Заздалегідь заброньований і частково передплачений відпочинок (техніка \"заплатити 10% наперед\") описана як спосіб гарантовано реалізувати вибір \"себе\", оскільки шкода втратити передоплату мотивує довести справу до кінця.", "Ведуча ділиться особистою рефлексією про \"історію роботи\" — усвідомлення, що прагнення обов'язково працювати могло бути прищепленим переконанням з дитинства/сім'ї, і розповідає про знайомих жінок, у яких взагалі відсутнє поняття \"треба працювати\" для забезпечення життя."], "p": false, "c": "Мастермайнди", "extra": ""}, {"t": "Зустріч з Олею Ковальчук. Березень 2025", "d": "2025-03-04", "u": "https://youtu.be/IvE9BHU6k58", "s": "Це запис Мастермайнду, де ведуча ділиться особистим досвідом фінансового обліку та розповідає про свою участь у групових \"розстановках\", які дивилися на світові події (зустріч Зеленського з Трампом, ролі Європи, США, тіньового уряду). Головна ідея: замість того, щоб піддаватися стресу від зовнішніх глобальних подій, важливо зберігати внутрішню опору, дбати про власне тіло і емоційний стан, оскільки саме це — єдине, на що людина реально може впливати.", "th": ["Особистий приклад ведучої показав, як несистемний облік дрібних сум і переказів між рахунками призводить до \"розчинення\" грошей — регулярний детальний облік фінансів допомагає це відстежувати.", "У розстановці на світові події учасниці відчули Європу як \"втомлену матір\", яка довго спостерігала за конфліктами, але вже готова втрутитися, а Трампа й Маска описали як \"фігури\", підконтрольні \"тіньовому уряду\" США.", "Головна рекомендація щодо реагування на новини та геополітичні потрясіння — не віддавати їм свою енергію через страх чи паніку, а зберігати внутрішню опору і концентруватися на власному житті, оскільки задоволена, стабільна людина створює навколо себе позитивні вібрації.", "2025 рік визначено як \"рік тіла\" — регулярні тренування, масажі, тілесні практики та контроль аналізів названі пріоритетними, оскільки м'язова маса краще проводить енергію/електроліти, а тіло має \"пропускну здатність\" для вібрацій, що постійно зростають.", "Мозок за замовчуванням опирається будь-яким змінам (навіть корисним), оскільки зміни енергозатратні, тому нові звички варто впроваджувати поступово, невеликими кроками.", "Практика \"емоційної гігієни\" — не сварити себе за помилки, дозволяти собі відпочинок і підтримку — допомагає тілу залишатися розблокованим і не накопичувати психологічну напругу.", "Важливо прислухатися до інтуїції (\"чи буде це вкладом для мене\") замість автоматичного слідування логіці розуму (его), який базується лише на минулому досвіді й опирається новому.", "У розмові згадано теорію про особливий \"територіальний генокод\" і сильну духовну/психологічну стійкість (резилієнтність) українців порівняно з \"вивченою безпорадністю\" — це наведено як пояснення значного культурного та геополітичного інтересу до України."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "Суфійська практика з Ілоною Матвієнко", "d": "2025-02-24", "u": "https://youtu.be/oh0lCwERkE4", "s": "Це запис групової тілесно-емоційної практики, яку проводить цілісний терапевт Ілона — активна дихально-рухова техніка з мантрою суфійських монахів, спрямована на вивільнення накопичених у тілі емоцій через послідовне опрацювання семи енергетичних центрів (чакр). Головна ідея: непрожиті емоції та придушені почуття залишаються в тілі у вигляді м'язових затисків, і через дихання, рух, голос та увагу їх можна вивільнити, повертаючи людині внутрішню свободу та зв'язок із собою.", "th": ["Непрожиті емоції та почуття, які людина стримувала (через виховання, соціальні норми), не зникають, а залишаються в тілі, м'язах і фасціях, формуючи з часом \"м'язовий панцир\".", "Основні чотири тілесні інструменти для вивільнення тіла — дихання, рух, увага та голос; голос вважається найпотужнішим інструментом, що створює вібрацію, яка вивільняє напругу.", "Практика психіці \"байдуже\", чи досвід прожитий у реальному житті, чи в тренінговому/практичному форматі — вона однаково записується як пройдений досвід, тому проживання складних станів у практиці допомагає легше проходити подібні ситуації в житті.", "Рекомендація \"плюс 10%\": якщо в процесі складно щось зробити (дихати активніше, звучати голосніше), не варто форсувати себе одразу на 100%, а лише трохи виходити за межі поточного комфорту, без насилля над собою.", "Практика структурована як рух знизу вгору через сім чакр (від Муладхари — безпека/земля, до Сахасари — зв'язок із вищим \"Я\"), кожна з яких пов'язана з певними темами (страхи, провина/сором, сила/дії, любов, проявленість, інтуїція, духовність).", "Під час практики можуть виникати фізичні реакції — запаморочення, позиви до блювоти, кашель, сльози — це вважається нормальним проявом вивільнення тілом накопиченої напруги, і їх не варто стримувати.", "Після практики рекомендується прийняти ванну/душ із сіллю або содою для очищення енергії, помити голову, і протягом дня не занурюватися одразу в справи чи телефон, а побути в контакті з новими відчуттями та бажаннями, які могли з'явитися."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Рзстановки з Олею Ковальчук. Лютий 2025", "d": "2025-02-20", "u": "https://youtu.be/ii6s-YiC4y8", "s": "Це запис групової сесії \"розстановок\" у клубі, де учасниці по черзі формулюють запити (робота мрії, будинок, автомобіль, нова справа) і разом з іншими учасницями, які виконують ролі різних фігур (сам запит, перешкоди, гроші, майбутнє \"я\"), досліджують свої внутрішні блоки та бажання. Головна ідея: щоб бажане матеріалізувалося, потрібно чітко знати, чого саме хочеш (а не тільки чого не хочеш), дозволити собі це хотіти для себе, а не з голови чи чужих очікувань, і розслабитися замість напруження.", "th": ["У запиті про роботу мрії з'ясувалося, що учасниці бракує не конкретного плану дій, а внутрішньої впевненості та довіри до себе — саме ці якості, а не хаотичні думки, ведуть до знаходження бажаного.", "При розстановці на тему грошей виявлено, що фінансовий потік не зростає, якщо людина чітко не визначила, для чого їй потрібні гроші — планувати варто не лише витрати, а й конкретну мету доходів.", "У запиті про будинок з'ясувалося, що учасниця подумки будувала простір для інших людей (батьків, гостей), а не для себе, через що не могла \"побачити\" свою мрію цілісно; коли вона дозволила собі створити будинок лише для власного комфорту, з'явилася ясність.", "Ведуча ділиться особистим досвідом купівлі квартири та автомобіля: коли є чітке, конкретне бажання (а не розмите \"чогось хочу\"), обставини й люди, що допомагають це реалізувати, знаходяться самі, часто несподіваним чином.", "Пропонується техніка \"семи цілей\": щодня записувати сім конкретних цілей — це допомагає або зрозуміти, що ціль насправді не своя (і перестати про неї думати), або, навпаки, дійти до втоми від самого писання і почати реально діяти для її досягнення.", "У запиті про вибір авто (седан/Гелендваген) з'ясувалося, що \"правильний\" вибір визначається не логікою (економічністю чи практичністю), а тим, з яким варіантом людина відчуває найбільший емоційний відгук і легкість, навіть якщо це суперечить попереднім раціональним міркуванням.", "У запиті про нову справу (в ІТ чи щось нове) виявилося, що \"нова справа\" — це фотографія, а стара робота в ІТ у полі розстановки викликала фізичне напруження (стиснута щелепа) та відчуття \"злості\" й тиску, тоді як новий напрямок приніс відчуття тепла і розслаблення."], "p": false, "c": "Розстановки", "extra": ""}, {"t": "Зустріч з Олею ковальчук. Лютий 2025", "d": "2025-02-19", "u": "https://youtu.be/ffBhR6CCFTM", "s": "Це запис зустрічі спільноти, де ведуча розповідає про створення власної реальності через внутрішні стандарти, а також торкається тем жертовності та жалості. Головна ідея: реальність людини формується не головою, а внутрішньою узгодженістю з собою — тіло ніколи не бреше, і якщо не погоджуватися на менше, ніж хочеться, і не жаліти інших (адже жалість — це форма приниження іншої людини), життя починає складатися легко і \"магічно\".", "th": ["Реальність створюється не силовим \"витягуванням\" бажаного у Всесвіту (насилля над простором виснажує і в результаті дає непотрібне), а внутрішньою узгодженістю — станом, коли зовнішній вибір відповідає справжньому внутрішньому бажанню.", "Для мозку і Всесвіту не існує поняття \"велике\" чи \"мале\", \"дорого\" чи \"дешево\" — це суто людські категорії, тому не варто обмежувати себе думкою, що якесь бажання надто масштабне.", "Внутрішні стандарти визначають, що людина отримує в житті: якщо людина погоджується на некомфортне (незручне місце зустрічі, гірші умови), бо \"вже заплачено\" чи \"незручно відмовити\", вона блокує надходження кращого.", "Кінезіологічний тест (простягнута рука слабшає, коли людина каже неправду) ілюструє, що тіло ніколи не бреше — варто звертатися до тіла з питаннями замість покладатися лише на логіку голови.", "Для розширення реальності важливо: 1) слухати тіло, 2) розширювати мислення (дивитися на людей з іншим рівнем життя не із заздрістю, а з думкою \"і я так хочу\"), 3) регулярно пробувати щось нове (навіть дрібниці на кшталт зміни маршруту чи новинку в їжі).", "Жалість до когось (навіть до близької людини) — це форма приниження й \"інвалідизації\" іншого, оскільки той, хто жаліє, підсвідомо ставить себе вище; звичка жаліти інших часто пов'язана з внутрішнім відчуттям власної жертовності.", "Практика встановлення особистих енергетичних кордонів (фізичний жест \"розсування\" простору руками з фразою \"зі мною так не можна\") допомагає people відчути, де їхні межі, і перестати порушувати особистий простір людини.", "Обмежувальні переконання (\"у мене нічого не працює\", \"мені важко даються мови\") можна свідомо \"розцементувати\" — проговорювати протилежне твердження, роблячи переконання легшим, поки воно не почне \"текти\" вільно, як вода."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "Зустріч з Ксенією Броєвою", "d": "2025-02-10", "u": "https://youtu.be/5aCELhuSQGM", "s": "Це запис лекції експертки з хаус-хілінгу Ксенії Броєвої на тему \"Як зробити свій дім магнітом для достатку\". Головна ідея: дім є прямим відображенням внутрішнього стану людини, і достаток формується не через магічні предмети, а через свідому роботу з чистотою, енергією та функціональним призначенням кожної кімнати.", "th": ["Немає одного магічного предмета, що притягує гроші — результат складається приблизно з 30% дій у домі, 30% особистої карми та 30% власної дисципліни і праці людини.", "Головний і найважливіший фактор — чистота дому, яка відображає, наскільки господиня \"тримає простір\"; аномальна забрудненість (навіть попри прибирання) — маркер того, що певний рівень достатку не заходить у дім.", "У домі циркулює енергія Ці, яка рухається схоже на людину — шукає цікаве, красиве і не любить перешкоджені, захаращені простори; її потік можна відчути, уявивши себе цією енергією і пройшовши шлях від вулиці до квартири.", "Кожна кімната має своє призначення й символізм: прихожа — \"фільтр\", що знімає зайве з гостей; кухня — місце поєднання чотирьох стихій (обов'язково чиста плитка, раковина і холодильник); вітальня — відображення душі та зв'язку з зовнішнім світом; спальня — найбільш містичне місце, пов'язане з підсвідомістю, сном і сексом.", "У спальні не варто працювати чи тримати зайву техніку (роутер, телевізор) — це \"забруднює\" підсвідомий рівень відпочинку; важливо, щоб перше, що людина бачить, прокинувшись, налаштовувало на позитивний стан.", "Кількість джерел світла в домі символізує варіативність людини у житті та вмінні знаходити виходи — одне джерело світла асоціюється з негнучкістю й вразливістю до змін, тоді як кілька джерел говорять про здатність адаптуватися.", "Прибирання варто робити в хорошому емоційному стані (оскільки емоції \"закладаються\" у виконану роботу), а неприємні запахи чи конфлікти з сусідами (наприклад, дим) спершу варто вирішувати прямою розмовою, і лише потім — за потреби — застосовувати символічні методи (наприклад, дзеркало, що \"відбиває\" енергію назад)."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Зустріч з Сергієм Скляренко", "d": "2025-02-06", "u": "https://youtu.be/N3aMgsXq20Q", "s": "Це запис лекції психотерапевта Сергія Скляренка, автора методу \"карматерапія\", на тему поєднання духовності та матеріального благополуччя. Головна ідея: гроші, багатство та достаток — це різні поняття (багатство є станом душі, достаток — відчуттям достатності, гроші — енергетичним ресурсом), і фінансовий добробут напряму залежить від балансу в родовій системі, зокрема від прийняття батьків і відсутності до них претензій.", "th": ["Багатство — це стан душі, який не залежить від кількості грошей (людина зі 100 доларами може відчувати себе багатшою за мільярдера); достаток — це відчуття, коли всього достатньо і є ресурс ділитися цим з іншими.", "Духовність означає з'єднання зі своїм внутрішнім \"я\" (Богом всередині себе), а не слідування зовнішнім концепціям чи егрегорам — важливо не ставати заручником жодної духовної системи.", "На фінансовий достаток людини впливає системно-родовий (феноменологічний) аспект: закони ієрархії, порядку життя та порядку любові в родовій системі; порушення ієрархії (наприклад, коли дитина займає позицію \"батька\" для власних батьків) блокує потік ресурсів і енергії.", "Наявність претензій чи образ на батьків — це порушення закону ієрархії й порядку життя, оскільки означає засудження тих, хто дав життя; ключові зцілюючі фрази — \"я приймаю і даю цьому місце\".", "Симптоми (фізичні хвороби, психологічні реакції) завжди виконують захисну чи регулюючу функцію в житті людини; щоб позбутися симптому, потрібно зрозуміти, від чого саме він захищає людину, а не боротися з ним напряму.", "Для діагностики особистого балансу пропонується аналізувати п'ять \"полів особистості\": стосунки з родом (батьками), перший сексуальний досвід, професійну сферу, стосунки з партнером (за формулою уваги, близькості та обов'язковості) та особисту самоідентифікацію.", "Практика \"інтервенції\" (внутрішнього діалогу з образом батьків) — визнання, що батьки виховували так, як вміли, і як їх самих виховали — допомагає відновити родовий баланс без необхідності реальної розмови з батьками, оскільки процес відбувається на метафізичному/енергетичному рівні."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Розстановки січень 2025", "d": "2025-01-30", "u": "https://youtu.be/_I31NxJnMSo", "s": "Це запис групової сесії \"розстановок\" наприкінці січня, де учасниці по черзі опрацьовують запити — про організацію події на Балі, стосунки з батьком, вибір між роботою в Каліфорнії та самореалізацією під час декрету, і розвиток квіткового бізнесу. Головна ідея: успіх приходить не через насильне \"притягування\" результату чи тривогу, а через чітке визначення власного наміру, довіру до процесу та відпускання зайвої відповідальності за інших людей.", "th": ["У запиті про організацію події з'ясувалося, що заміна \"важкого\" організатора (Ані) на \"легшого\" (Юлю) і додавання елементу азарту й цікавості значно полегшує сприйняття задачі — тягар і очікування конкретного результату блокують процес.", "У запиті про стосунки з батьком виявилося, що донька несвідомо намагалася \"розбудити\" батька й розв'язати проблеми між батьками, хоча це не її роль і не її відповідальність — розуміння цього одразу принесло полегшення в розстановці.", "У запиті про вибір між пошуком нової роботи в Каліфорнії та фокусом на самореалізації під час вагітності з'ясувалося, що образ \"розслабленої\" версії себе через рік (без роботи, з фокусом на саморозвиток і стосунки) викликає значно сильніший позитивний відгук, ніж варіант зі \"штучно ускладненою\" роботою \"про запас\".", "У запиті про бізнес (квітковий магазин) ключовою проблемою виявилась відсутність чіткого напрямку розвитку бізнесу — власниця \"гралася\" з новими системами й ідеями (найм керівника-чоловіка тощо), але жодна команда чи ідея не могла \"запрацювати\", доки сама власниця не визначила конкретну мету зростання (обороту, статусу, часу).", "Ведуча наголошує на важливості формулювати чіткий намір перед будь-якою дією чи практикою — без визначеності щодо того, \"для чого\" щось робиться, зміни (нова система оплати праці, новий співробітник) сприймаються командою як хаотичні й викликають спротив.", "У практиці розстановок використовується техніка \"розздаю, знищую\" — свідоме \"видалення\" негативної програми чи страху з учасника через рахунок і повторення, після чого учасники повідомляли про відчутне полегшення в тілі.", "Особистий приклад ведучої: спонтанне бажання поїхати на ретрит без конкретного плану чи впевненості в місцях призвело до того, що обставини (хвороба іншого організатора, купе, кімната) склалися ідеально під її внутрішній запит — це наведено як ілюстрація того, що \"істинне бажання\" реалізується легко, тоді як насильне \"натягування\" результату виснажує."], "p": false, "c": "Розстановки", "extra": ""}, {"t": "Зустріч з Владою Неділька 2 частина", "d": "2025-01-21", "u": "https://youtu.be/xKb4TUNyf3g", "s": "Це друга частина лекції експерта з переговорів і медіатора Влади Недільки про особисті кордони та вирішення конфліктів. Вона розповідає про способи захисту особистих кордонів (м'які, середні, жорсткі) через принципи позитивного і негативного підкріплення, а також дає алгоритм покращення стосунків через зменшення тиску на партнера і роботу зі своїм локусом контролю.", "th": ["Особисті кордони не можна захищати, порушуючи чужі — конфлікт виграє не той, хто агресивніший, а той, хто менше виходить за межі власної території під час суперечки.", "Захист кордонів базується на принципі позитивного і негативного підкріплення (метод \"кнута і пряника\"): на приємну поведінку варто щиро й одразу дякувати, а на неприємну (критику, тиск, ігнорування) — реагувати холодністю чи дистанціюванням, і робити це відразу, оскільки відкладене підкріплення не діє.", "Мовчання і дистанціювання — це не терпіння, а спосіб розмежування кордонів; на відміну від терпіння, ці методи не накопичують образу, а одразу сигналізують іншій людині про межу.", "\"Я-повідомлення\" (я не хочу це обговорювати, мені неприємно це чути) — жорсткіший спосіб захисту кордонів, який варто використовувати, коли м'якші методи (відхід від теми, жарт, \"включення дурачка\") вже не спрацювали.", "Існує три рівні розмежування кордонів — м'який (відхід від теми, мовчання, жарт, \"дурачок\"), середній (м'яка відмова, фізичний відхід, інверсія — наприклад мовчки вилити невдалий борщ і зварити новий) та жорсткий (пряма відмова з я-повідомленням і подальшим відходом).", "Стосунки проходять чотири стадії — щедрості, вічливості, байдужості й війни; конфлікти виникають на стадії байдужості, і щоб не допустити цього, важливо завжди підкріплювати отримані вклади вдячністю або взаємністю.", "Алгоритм покращення стосунків включає: зменшення прямого й непрямого тиску на партнера, закриття власних потреб самостійно, позитивне підкріплення навіть часткової допомоги від партнера, дистанціювання без слів у відповідь на неповажний тиск та вкладення в стосунки без очікування компенсації.", "Люди найчастіше брешуть через зовнішній тиск (страх осуду чи покарання), а не через внутрішній; прибравши тиск і показавши прийняття, можна зменшити схильність партнера до брехні."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Зустріч з Вірою Гунько", "d": "2025-01-16", "u": "https://youtu.be/2Ef8HntnpQM", "s": "Це запис лекції астролога Віри Гунько про ведичну астрологію (Джьотіш) та прогноз на 2025 рік для клубу Ольги Ковальчук. Головна ідея: 2025 рік буде переломним через зміну положення трьох головних планет (Сатурна, Раху, Юпітера), що принесе завершення старих процесів навесні та відкриє нові сфери розвитку для кожного знаку зодіаку залежно від їхнього місячного знаку та асценденту.", "th": ["У 2025 році три головні \"повільні\" планети — Сатурн, Раху і Юпітер — змінюють своє положення: Сатурн і Раху обміняються знаками (Риби↔Водолій) у травні, а Юпітер перейде з Тельця в Близнюків, що означає перехід усіх людей від розвитку якостей одного знаку до якостей іншого.", "Сатурн — планета, що звужує і дає напругу, страх та уповільнений результат у тих сферах життя, на які впливає; задача людини — взяти відповідальність, проявити дисципліну й терпіння, а потім відпустити контроль.", "Раху — планета трансформації, яка дає амбіції та бажання змінити певну сферу життя через злети і падіння; Юпітер — найбільш сприятлива планета, яка просто дарує можливості й \"подарунки\", які важливо вчасно помічати й використовувати.", "Навесні 2025 року (особливо 21 квітня) відбудеться \"парад планет\" у знаку Риб — одночасне накопичення кількох великих планет в одному знаку, що стане кульмінацією процесів, які тривали з кінця 2023 року, і принесе завершення (обнулення) старих тем.", "У 2025 році заплановано чотири затемнення (14 та 29 березня, 7 та 21 вересня); за місяць до і після затемнень не рекомендується планувати важливі події, переїзди чи приймати ключові рішення.", "Кожен знак зодіаку (за місячним знаком та асцендентом) має свої унікальні сфери життя (доми), на які впливають ці транзити — авторка детально розібрала прогнози для всіх 12 знаків, наводячи особисті приклади та приклади відомих блогерів.", "На ретроградні планети (Юпітер, Марс, Венера, Меркурій, які матимуть ретроградні періоди навесні 2025 року) не рекомендується починати нові важливі справи: купувати нерухомість чи авто (Марс), починати стосунки (Венера), підписувати документи (Меркурій), запускати нові проєкти (Юпітер)."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Мастермайнд січень 2025", "d": "2025-01-15", "u": "https://youtu.be/ZUdypeDEQUA", "s": "Це запис першого Мастермайнду 2025 року, де ведуча відповідає на запити учасниць про те, як справлятися з пришвидшеною енергією нового періоду, як розпізнати \"правильне\" партнерство серед сучасних тенденцій до масових розлучень, а також обговорює важливість фізичних тренувань і плани однієї з учасниць запустити освітню гілку про криптовалюту. Головна ідея: енергію не можна утримувати — її потрібно пропускати через дисципліну, тілесну практику і чіткість своїх намірів, тоді життя саме \"приносить\" бажане.", "th": ["Енергію не потрібно утримувати, а треба пропускати через себе за допомогою дисципліни (графіків, ранкових ритуалів, тілесних практик) — інакше вона піде на руйнування замість творення.", "Є різниця між \"стражданням заради чогось більшого\" (коли людина дисциплінована і працює над собою) і \"стражданням заради нічого\" (коли людина без дисципліни все одно проживає труднощі, але без розвитку).", "До 2020 року стосунки переважно будувалися на кармічних, травматичних зв'язках для спільного пропрацювання; зараз партнерства, які залишаються разом, проходять трансформацію, а нові стосунки формуватимуться за принципом взаємного посилення (\"один плюс один — рівень одинадцять\"), а не компенсації травм.", "Зараз спостерігається хвиля розлучень, ініційованих переважно жінками, які \"виросли\" емоційно й духовно швидше за партнерів, що залишилися на попередньому рівні розвитку.", "Для пошуку \"правильного\" партнера радиться не складати список бажаних параметрів (як \"параметри ковбаси\" — зовнішність, зріст), а чітко визначити, чого людина точно не хоче в стосунках — це допомагає викристалізувати внутрішній запит.", "Насильне \"притягування\" бажаного через маніпуляції чи ілюзії (як в історії про весілля за чужі гроші без згоди) не працює довгостроково і веде до розчарування — потрібно рухатися туди, де легко, а не силувати простір.", "Регулярні фізичні тренування (силові навантаження, м'язова маса) названі необхідною умовою для того, щоб тіло могло \"проводити\" більший об'єм енергії, яка зараз посилюється — це порівнюється з потребою мати потужніший електричний кабель для більшого навантаження.", "Учасниці обговорили ідею вести окрему тематичну гілку/розсилку (наприклад, про криптовалюту) для поступового, структурованого \"вивантаження\" накопичених знань — це допомагає авторці подолати ступор перед публічним стартом і принести користь цільовій аудиторії, яка потребує довіри та покрокових пояснень."], "p": false, "c": "Мастермайнди", "extra": ""}, {"t": "Зустріч з Олею Ковальчук. Січень 2025", "d": "2025-01-08", "u": "https://youtu.be/GQiJ1xlLLNw", "s": "Це запис першої зустрічі суспільства у 2025 році, де ведуча оголошує, що весь рік буде присвячений реалізації цілей та мрій учасниць, а також розкриває тему страхів — свідомих і несвідомих — які блокують досягнення бажаного. Головна ідея: 2025 рік буде роком завершення того, що не працює, і швидкої матеріалізації намірів, тому важливо не чіплятися за страхи, а розпізнавати їх, забирати з них енергію та займатися тілом і практиками, щоб пропускати через себе нову, пришвидшену енергію.", "th": ["2025 рік визначено як рік завершення всього, що вже не працює (стосунки, техніка, звички), і водночас рік матеріалізації накопичених намірів — важливо дякувати за ці завершення, а не опиратися їм.", "Страхи бувають фізіологічні (природний захисний механізм) і соціальні (страх осуду, страх великих грошей, страх проявленості) — саме соціальні страхи найбільше блокують реалізацію бажань.", "Коли людина не чіпляється за страх у момент \"перевірки\" (провірки), а зберігає нейтралітет, ситуація вирішується найкращим чином; чіпляння ж за негативну реакцію \"цементує\" небажаний сценарій.", "Практика \"розздаю, уничтожаю\" (усвідомлення страху й забирання з нього енергії) допомагає перетворити страх назад на \"мильний пузир\" замість того, щоб дати йому зміцніти.", "Регулярні прості дії — ранкова зарядка, читання художньої літератури, фізичні навантаження — допомагають \"тілу\" проводити більший обсяг енергії та підтверджують мозку, що нова звичка працює краще за її відсутність.", "Відмова від алкоголю, антидепресантів та інших речовин, що змінюють хімічний склад крові, рекомендована як умова для швидшого й чистішого проходження особистісних трансформацій.", "Якщо бажані зміни (наприклад, фінансова грамотність чи сміливість) починають проявлятися в найближчому родинному оточенні (у чоловіка/партнера), це варто сприймати як підтвердження власного росту, а не привід для ревнощів чи порівнянь — у кожного свій темп і своя \"енергія\" заробітку та розвитку.", "Важливо визначити свої особисті цілі та не братися за справи (чи енергетичні \"ніші\"), які не резонують із власним масштабом — практики й енергія працюють лише на \"чистоту\" саме власних, а не запозичених цілей."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "Розтановки для пакету Power (23.12)", "d": "2024-12-23", "u": "https://youtu.be/98qeIJXH2ds", "s": "Це запис групової сесії \"розстановок\", де ведуча допомагає учасницям пропрацювати особисті запити щодо цілей, команди та фінансів через рольове моделювання ситуацій. Головна ідея: чітке усвідомлення власних цілей і дозвіл собі отримувати бажане (без надмірного контролю, самопожертви чи \"жаб'ячих\" обмежень) прискорює їх матеріалізацію в реальному житті.", "th": ["Ведуча ілюструє головну тезу на прикладі боксера Усика: коли людина чітко знає, чого хоче, і діє з внутрішньою впевненістю, світ починає \"матеріалізовувати\" потрібні ресурси та людей (наведено особистий приклад із випадковою зустріччю потрібної людини).", "У розстановці про досягнення цілі виявилося, що \"гординя\" і бажання постійно рятувати/опікати родину заважають людині рости — коли учасниця символічно \"відпустила\" родину і дозволила собі рухатися до цілі, напруга змінилася на полегшення.", "У другій розстановці (про сумніви щодо чесності з собою) виявлено \"енергетичну сутність\" — паразитуючу енергію, яка живиться непроявленою агресією; рекомендація — проявляти емоції \"екологічно\" (наприклад, показати жест роздратування і відпустити), а не задавлювати їх.", "Наголошується на важливості \"присутності\" і контролю свідомості: будь-яка зміна хімічного стану організму (алкоголь, наркотики, наркоз) відкриває можливість для \"підселення\" чужих енергій/сутностей, тому рекомендується уникати таких станів, коли можливо.", "У розстановці про нову й стару команду учасниці на рівні тілесних відчуттів (\"мурашки\", \"азарт\", \"оргазм\") відчули однозначну перевагу нової команди над старою — це подано як спосіб визначення правильного рішення через тілесний відгук, а не логіку.", "У розстановці про гроші (\"жаба\") виявлено патерн самообмеження: людина ставить масштабні фінансові цілі, але не дозволяє собі навіть дрібних \"нераціональних\" покупок для себе — рекомендація купувати щось якісне (бренд, а не підробку) для себе перш ніж витрачати на інших.", "Діти чутливо зчитують невідповідність між емоційним станом батьків і показуваною \"маскою\" (наприклад, удавана доброта при внутрішній злості) — краще проявляти справжні емоції, ніж приховувати їх, оскільки нещирість плутає дитяче сприйняття реальності."], "p": true, "c": "Розстановки", "extra": ""}, {"t": "р2р з Вікторією Комарницькою", "d": "2024-12-17", "u": "https://youtu.be/MuEgPbbiEU4", "s": "Це запис лекції нумеролога Вікторії про фінансовий канал і матеріальну карму в системі \"Матриця Долі\" — методі самопізнання на основі дати народження та 22 сакральних енергій (арканів). Головна ідея: наше фінансове благополуччя тісно пов'язане з пропрацюванням кармічних уроків, стосунками з родом, особливо жіночою лінією, та внутрішньою роботою над собою, а негативні енергетичні патерни завжди можна трансформувати в ресурс.", "th": ["Матриця Долі базується на переконанні, що душа свідомо обирає дату народження, батьків та умови народження для пропрацювання кармічних завдань з минулих життів.", "Фінансовий канал і матеріальна карма — це два взаємопов'язані елементи матриці, які показують сильні сторони, блоки й переконання, що обмежують здатність заробляти гроші; навіть \"мінусові\" енергії можна перевести в плюс через усвідомлену роботу над собою.", "Енергія Імператриці (аркан 3) на вході у фінансовий канал вимагає гармонійних стосунків із жінками (особливо матір'ю), догляду за власною зовнішністю та вмінням делегувати повноваження — інакше вона блокує фінансовий потік.", "Аркан під символом долара показує, через яку сферу діяльності приходять гроші конкретній людині (наприклад, через масштабні міжнародні проєкти, творчість чи благодійність).", "Аркан 20 (яснознання і зв'язок з родом) у матеріальній кармі пов'язаний із суворим застереженням не робити абортів та не сваритися з роднею — порушення цього спочатку \"б'є по грошах\", а згодом впливає на здоров'я.", "Аркан 5 (вчитель, закони) у матеріальній кармі вимагає ділитися знаннями та досвідом, діяти виключно в рамках закону (не уникати офіційної реєстрації бізнесу) та зберігати родинні традиції; людині з такою енергією категорично не можна жертвувати собою заради інших на шкоду собі.", "\"Кармічний партнер\" у стосунках — це не негативне явище, а людина, яка допомагає підсвітити й пропрацювати особисті уроки (наприклад, навчитися приймати підтримку чи проявляти жіночність), а не приречення на нещасливі стосунки."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Зустріч з Анастасією Ткаченко", "d": "2024-12-06", "u": "https://youtu.be/JM8zui6OwvQ", "s": "Це запис лекції нумеролога Насті про енергії 2025 року (числа 9 за нумерологією), який присвячений завершенню циклів, очищенню та саморефлексії. Головна ідея: 2025 рік — це рік Відлюдника, коли важливо звільнитися від зайвого (речей, стосунків, проєктів, образ), звернутися всередину себе та практикувати щедрість і благодійність, щоб підготувати простір для нового дев'ятирічного циклу.", "th": ["2025 рік у нумерології дорівнює числу 9 (2+0+2+5), що відповідає Аркану Відлюдника — енергії самопізнання, завершення справ, очищення простору та внутрішньої мудрості.", "Нумерологічний цикл триває 9 років, і кожна людина проживає власний \"особистий рік\" у межах цього циклу, який розраховується додаванням дня та місяця народження до цифр поточного року.", "Не рекомендується одружуватися у 2025 році, оскільки енергія завершення краще підходить для розлучень і закриття циклів, ніж для початку нового спільного життя; натомість це сприятливий рік для розлучень чи завершення стосунків, що вичерпали себе.", "У кар'єрі та фінансах варто уникати довгострокових (кількарічних) інвестицій і нових масштабних проєктів — краще планувати справи, які можна завершити за кілька місяців, і довіряти, що непотрібне \"відвалиться\" саме собою.", "Особливо потужною в 2025 році є енергія благодійності: донат суми, цифри якої в сумі дають число 9 (наприклад, 45, 1800), нібито прискорює повернення ресурсу; тип благодійності варто узгоджувати зі своїм бажанням (донат на дітей — якщо хочеш дитину, на літніх людей — якщо хочеш стосунки, тощо).", "Рік сприяє психосоматичним проявам — невирішені емоційні питання та образи можуть проявлятися на фізичному здоров'ї, тому важливо приділяти увагу як ментальному, так і фізичному очищенню (детокс, медитація, йога).", "2025 рік може повертати людей з минулого для завершення незакритих стосунків та енергетичних боргів — це можливість поставити крапку в незавершених ситуаціях і звільнити місце для нових здорових контактів."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Розстановки листопад", "d": "2024-11-29", "u": "https://youtu.be/gRpfkvWSluE", "s": "Це запис групової сесії \"розстановок\" у форматі відеозустрічі, де ведуча допомагає учасницям пропрацювати особисті запити через рольове моделювання ситуацій. Учасниці розбирають три теми: страх конкуренції в парі через успіх партнера, тривогу перед переїздом до Каліфорнії, та бажання переїзду у Львів після років життя \"для інших\".", "th": ["У запиті про \"конкуренцію в парі\" виявилося, що страх втратити статус \"зірки\" — це соціальна програма (\"в парі може бути лише одна зірка\"), а не реальна загроза; коли учасниця усвідомила свою внутрішню силу і зрозуміла, що партнер підтримує обох, тривога змінилася спокоєм.", "Розстановка показала важливість чіткого розуміння мети: тривога виникає не тому, що хтось \"забирає\" успіх, а тому що людина сама не розуміє, ким вона хоче стати і в яких масштабах — без цього розуміння будь-який результат викликатиме напругу.", "У запиті про переїзд до Каліфорнії виявилася глибинна родова програма \"втоми кочівника\" та бажання \"повернутися до мами на ручки\" — практика визнання того, що людина вже виросла, і що мама залишається ресурсом підтримки, а не рятівником, принесла полегшення.", "Прозвучала думка, що діти є важливими вчителями (терпіння, відповідальності, дорослішання), але водночас — щоб народити і виховати дитину, спочатку потрібно \"стати на ноги\" самому, а не залишатися в позиції \"дитини, яка хоче на ручки\".", "У запиті про переїзд до Львова після 28 років шлюбу й життя \"для інших\" (батьків, чоловіка, дітей) з'ясувалося, що варіант \"села в Україні\" (обов'язок) і \"Праги\" (логічне \"треба\") викликають нейтральні/важкі відчуття, тоді як образ Львова приносить радість, легкість і \"дитяче захоплення життям\".", "Головна порада учасниці, яка все життя \"тягла на собі\" родину: перестати жаліти себе за втрачені можливості з минулого і почати діяти зараз — навіть пробний переїзд на місяць-два \"для себе\" є доступним кроком, який не обов'язково має бути остаточним.", "Ведуча підсумовує, що люди можуть свідомо або несвідомо впливати на власний простір і реальність; коли людина тримає стабільний внутрішній стан, обставини починають \"підлаштовуватися\" під неї, а не навпаки."], "p": false, "c": "Розстановки", "extra": ""}, {"t": "Мастермайнд листопад", "d": "2024-11-25", "u": "https://youtu.be/M0EKMxu8cN8", "s": "Це запис Мастермайнду, де ведуча спершу підтримує учасниць у переживанні смерті рідних (тітки й батька), а потім переходить до головної теми — енергії грошей. Головна ідея: гроші — це лише інструмент, а не ресурс, і фінансова \"ємкість\" людини розширюється поступово через свідому гру із сумами, чіткість намірів та внутрішню легкість, а не через тривогу чи прив'язаність до конкретної цифри.", "th": ["Гроші — не ресурс, а інструмент (справжні ресурси — це час, енергія, знання, оточення); за бажанням мати гроші зазвичай стоїть глибша потреба — свобода, влада чи безпека, і важливо усвідомити, що саме людина хоче насправді.", "Коли людина приймає глобальне рішення й рухається до цілі, обставини складаються так, щоб підтримати це рішення, а дрібні непотрібні \"хотілки\" (наприклад, бажання з'їсти фастфуд) можуть блокуватися самим життям (закритий заклад, тривога тощо).", "Описано дві схеми \"запитування\" грошей на ціль: перша — коли людина запитує суму рівно на ціль і залишається з нулем після витрати; друга, вищий рівень — коли одночасно з сумою на ціль створюється така сама (або більша) сума на \"подушку безпеки\"/\"фонд імені себе\", і після покупки залишається ресурс, а не нуль.", "Фінансова \"ємкість\" розширюється поступово: не можна відразу переходити до великих сум, якщо немає досвіду створення і володіння меншими; суми варто збільшувати поступово (наприклад, х2, а не одразу х10), щоб мозок міг це прийняти як реальність.", "Запит на суму грошей спрацьовує, лише коли є тверде внутрішнє рішення й чітка ціль (а не просто абстрактне \"хочу\"); коли грошей забагато прив'язано до дрібного бажання (наприклад, \"дай грошей на каву\"), мозок не сприймає це як значуще досягнення.", "На здатність людини заробляти й утримувати великі гроші впливає родова \"пророблена\" історія (стосунки з батьками щодо грошей) — наведено особистий приклад про батька, що втратив інвестиції, і матір, що навпаки примножила капітал через золото.", "Важливо не робити гроші \"сильнішими за себе\" і не прив'язуватися емоційно до конкретної суми чи валюти (наприклад, страждати через курс гривні до долара) — треба рухатися до цілі, а сума й обставини \"підлаштуються\" самі.", "Свобода вибору не брати участь у чомусь (похорон, певні події) — це нормально, головне діяти не на шкоду собі; коли йде мова про близьких, які відходять, важливо продовжувати жити і брати повну відповідальність за власне життя, а не застрягати в почутті провини чи осуду."], "p": false, "c": "Мастермайнди", "extra": ""}, {"t": "Зустріч з Олею Ковальчук Листопад", "d": "2024-11-18", "u": "https://youtu.be/3Yzu1lCkeJQ", "s": "Це запис зустрічі спільноти, де ведуча розповідає про важливість фокусу уваги, регулярних дій з новим тілом та розумом для досягнення результатів. Головна ідея: знання не мають цінності без практичного застосування, а невеликі щоденні зміни (нові дії, фізичне навантаження, зміна маршрутів) запускають нову енергію та відкривають шлях до бажаних результатів швидше, ніж очікування \"ідеального моменту\".", "th": ["Знання самі по собі не мають цінності — вона з'являється лише тоді, коли людина застосовує їх і отримує власний досвід, за яким, власне, до неї й звертаються інші люди.", "Мультизадачність — це не ефективність, а розфокусування; краще виділити конкретний час і сконцентруватися на одній справі, ніж робити багато справ одночасно поверхнево.", "Невикористана енергія (наприклад, роздратування чи злість, які не отримали виходу через фізичну активність) накопичується і починає проявлятися негативно в тій сфері життя, яка для людини найцінніша — фінансах, стосунках чи здоров'ї.", "Прості ранкові фізичні вправи (навіть 15-20 присідань чи віджимань) запускають правильну енергію на весь день — усі успішні люди починають день з фізичної активності.", "Щоб \"перезапустити\" мозок і залучити нові ідеї, потрібно регулярно робити щось нове: змінювати маршрути прогулянок, пробувати нові смаки, читати книги (які, на відміну від фільмів, повністю занурюють у інший стан), переставляти меблі — це формує нові нейронні зв'язки.", "Коли людина чітко знає, чого хоче, і концентрує на цьому увагу, обставини та можливості починають \"матеріалізовуватися\" самі — наведено кілька прикладів (запрошення викладати крипту, знайомство з письменницею для написання книги).", "Тіло — єдиний інструмент людини в цьому житті, і про нього важливо піклуватися балансовано (не виснажувати і не ігнорувати), оскільки саме через фізичний стан ми або отримуємо ресурс для реалізації цілей, або втрачаємо його."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "Зустріч з Владою Неділька", "d": "2024-11-13", "u": "https://youtu.be/mCjM1QOOAHw", "s": "Це запис вебінару з конфліктологом і бізнес-медіатором Владою Недількою на тему природи конфліктів та особистих кордонів. Головна ідея: будь-який конфлікт виникає через порушення особистих кордонів (тиск — відкритий чи прихований) і завжди має двох винних — провокатора та того, хто на провокацію повівся; уникнути конфліктів можна, навчившись усвідомлювати власний тиск на інших і зберігаючи внутрішній локус контролю.", "th": ["Основа будь-якого конфлікту — психологічний тиск, тобто порушення особистих кордонів; тиск буває відкритий (пряма критика, ультиматуми) і латентний, прихований під ввічливість (натяки, поради без запиту, жарти) — саме латентний тиск найнебезпечніший, бо його важко розпізнати.", "Локус контролю буває внутрішній (\"я — автор свого життя\") і зовнішній (\"я — жертва обставин\"); зовнішній локус означає, що людина спрямовує свої бажання назовні й неусвідомлено тисне на оточення, очікуючи, що інші реалізують її потреби.", "В конфлікті завжди винні обидві сторони: провокатор, який виходить за свої кордони на чужу територію, і той, хто \"ведеться\" на провокацію, невдало захищаючи свої кордони.", "Ступінь відкритості чужих кордонів по відношенню до вас — це і є ваша значимість для людини; чим вона вища, тим більше кордони відкриті і тим більше для вас готові зробити.", "У конфлікті перемагає той, хто менше виходить за межі власних кордонів; критика, поради, пояснення і виправлення чужих помилок допустимі лише за прямим запитом.", "Справжній комплімент — це вираження емоції або подяки (\"я щиро дякую за вашу працю\"), а не оцінка (\"ти така гарна\"), оскільки оцінка підсвідомо ставить того, хто її дає, у позицію \"зверху\".", "Названо близько 27 типових \"конфліктогенів\" — дій чи слів, що порушують чужі кордони і провокують конфлікт: оцінка, зверхній тон, тролінг, сарказм, вихваляння, перебивання, виклик, категоричність, нав'язування думки, підвищення голосу, образи, викликання жалю, натяки, вимоги, шантаж, ультиматуми, по
