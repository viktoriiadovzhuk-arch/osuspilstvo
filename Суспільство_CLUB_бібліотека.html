, це показник, що людина не живе своєю головною роллю, а грає чужі ролі (наприклад, \"хорошої дівчинки\" чи \"відмінниці\").", "Дозволити собі \"здатися\" (не боротися на надриві) без доведення себе до вигорання — уникати ситуацій крайнього виснаження, а замість цього відпускати контроль там, де можна.", "Дисципліна легше дається через підтримку інших (тренера, зобов'язання перед кимось), і в цьому немає нічого поганого — визнати потребу в допомозі це теж форма вибору себе, а не слабкість."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "ОСуспільство.CLUB зустріч з Альоною Кононенко на тему розстановок", "d": "2025-12-29", "u": "https://youtu.be/X37JvtKEgng", "s": "Це запис презентації Альони Каноненко про системні (родові) розстановки та метафоричні карти в контексті фінансових блоків. Вона пояснює чотири базові системні закони Берта Хелінгера, механізм передачі родових травм і пропонує учасницям практичні вправи для роботи з власною сімейною системою та фінансовими установками.", "th": ["Системні розстановки базуються на теорії Берта Хелінгера про те, що людина є частиною родової системи (до 7 поколінь) і всіх систем, до яких належить (родина, робота, держава), і несвідомо зчитує енергоінформаційне поле цих систем.", "Чотири системні закони: закон належності (кожен, хто прийшов у систему, має в ній місце, включно з абортованими дітьми чи \"виключеними\" родичами), закон ієрархії (енергія тече від старших до молодших поколінь), закон балансу (брати-давати — надмірна віддача без можливості отримати у відповідь відштовхує людину), закон будьтєвості (інтереси системи вищі за інтереси окремого елемента).", "Виділено три види грошей у родовій системі: гроші роду (базова енергія), батьківські гроші (все вкладене в дитину від зачаття до повноліття, включно з установками про фінанси) та особисті гроші (те, що людина сама може створити й прийняти).", "Поняття \"фінансова стеля\" (рівень доходу, вище якого людина роками не може піднятися) і \"фінансова підлога\" (мінімальний комфортний рівень, нижче якого людина не опускається) — обидва індивідуальні й формуються родовою системою.", "Фінансові установки, закладені на глибокому підсвідомому рівні (часто пов'язані з історичною травмою — розкуркулюванням, репресіями), важко пропрацювати лише свідомою роботою з афірмаціями; розстановки дозволяють розблокувати ці заряди швидше.", "Запропонована практична вправа: уявити бажану суму грошей (не більше ніж у 3 рази більшу за поточний дохід — оскільки психіка приймає таке збільшення як реалістичне за рік) у вигляді метафоричної карти й відстежити свої емоції при \"наближенні\" до неї — тривога чи страх вказують на внутрішній опір.", "На відміну від розстановок з живими \"замісниками\", робота з метафоричними картами відбувається наодинці з розстановником, без стороннього \"акторства\" — це вимагає глибшого особистого проживання, але, за словами ведучої, дає більш автентичний результат."], "p": false, "c": "Розстановки", "extra": ""}, {"t": "ОСуспільство.CLUB розстановки з Олею на POWER 23/12", "d": "2025-12-24", "u": "https://youtu.be/m-eWpDOHETo", "s": "Це запис групової сесії з кількома розстановками: перша про вибір країни для переїзду (Кіпр проти інших варіантів), друга про пошук любові до себе і стосунків, третя й найдовша — про бізнес квіткового магазину, який виснажує власницю, і рішення його продати. Наскрізна ідея — навчитися відпускати те, що вже \"переросли\", і приймати рішучі рішення замість тривалого утримання виснажливих ситуацій.", "th": ["У розстановці про переїзд Кіпр виявився найбільш енергетично \"живим\" варіантом (порівняно з Києвом, Берліном, Дубаєм, Балі), а шлях туди прийде не через активний пошук, а через несподівану можливість (можливо, пов'язану з кіберкомпанією) — рекомендація \"просто дозволити\" собі побачити цей варіант, без форсування подій.", "У розстановці про самооцінку і стосунки виявлено виснаження і хаотичне \"закручування\" в пошуках рішення; порадою стало почати з простих і безкоштовних способів подбати про себе (тиша, свічка, книга) замість дорогих \"серйозних\" практик (спа, масаж), які викликають додаткову тривогу.", "У розстановці про бізнес (квітковий магазин) з'ясувалося, що власниця емоційно \"переросла\" свою справу, і подальше утримання бізнесу через страх втратити дохід забирає ресурс, потрібний для нових напрямків життя (дитини, стосунків, розвитку).", "Порада ведучої на власному прикладі: продавати бізнес краще на піку його розвитку і до значного святкового періоду (наприклад, до 8 березня), а не чекати, поки він почне занепадати і доведеться закривати з втратами.", "Запропоновано розділити енергетично \"дитину\", \"бізнес\" і \"стосунки з чоловіком\" на окремі сфери (символічний жест — розвести руки в різні боки), оскільки змішування цих енергій створює додаткове напруження і заважає розвитку кожної з них.", "Порада щодо отриманих від продажу бізнесу коштів — не витрачати на споживчі речі, а реінвестувати (наприклад, в акції) для отримання пасивного доходу \"легшої якості\", ніж напружені гроші з виснажливого бізнесу.", "Наскрізна думка: якщо людина сама свідомо не приймає рішення змінити ситуацію, зміни можуть статися \"насильно\" і болючіше — тому важливо самій прийняти рішення, а не чекати зовнішнього поштовху."], "p": true, "c": "Розстановки", "extra": ""}, {"t": "Новорічний інтенсив 2026", "d": "2025-12-18", "u": "https://youtu.be/aqdXFJgPh9I", "s": "Це запис новорічного інтенсиву, де ведуча пояснює методику постановки цілей на 365 днів: перехід від стану \"хочу\" до \"приймаю рішення\", складання п'ятирічної стратегії життя та практичні інструменти (правила, девіз, робота зі страхами) для реалізації однієї головної цілі на рік. Включає медитативну практику для звільнення від тягаря минулого.", "th": ["За 365 днів (а не за 21 день, як популярно вважається) можна зробити колосальні зміни в житті — це підтверджено багаторічними дослідженнями роботи мозку; важливо брати одну ціль на рік, а не розпорошуватися на кілька.", "Ключова відмінність між станом \"хочу\" і \"приймаю рішення\": у стані \"хочу\" людина не бере відповідальність за результат (перекладає її на лікаря, тренера, обставини), а прийняття рішення означає впевненість \"це буде\" без знання як саме, і дію без постійних сумнівів, які забирають енергію.", "Рекомендується прописати стратегію життя на 5 років за принципом \"якщо можливо все\" — це розширює масштаб мислення настільки, що річна ціль починає здаватися мозку маленькою і досяжною; важливо, щоб бажання були власними, а не для доведення комусь.", "Для досягнення цілі потрібно: прописати особисті правила (наприклад, слухати своє тіло замість загальних дієтичних приписів), обрати девіз/настрій на рік (внутрішню опору), виявити страхи й упередження та переформулювати їх у протилежні твердження, а також визначити перші конкретні дії на найближчі 72 години.", "Метод \"мімікрії\" — свідомо оточувати себе інформацією про людей, які вже досягли бажаного результату (переглядати їхні профілі, історії) — це формує в мозку образ можливого і прискорює наближення до власної цілі.", "При зростанні особистості неминуче змінюється оточення — це нормальний процес, який потребує вміння витримувати напругу та \"вакуум\"; дослідження показують, що це головна риса людей, які досягли успіху самостійно.", "Практичні інструменти: щомісяця прописувати 1-3 конкретні дії по цілі та звірятися з реальністю (що виконано, що ні); додатково прописати 100 бажань на рік для балансування фокусу; медитативна практика \"скидання тягаря\" у воді допомагає звільнитися від негативних переконань і дозволити собі \"бути собою\"."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "ОСуспільство.CLUB зустріч з Ганною Гавриш експерткою з риторики 12/12", "d": "2025-12-13", "u": "https://youtu.be/-76gz1ZMuvQ", "s": "Це запис зустрічі з тренером з публічних виступів Ганною Гавриш, яка проводить практичну розминку голосу й обличчя, а потім розповідає про те, як говорити, щоб \"вас хотіли купити\" — долати синдром самозванця, перфекціонізм і страх осуду при продажі себе, своїх ідей чи послуг.", "th": ["Перед виступом варто робити фізичну підготовку: дихальні вправи (довгий видих активує діафрагму), простукування тіла для зняття напруги, а також артикуляційні вправи для губ (\"медузка\"), язика (облизування по колу) і щелепи (масаж точки з'єднання щелеп) — це покращує звучання голосу.", "Синдром самозванця та перфекціонізм — типові риси українських жінок (\"недо-недо-недо\"), які заважають стартувати; перфекціонізм часто перетворюється на прокрастинацію, і його краще застосовувати не до старту дії, а до аналізу результатів після публікації.", "Страх засудження в публічних виступах пов'язаний зі страхом виключення з групи; подолати його допомагає розуміння, що мета — не \"продати\", а принести користь конкретній людині (це створює вин-вин взаємодію).", "Порада для зйомки на камеру: уявляти перед собою конкретну довірену людину і говорити саме до неї — це змінює тембр голосу і поведінку, роблячи виступ природнішим.", "Важливо розповідати про себе і свою експертизу — мовчання про власні навички позбавляє інших можливості дізнатися про вас і скористатися вашою допомогою (наприклад, історія про клієнта-суддю, який знайшовся завдяки відкритому спілкуванню).", "Ставлення до життєвих викликів (запуск проєкту, продажі, побудова бренду) як до гри допомагає зняти зайву серйозність і тиск — у грі є перешкоди, і подолання їх крок за кроком є природним процесом.", "Для ефективних продажів важливо: розуміти шлях клієнта (контакт → прозора комунікація → безпека → перемовини на засадах \"він-він\"), знати свою аудиторію і говорити про цінності, які людина отримує (наприклад, клієнти \"купують\" не риторику, а впевненість), та обирати клієнтів, а не працювати з усіма поспіль."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "ОСуспільство.CLUB майстермайнд з Олею на POWER", "d": "2025-12-12", "u": "https://youtu.be/rasG0v_n4Ak", "s": "Це запис групового мастермайнду, де учасниці по черзі діляться своїм станом — від паузи й \"спостерігача\" до затягування з реалізацією проєктів через страх і перфекціонізм. Ведуча дає поради про побудову власної комфортної системи роботи в Інстаграмі, довіру до потоку життя та дитячі кордони у вихованні.", "th": ["Стан \"нічого не хочеться робити\" й тотального спостереження не обов'язково є проблемою — це може бути природна перебудова/відпочинок після інтенсивної роботи над собою, і варто дати собі час, а не форсувати дії.", "Не потрібно ставити собі жорсткі дедлайни чи рамки (типу \"постити щодня\" чи \"по 50 рілсів на день\") — краще створити власну комфортну систему роботи (наприклад, записувати контент раз на кілька тижнів), орієнтуючись на те, що дає найкращий результат особисто для себе.", "Досвід ведучої: після 4 років роботи з Інстаграмом вона прийшла до формату, де говорить вільно (без обмеження в 1 хвилину), а монтажери самі ріжуть відео — це дало кращі результати, ніж робота за чужими сценаріями та \"воронками\".", "Страх розпочинати новий проєкт часто пов'язаний із внутрішньою установкою, що \"гроші і духовні/творчі сенси несумісні\" — наведено приклади людей (Оля Кудіненко, Ольга Руднєва), які поєднують значущу діяльність із фінансовим благополуччям.", "Порада для тих, хто боїться масштабних проєктів: почати з прописування бажаного життя \"з позиції, якщо можливо все\" — без обмежень фантазувати, як хотілося б жити, оскільки багато людей починали справжню діяльність саме після 40 років.", "У вихованні дітей важливо встановлювати чіткі персональні кордони (готувати одяг з вечора, визначати обов'язки), не піддаючись на маніпуляції й істерики — якщо дозволяти дитині \"продавлювати\" межі, вона продовжуватиме це робити, відчуваючи провину батьків.", "Приклад про ставлення до особливих дітей (історія про хлопця з ДЦП): коли до дитини ставляться \"як до звичайної\", а не \"як до хворої\", вона починає поводитися відповідно до цих очікувань — ставлення оточення формує поведінку дитини."], "p": true, "c": "Мастермайнди", "extra": ""}, {"t": "Осуспільство зустріч з Оленою Схаб по круїзам", "d": "2025-12-03", "u": "https://youtu.be/xgvLHNQSdhg", "s": "Це запис презентації представниці міжнародного туристичного клубу (Олени з Тенерифе), яка розповідає про платформу бронювання круїзів та готелів зі знижками, а також про партнерську бізнес-програму, що дозволяє заробляти гроші на запрошенні нових членів клубу. Головна ідея — показати механізм накопичення бонусних балів для здешевлення подорожей і можливість побудови мережевого бізнесу в туристичній сфері.", "th": ["Клуб пропонує онлайн-платформу з понад 21 тисячею варіантів круїзів, готелями та турами, де члени клубу отримують знижку 25% на круїзи (списанням бонусних балів) або 17% (при оплаті грошима без бонусів) та 17% на готелі.", "Існує три пакети членства: стартовий (50 доларів/міс без подвоєння), класичний (100 доларів/міс з подвоєнням у бонусні бали) і преміальний (250 доларів/міс з подвоєнням); внесені кошти подвоюються в бонусні бали, які можна списати на 50% вартості круїзу, решту доплачуючи грошима.", "Партнерська програма коштує додатково 95 доларів на півроку і дає можливість запрошувати нових членів клубу, отримуючи одноразові бонуси (20-50 доларів за приєднання), рекурентний дохід, командні бонуси та лідерські зарплати залежно від розміру команди (від 250 до понад 30 тисяч доларів на місяць для великих команд).", "Якщо партнер запрошує достатню кількість членів (наприклад, двох преміальних), компанія сама оплачує його щомісячний внесок, і людина отримує безкоштовне членство з накопиченням бонусних балів для подорожей.", "Важливо оплачувати рахунок протягом 5 робочих днів після виставлення для отримання подвоєння балів; при простроченні оплати понад 30 днів подвоєні бали втрачаються (переходять 1 до 1), хоча вже накопичені кошти залишаються доступними на неактивному балансі.", "Компанія офіційно зареєстрована в п'яти штатах США та Італії, зі штаб-квартирою в Майамі, всі кошти учасників застраховані компанією TrustMyTravel; ведуча наголошує на легальності бізнесу (наявність продукту — членства — на відміну від фінансових пірамід).", "Компанія займається благодійністю: зробила понад 1,5 млн доларів допомоги українським партнерам на початку війни, підтримує плавучі госпіталі \"Кораблі милосердя\" в Африці та дитячий будинок у Мукачеві."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "ОСуспільство.CLUB як організувати простір по феншуй з Олею Казаковою", "d": "2025-11-28", "u": "https://youtu.be/QdnteL97Ks4", "s": "Це запис зустрічі зі спеціалісткою з фен-шуй (інтуїтивна школа \"фен-швей\"), яка пояснює базові принципи цієї практики — баланс інь-ян, п'ять елементів, карту багуа — та дає практичні поради, як визначити зони багатства, кар'єри й партнерства у власному домі. Головна ідея — простір є проєкцією внутрішнього стану людини, і через гармонізацію дому можна впливати на різні сфери життя.", "th": ["Фен-шуй базується на балансі енергій інь (пасивна, темна, спокійна) та ян (активна, рухома) — надлишок чи нестача однієї з них у просторі (наприклад, великий телевізор у спальні) може порушувати гармонію та впливати на здоров'я чи сон.", "Існує п'ять елементів-енергій трансформації (дерево, вогонь, земля, метал, вода), пов'язаних циклом творення (дерево живить вогонь, вогонь створює землю тощо) і циклом руйнування — важливо не ставити елементи, що руйнують один одного, в одну зону.", "Карта багуа ділить простір на 8 секторів (кар'єра, багатство, слава, партнерство, творчість/діти, помічники, знання, здоров'я/сім'я), які визначаються, ставши спиною до вхідних дверей: зона багатства завжди знаходиться по діагоналі зліва.", "Вхідна зона дому (\"рот чі\") має бути чистою, гарною й привабливою, оскільки саме через неї заходить енергія, яка \"впізнає\" господаря — рекомендується прикрашати вхід (килимок, кришталеві кульки, гарне освітлення), щоб залучати позитивну енергію та можливості.", "Для активації зони багатства радять ставити велике \"грошове дерево\" (мандаринове, бонсай) з наміром — символ повинен бути значущим, доглянутим і відповідати масштабу бажаного результату.", "Порожні контейнери, коробки, невикористані речі символізують \"пустоту\" й бідність в енергетиці дому, тому важливо прибирати захаращені простори; навіть наповнений якісний холодильник вважається символом достатку.", "План квартири/будинку може \"розповісти\" про життєві тенденції мешканця (наприклад, відрізана діагоналлю частина житла може вказувати на розділену сім'ю чи відсутню підтримку), а сам простір починає впливати на людину приблизно через півроку проживання в ньому."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "ОСуспільство.CLUB Розтановки листопада на пакеті POWER 25/11", "d": "2025-11-25", "u": "https://youtu.be/Ru-65CFbfvs", "s": "Це запис групового мастермайнду з кількома розстановками: перша про зв'язок Альони з тілом і реалізацією, друга про вибір між особистими стосунками й фінансовим напрямком для Ярдени, третя про страхи Марини щодо масштабування своєї діяльності. Наскрізна тема — навчитися діяти замість накопичення тривоги, писати свої страхи й бажання на папері та довіряти собі.", "th": ["У розстановці Альони виявилось, що відсутність зв'язку з тілом пов'язана не з тілом як таким, а з нечіткою \"реалізацією\" — поки людина не знайде свій вектор і не прийме рішення щодо напрямку діяльності, мотивація займатися тілом не з'явиться, бо тіло є лише \"інструментом\" для реалізації.", "Порада щодо роботи з клієнтами/розстановками — важливо навчитися працювати \"не на своїй енергії\" (використовуючи протоколи захисту), інакше провідник або виснажується сам, або передає клієнтам власні непропрацьовані програми.", "У розстановці Ярдени з'ясувалося, що фінансова незалежність прийде через нові стосунки (а не навпаки) — рекомендація \"скинути шкуру овечки\" і дозволити собі приймати допомогу від сильного партнера, а не намагатися впоратися самій.", "Ключова техніка для роботи зі страхами і блоками — виписувати від руки (не в гаджеті) свої страхи, бажання чи установки протягом 15-20 хвилин; це \"включає нейронну сітку\" по-іншому, ніж просте обмірковування в голові.", "Порада щодо масштабування діяльності (кількість клієнтів, підписників): важливо самостійно визначити свою \"ємкість\" (максимальну кількість людей, з якими можна впоратися), щоб позбутися страху \"не впораюся зі всіма\".", "Рекомендація прописувати \"аватар\" бажаного результату (партнера, цільову аудиторію, фінансову ціль) із конкретними деталями — це працює як налаштування фокусу і реально притягує відповідні результати (наведено особисті приклади учасниць).", "Обговорено ідею \"точки відліку\" — оцінювати свій теперішній рівень життя порівняно з живими родичами тут і зараз (а не з історичним минулим роду), щоб усвідомити і дозволити собі прийняти вже наявний рівень достатку, замість його знецінювати."], "p": true, "c": "Розстановки", "extra": ""}, {"t": "ОСуспільство.CLUB китайська медицина зустріч з Наталією Бородіною 24/11", "d": "2025-11-24", "u": "https://youtu.be/M4MwY7gLkJM", "s": "Це запис зустрічі з лікарем китайської медицини, яка розповідає про акупунктуру глибокого рівня — роботу з психологічними травмами (відвернення, заборона на життя) через меридіани, голкотерапію та гіпнотерапію. Вона ділиться клінічними випадками, пояснює принципи діагностики по язику та пульсу, а також дає практичні домашні поради (парити ноги, пити гарячу воду, точковий масаж).", "th": ["Травма відвернення (коли дитину не хотіли або хотіли іншу стать) проявляється фізично: холодні руки й ноги (у 80% випадків), раннє нетримання сечі, ранній клімакс, посивіння, облисіння за чоловічим типом — усе це можна коригувати через акупунктуру та гіпнотерапію, \"перезаписуючи\" життєвий сценарій.", "Існують різні рівні акупунктури: поверхнева \"суха голка\" для зняття болю (примітивний рівень) і глибока робота з меридіанами для калібрування нервової системи та розкриття психологічних кодів — авторка практикує саме другий підхід.", "Для лікування використовують різні типи голок залежно від задачі: стандартні для загальної роботи, тонші для схуднення, спеціальні після пластичних операцій (для виведення травми насильства від втручання металу) та косметичні для ліфтингу обличчя.", "Курс лікування зазвичай складається мінімум із трьох сеансів (класична китайська схема), а складні випадки (кісти, гінекологічні проблеми) можуть вимагати кількох місяців регулярних відвідувань.", "Пацієнтів із \"вивченою безпорадністю\" чи вторинною вигодою від хвороби (небажання насправді змінюватися) авторка свідомо не бере в роботу, оскільки без внутрішньої готовності пацієнта результату не буде.", "Домашні прийоми самодопомоги: паріння ніг (стимулює меридіани нирок, селезінки, шлунка, сечового міхура), пиття великої кількості гарячої води (розслаблює парасимпатичну нервову систему через блукаючий нерв, стимулює детоксикацію), масаж точок зап'ястя при стресі.", "Проведено паралель між китайською та аюрведичною медициною — обидві походять із тибетського кореня, але аюрведа краще підходить людям із південною ДНК (Індія, Пакистан, Іран), тоді як європейцям із північним корінням більше підходить китайська медицина."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "OSuspilstvo.CLUB Майстермайнд на пакеті POWER з Олею Ковальчук 18/11", "d": "2025-11-18", "u": "https://youtu.be/Uvw9S5Mf5GA", "s": "Це запис групового мастермайнду, де ведуча відповідає на запити учасниць про пошук справжніх бажань, вихід з боргів та проявленість у бізнесі. Головна ідея — повернення до себе через прості практики (їжа, тіло) та перехід від стану \"хочу\" до \"приймаю рішення\" як основа для реалізації будь-яких цілей.", "th": ["Щоб знайти справжні бажання, потрібно повернутися до себе через їжу — усвідомлено їсти, відчувати смак, їсти тільки коли голодний, а не за звичкою чи компанію — це найпростіший і найглибший спосіб трансформації.", "Різниця між \"хочу\" і \"приймаю рішення\": бажання завжди означає нестачу і повернення туди, де чогось немає, тоді як прийняття рішення (\"я не знаю як, але це буде\") запускає реальний рух до мети без постійного стресу.", "З грошима та боргами працює той самий принцип — не варто ставити ціль \"позбутися боргів\" (бо тоді постійно про них думаєш і вони ростуть), а краще поставити ціль створити \"подушку безпеки\", і борги вирішаться самі по собі.", "Для тих, хто хоче працювати з людьми (консультації, наставництво): потрібно спрощувати опис своїх послуг до зрозумілого рівня, обов'язково брати оплату чи донат замість безкоштовної роботи (бо безкоштовне не цінується і викликає прихований негатив), і збирати відгуки.", "Наведено приклад із книги про те, як людський розум відносно сприймає суми грошей — 50 шилінгів здавалися величезними, поки не з'явилась перспектива 5 мільйонів, і навпаки; висновок: варто свідомо робити грошові цифри \"легкими\" для себе.", "Внутрішний дозвил собі маті найкраще (навіть у дрібницях — номер у готелі, місце в літаку, окреме крісло) формується маленькими послідовними виборами на свою користь, і з часом це стає \"базовою прошивкою\", яка притягує відповідні обставини ззовні.", "Продавець послуг несе відповідальність за створення цінності й донесення її до потрібної аудиторії, але не за кінцевий результат клієнта — це передбачає чіткі особисті межі (наприклад, відмова брати в наставництво людей на антидепресантах чи алкоголі)."], "p": true, "c": "Мастермайнди", "extra": ""}, {"t": "ОСуспільство.CLUB зустріч Олі Ковальчук з учасницями 4/11", "d": "2025-11-05", "u": "https://youtu.be/eVd8QJbYH68", "s": "Це запис групового мастермайнду, де учасниці діляться особистими новинами (розлучення, народження дитини, зміни в житті) та обговорюють теми вибору себе, маленьких кроків до звички, енергії грошей та побутової магії (замовлення води, їжі). Головна ідея — справжня трансформація відбувається через маленькі, послідовні дії, а не силу волі чи різкі рішення, і через чесний вибір себе замість підлаштування під інших.", "th": ["\"Сила волі\" не працює довгостроково — вона забирає весь ресурс на короткий проривний ривок, після чого настає вигорання; натомість працюють маленькі щоденні дії, доведені до автоматизму (як чищення зубів), а не одноразові \"челенджі\".", "Концепція \"маленької, середньої і великої літери М\" — навіть мінімальна дія (один раз присісти замість повноцінного тренування) краще за нуль і має накопичувальний ефект, не варто соромитися малих кроків.", "Вибір себе означає не пояснювати причини відмови (особливо дорослим людям, на відміну від дітей, яким варто пояснювати) — просто визнати \"не можу\" чи \"не хочу\" без виправдань і почуття провини.", "Справжні бажання варто озвучувати вголос без очікування конкретного результату — наведено приклад, коли просте висловлене бажання (запрошення на подію) реалізувалося через людей навколо.", "Порада щодо ресурсу: вибирати заняття (тренування, вивчення мови), що приносять справжнє задоволення, а не виконувати їх через примус чи порівняння з іншими — тоді дія стає органічною звичкою, а не боротьбою.", "Побутова магія: перед їдою чи водою ставити намір (промовляти бажання, робити жест рукою над стравою \"струшуючи\" негативну енергію), замовляти чай/суп по годинниковій стрілці з побажаннями — це вважається реальною практикою впливу на енергетику продуктів.", "Практична порада для сну і енергії: закрити праву ніздрю і дихати лівою перед сном (активує парасимпатичну нервову систему) — простий спосіб покращити якість сну без додаткових зусиль чи медикаментів."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "ОСуспільство.CLUB лекція Антоніни Макаревич про ефективну комунікацію через запитання", "d": "2025-10-28", "u": "https://youtu.be/H_EyU2FNAn8", "s": "Це запис лекції Антоніни Вакаревич, кандидатки історичних наук, про силу правильно поставлених запитань у комунікації — з дітьми, партнерами, колегами та в бізнесі. Головна ідея — запитання, а не готові відповіді, допомагають людям самостійно дійти до розуміння проблеми і \"привласнити\" рішення, а також розкривають типи мислення (критичне, креативне, системне).", "th": ["Готові відповіді не так ефективні, як запитання, що спонукають людину самостійно прийти до висновку — це створює емоційний зв'язок і \"привласнення\" ідеї, особливо важливо у спілкуванні з дітьми.", "Існують закриті запитання (так/ні, для збору фактів) і відкриті (що, як, чому — для розкриття мотивів і причин); також є запитання, що звужують фокус (яка конкретна проблема) або розширюють горизонт (які ще можливості не розглянуто).", "Замість звинувачувальних запитань (\"чому ви запізнилися\", \"хто винен\") варто використовувати безпечні формулювання (\"що вплинуло на графік\", \"як ми можемо покращити ситуацію\") — це будує довіру, а не захисну реакцію.", "Метод \"5 чому\" (від засновника Toyota) допомагає діагностувати справжню причину проблеми, послідовно запитуючи \"чому\" до виявлення кореневої причини, а не лише симптому.", "Для подолання когнітивних упереджень і стереотипів корисно ставити собі запитання на кшталт \"яка інформація могла б переконати мене в протилежному\" або \"хто вирішив, що це має бути саме так\".", "Провокаційні запитання (\"що якщо зробити навпаки\", \"як би це вирішив хтось з іншої галузі\") допомагають ламати шаблони мислення і генерувати інновації, особливо при обмежених ресурсах.", "Щоденна практика саморефлексії (ранкові запитання \"який крок наблизить мене до мети\" і вечірні \"що пішло добре/не так і чому\") допомагає системно розвивати навичку постановки якісних запитань як інструмент для розвитку себе та інших."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "ОСуспільство.CLUB Розтановки на пакеті POWER", "d": "2025-10-23", "u": "https://youtu.be/rEZSa8T3Cbs", "s": "Це запис групового мастермайнду з кількома розстановками: Марина шукає, що заважає отримувати задоволення від життя і чому не може сформулювати чіткі цілі щодо курсу й будинку; Інна не може відпустити колишній бізнес попри розлучення. Наскрізна ідея — потреба у значимості є базовою людською потребою, і коли вона не задоволена в новій справі, людина продовжує чіплятися за стару, а нечіткі чи \"заоблачні\" цілі заважають рухатися вперед.", "th": ["Ціль має бути максимально конкретизована (не просто \"курс\" чи \"будинок\", а розписані конкретні цифри — скільки клієнтів, яка сума доходу, оренда чи покупка) — інакше людина застрягає в процесі, не розуміючи, куди рухатися.", "Рекомендується вести кілька окремих блокнотів для різних сфер (гроші, страхи/ред-флаги, ідеї) і записувати від руки, оскільки це покращує роботу мозку через дрібну моторику й краще фіксує наміри.", "У розстановці Інни виявилось, що небажання відпустити колишній бізнес — це насправді невирішена потреба у значимості; рекомендація — не \"відрізати\" зв'язок різко (це болісно), а перенаправити енергію значимості в нову справу, поки стара сама \"відсохне\" як пуповина.", "Потреба у значимості — базова для кожної людини (звідси й діти, які влаштовують істерики, щоб їх помітили) і закривається по-різному — важливо усвідомлено шукати підтвердження значимості в новому напрямку, а не приховано утримувати стару роль.", "Внутрішній непрямий \"дозвіл собі\" на успіх і кращий рівень життя часто заблокований родовими програмами (страх перевершити батьків чи рід) — усвідомлення цього і \"робота з мамою/родом\" допомагає зняти внутрішній супротив.", "Упередження на кшталт \"складно знайти хороших людей\" чи \"за таку зарплату ніхто не піде\" варто переписувати у протилежному ключі (на аркуші паперу через риску) — це змінює намір і полегшує притягання потрібних людей чи обставин.", "Важливо ставити чіткі особисті кордони щодо часу (вимкнені сповіщення, визначені години для роботи і сім'ї) — це запобігає роздратуванню від постійних переривань і допомагає залишатися в потоці; також варто просити допомоги у вищих сил, а не намагатися все контролювати самостійно."], "p": true, "c": "Розстановки", "extra": ""}, {"t": "ОСуспільство.CLUB зустріч Олі Ковальчук з учасницями", "d": "2025-10-15", "u": "https://youtu.be/X7U1HwNxDFk", "s": "Це запис групового мастермайнду, де ведуча пояснює три взаємопов'язані теми: як непереварені емоції \"цементуються\" в підсвідомості, якщо ними просто ділитися з людьми, які не можуть їх контейнувати; чому важливо привласнювати собі свої досягнення без страху зурочення; та як стан внутрішнього розслаблення притягує найкращий розвиток подій. Наскрізна ідея — підсвідомість не розрізняє добро і зло, а лише записує емоції, тому свідомий вибір стану й наміру формує реальність.", "th": ["Розповідання неприємних ситуацій людям, які не вміють \"контейнувати\" (приймати без осуду й допомоги у вирішенні), лише цементує проблему в підсвідомості замість її вирішення — краще проговорити на диктофон і видалити запис, або говорити тільки з тими, хто реально може допомогти.", "Підсвідомість не розрізняє реальність і уяву, тому важливо не \"проговорювати\" наперед цілі з людьми, які не мають стосунку до їх реалізації — це розпорошує концентровану енергію, потрібну для досягнення.", "Страх зурочення чи заздрощів виникає тільки тоді, коли людина не привласнює собі на 100% свої досягнення (успіх, красу, стосунки) — коли досягнення повністю \"своє\", боятися втратити його немає підстав.", "Головна мета жіночої енергії — розслаблення; коли жінка діє зі стану розслабленості (а не постійного напруження й контролю), рух до цілей відбувається швидше й легше, бо це резонує із загальною системою.", "Рекомендується щоденна практика: записувати досягнення (навіть дрібні) та відчувати намір \"яким я хочу бути сьогодні\" — це формує стабільний внутрішній стан, який притягує відповідні обставини (наведено особисті приклади з транспортом, поїздками).", "Тіло — компас: відчуття нудоти, важкості чи тривоги сигналізують \"не туди\", а легкість і радість — правильний напрямок; важливо тренувати чутливість до цих сигналів, а не діяти автоматично \"так треба\".", "Щодо благодійності й дрібних рішень (наприклад, чи давати гроші жебракам) — важливо діяти не з жалю (позиція \"вищий-нижчий\"), а з внутрішнього щирого пориву чи наміру; підсвідомість краще зчитувати через відчуття тіла, ніж через раціональні виправдання."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "ОСуспільство.CLUB майстермайнд на пакеті POWER 9/10", "d": "2025-10-09", "u": "https://youtu.be/hZ4XIz38nwI", "s": "Це запис групового Майстер Майнду (коучингової сесії), де учасниці по черзі діляться своїми запитами — переважно про бізнес, вигорання, стосунки та особисті кордони. Ведуча аналізує кожен запит і дає практичні поради, а головна наскрізна ідея — про важливість енергетичних меж, усвідомленого вибору та розподілу власного ресурсу, щоб уникнути вигорання.", "th": ["Якщо людина емоційно (енергетично) \"не розлучилася\" з бізнесом чи іншою справою, навіть формально відійшовши від справ, вона продовжує підсвідомо утримувати на собі відповідальність, і нові люди, які приходять на заміну, це відчувають і не затримуються.", "Щоб дійсно передати справу іншому, потрібно спочатку внутрішньо ухвалити рішення про це, поставити собі чіткі часові межі допомоги та озвучити їх, а не тягнути \"вічно\".", "Не можна братися одразу за все і намагатися зробити все \"разом і зараз\" — це веде до вигорання; ресурс потрібно розподіляти поступово, невеликими частинами, доводячи кожну справу до кінця.", "Страх — це нормально, і йти варто саме туди, де страшно, але тільки тоді, коли розумієш, як з цим страхом працювати, інакше можна отримати травматичний досвід.", "Будь-яка справа чи хобі потребує структури й дисципліни: без структури масштабування неможливе, а хаос лише плодить хаос.", "Варто давати собі усвідомлений термін (наприклад, рік) на нову діяльність, щоб чесно оцінити, чи варто продовжувати, а не кидати справу через два дні або, навпаки, тягнути її роками з невдоволенням.", "Постійне \"виговорювання\" проблем без наміру щось змінити лише закріплює (цементує) негативну ситуацію, тому важливо усвідомлено обирати, з ким і навіщо ділитися труднощами, а не просто скаржитися заради полегшення."], "p": true, "c": "Мастермайнди", "extra": ""}, {"t": "ОСуспільсво.CLUB зустріч з Дімою по візуальним хукам в відео", "d": "2025-10-01", "u": "https://youtu.be/TU8SOrWm9F4", "s": "Це запис навчального вебінару від відеографа/монтажера Діми про створення візуальних хуків для коротких відео (Reels, TikTok, Shorts). Головна ідея — перші 3 секунди відео вирішують, чи зупиниться глядач на контенті, і саме візуальні хуки, побудовані на еволюційних тригерах мозку, працюють швидше за вербальні.", "th": ["Мозок сприймає та оцінює контент у перші 300 мс–3 секунди на підсвідомому рівні, спираючись на еволюційні тригери: різкі зміни в оточенні, рух, обличчя з яскравими емоціями, потенційну загрозу або можливість.", "Формула AIDA (Attention, Interest, Desire, Action) — базова структура для побудови короткого відеоконтенту: спочатку хук привертає увагу, потім утримується інтерес, викликається емоційне бажання дивитися далі, і завершується закликом до дії.", "Для створення хуків можна використовувати метод SCAMPER (заміна, комбінування, адаптація, збільшення/зменшення, використання по-іншому, видалення елементів, реверс) — системний підхід до генерації креативних ідей.", "Візуальний хук обов'язково потрібно підбирати під конкретну цільову аудиторію — те, що чіпляє одну аудиторію, не спрацює на іншу, тому важливо розуміти \"де живе\" аудиторія, які предмети та ситуації їй знайомі.", "Звук у перші секунди відео так само важливий, як картинка: використовуються звуки \"вуш\" (для руху), \"райзер\" (наростаючий звук перед кульмінацією), \"імпакт\" (акцент на ключовій фразі), а тиша теж вважається звуковим прийомом.", "Джерелом ідей для візуальних хуків слугує Pinterest — там можна зберігати цікаві картинки і адаптувати їх під свою нішу та контекст.", "Хуки потрібно тестувати (за допомогою аналітики утримання уваги в Instagram, YouTube, TikTok) і за потреби змінювати, якщо аудиторія не затримується після перших секунд; водночас штучний інтелект наразі суттєво просунувся у генерації фото й відео, але формат \"живого\" експертного контенту з обличчям людини найближчі роки залишиться незамінним."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Осуспільство.CLUB розстановка на пакеті POWER з Олею 30.09", "d": "2025-10-01", "u": "https://youtu.be/uS7AcHSYdgQ", "s": "Це запис групової зустрічі з елементами розстановок і роботи з енергією, де ведуча спершу ділиться філософією про перехід від \"лінійного\" мислення (карма, регресії, тарологія як інструменти минулого) до довіри собі й простору, а потім проводить розстановку для Юлії, яка хоче дитину, але відчуває тілесний блок через перевантаженість роботою і контролем. Головна ідея — справжні зміни приходять не через зовнішні інструменти чи практики, а через усвідомлений вибір, відповідальність за своє життя та зв'язок з власним тілом.", "th": ["Усі езотеричні інструменти (таро, тета-хілінг, карма, регресії) працюють лише в парадигмі \"лінійного\" 3D-мислення (зробив-отримав), тоді як існує інший рівень — коли людина сама вирішує і це матеріалізується, без потреби в посередниках.", "Слово \"мені треба\" одразу створює відчуття дефіциту й нестачі; натомість варто формулювати \"я обираю\", \"я створюю\", \"я бажаю\", щоб не програмувати собі відсутність бажаного.", "Головний маркер правильного напрямку — відчуття власного щастя і розслабленості, а не напруги; напруга і тиск є сигналом, що рухаєшся не туди.", "Вдячність за вже наявне (навіть за дрібниці) розширює простір для нового, а постійне нівелювання того, що вже маєш, підтримує відчуття нестачі.", "Бізнес чи ідея, яка потребує великих вкладень \"спочатку\", часто є ілюзією его; ідеї, які можуть вижити і розвиватись без грошей, з великого бажання, а не з нужди, працюють краще.", "У розстановці для Юлії виявилось, що вона віддала своє тіло \"кудись\" ще до народження і не могла з ним з'єднатися через постійний контроль, обов'язки та досягаторство; рішенням стало усвідомлене повернення собі тіла та права ним розпоряджатися.", "Юлії порадили на два місяці відмовитися від зайвих обов'язків (роботи, аналізів, вітамінів, контролю), довіритися чоловіку в питаннях бізнесу і побуту, та зайнятися тілом через приємні практики (масаж, йога, прогулянки) замість \"треба\"."], "p": true, "c": "Розстановки", "extra": ""}, {"t": "ОСуспільство.CLUB майстермайнд на пакеті POWER 23/09", "d": "2025-09-24", "u": "https://youtu.be/ApAAh0ZiH2g", "s": "Це запис групового Майстер Майнду, де ведуча обговорює з учасницями теми проявленості (як почати діяти та ділитися своєю справою з людьми) та внутрішнього дозволу собі приймати і мати — гроші, допомогу від чоловіка, відмову від \"обов'язкового\" господарювання. Головна ідея — все, що людина має в житті, прямо пропорційне тому, наскільки вона сама собі це дозволяє.", "th": ["Проявлення — це дія, а не просто ведення сторінки в інстаграмі; соцмережі є лише платформою, а не самим проявленням, і без реальних дій (спроб працювати з людьми, навіть безкоштовно) результату не буде.", "Не варто чекати \"10 дипломів\" чи ідеальної готовності — досвід, навіть негативний чи маленький (одна людина, якій допоміг), є цінним результатом сам по собі.", "Порівнюючи себе з успішними блогерами чи наставниками, важливо розрізняти: одні транслюють реальний досвід і мотивують діяти, а інші створюють \"мильну бульбашку\" через маркетинг без реального попиту (наведені приклади салонів краси й квіткових магазинів як можливого \"відмиву грошей\").", "Якщо після перегляду чийогось контенту стає погано і хочеться порівнювати себе не на користь собі — краще відписатися від таких людей, бо це забирає енергію.", "Дозволяти собі приймати те, що хоче дати чоловік (гроші, подарунки, турботу) — важливий сімейний урок: якщо жінка постійно відмовляється брати, чоловік почуває себе не потрібним, і навпаки, коли жінка дозволяє собі приймати, стосунки змінюються на краще.", "Похвала чоловікові повинна йти не для того, щоб \"полестити\", а від щирого внутрішнього відчуття вдячності та впевненості в собі як жінці — тоді це працює зовсім по-іншому і зміцнює стосунки.", "Не обов'язково бути \"хазяйкою\" у традиційному розумінні (готувати щодня, прибирати самій) — можна свідомо обирати делегувати ці функції (найняти хатню робітницю, кухаря, замовляти їжу), якщо це не є ресурсом і не приносить задоволення, головне — щоб обом партнерам було комфортно."], "p": true, "c": "Мастермайнди", "extra": ""}, {"t": "Осуспільство.CLUB зустіч учасниць з Олею Ковальчук 18/09", "d": "2025-09-19", "u": "https://youtu.be/YeqBM4pJD-E", "s": "Це запис групового Майстер Майнду, де ведуча розповідає про техніку \"енергетичних фільтрів\" — інструмент для захисту особистого простору від людей, які забирають енергію (\"вампірять\"), та для збереження власного стану під час взаємодії з іншими. Головна ідея — навчившись ставити ці фільтри й слухати себе, людина зберігає свою енергію, менше сумнівається у виборах і починає жити своє власне життя, а не підлаштовуватися під інших.", "th": ["Фільтр — це не стіна, а спосіб обміну лише \"чистою\" енергією: людина залишається в своєму просторі, а співрозмовник у своєму, при цьому спілкування відбувається, але без енергетичного \"змішування\" й забирання одне в одного.", "Фільтри можна ставити не лише на людей, а й на квартиру, машину, готельний номер (\"золотий забір\") — це створює простір, де мешканці краще відпочивають і не ловлять чужі стани тривожності.", "Маркери того, що людина забирає вашу енергію: відчуття втоми чи спустошеності після спілкування, раптовий голод під час чи після зустрічі, нудота або інші тілесні реакції.", "Не варто \"відрізати\" неприємних людей повністю — це прояв его й дитяча позиція; краще навчитися ставити фільтри, залишаючись відкритою для взаємодії, даючи іншим шанс на неї.", "Люди, які болісно реагують на чужий успіх (заздрять, знецінюють), роблять це не через саму людину, а через власне незадоволення своїм життям — це їхній процес, а не провина того, хто досяг результату.", "Важливо розрізняти \"працювати на своїй енергії\" (що веде до виснаження й вигорання) і бути \"провідником\" чистої енергії з простору — друге дає результат без втоми як для того, хто дає, так і хто отримує.", "Сумніви — це не власні думки людини, а чужі думки/установки, підхоплені від авторитетних людей; коли людина точно знає, куди рухається, кожне її рішення стає \"правильним\" і енергія не витрачається на постійні вагання."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "Осуспільство.CLUB лекція від Олександра Панаріна \"Як навчитися вчитися\" 17/09", "d": "2025-09-17", "u": "https://youtu.be/2dB4XkFzV7A", "s": "Це лекція Олександра Панаріна, педагога з багаторічним досвідом, про те, як дорослим людям ефективно вчитися і здобувати нові знання та навички. Головна ідея — навчання дорослих принципово відрізняється від навчання дітей, і без чіткої мети та зв'язку з попереднім досвідом нова інформація не засвоюється, а \"викидається на звалище пам'яті\".", "th": ["Стара освітня система (постсовєтська школа) формувала \"знаннявий компонент\" — накопичення фактів, бо книжка й вчитель були єдиним джерелом інформації; сучасний світ змінився, і головна навичка тепер — вчитися протягом усього життя, а не накопичувати знання заради знань.", "Є різниця між знаннями і навичками: знання без напрацьованих навичок не мають цінності, а навички без знаннєвого компонента можуть дати збій, якщо алгоритм порушиться і людина не розуміє, де сталася помилка.", "Мозок дорослої людини працює інакше, ніж мозок дитини чи підлітка: нейронні зв'язки формуються повільніше і складніше, зате вони стабільніші; тому не можна вимагати від дорослого мозку такої ж швидкості засвоєння, як у 15-20-річному віці.", "Будь-яке навчання дорослої людини повинно мати конкретну мету — мозок не виділяє ресурс на навчання \"просто так\", і якщо мета незрозуміла, виникає прокрастинація, а інформація не запам'ятовується.", "Нові знання у дорослих закріплюються лише тоді, коли вони \"чіпляються\" за вже наявний досвід — позитивний, негативний або дотичний з інших сфер; без цього гачка інформація \"не знаходить своєї шафки\" і губиться.", "Обираючи курс чи навчальну програму, варто перевіряти, чи чітко визначена цільова аудиторія курсу («для кого він») — якщо автор курсу сам не уявляє свого типового слухача, ви навряд чи отримаєте від навчання те, за чим прийшли.", "Не варто соромитися здобувати нові знання і навички в будь-якому віці — соромно радше видавати себе за експерта, не будучи ним; головне — знайти внутрішню зацікавленість і розуміння, навіщо вам конкретне навчання."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Суспільство.CLUB розстановки серпень 28.08", "d": "2025-08-28", "u": "https://youtu.be/Ox9hb3mjsNc", "s": "Це запис групового Майстер Майнду з елементами розстановок, де учасниці по черзі опрацьовують свої запити — від запуску мовного клубу та наставництва до питань делегування, невпевненості в новому напрямку та навіть тривоги перед пологами. Головна ідея — успіх у будь-якій справі залежить від чіткого розуміння свого напрямку, внутрішньої впевненості та готовності самій пройти шлях, а не шукати \"чарівну паличку\" чи покладати відповідальність на когось іншого.", "th": ["Краще починати з індивідуальної, дорожчої роботи з клієнтами, ніж одразу з групового формату — це дає швидший результат, і лише пізніше, коли клієнти \"доросли\" до одного рівня, можна пропонувати їм груповий формат чи клуб.", "Ціну варто піднімати поступово: почати з нижчої вартості, щоб \"обкататись\" і отримати досвід та відгуки, а вже потім підвищувати, коли з'являться реальні результати клієнтів.", "Важливо чітко визначити свою нішу та аудиторію (розписати характеристики вже наявних клієнтів), а не намагатися одночасно вести кілька різних напрямків (\"каша\") — це заплутує потенційних клієнтів щодо того, хто ти є.", "Невпевненість у собі й бажання, щоб хтось \"зібрав\" клієнтів замість тебе (через партнера, ментора чи систему), є ознакою того, що людина не готова брати на себе повну відповідальність за свою справу й хоче оминути етап власної роботи над собою.", "Бізнес, який залежить від власника і не може працювати без нього, — це не бізнес, а самозайнятість; справжній бізнес будується як система, яку можна делегувати.", "При делегуванні завдань (наприклад, СММ-спеціалісту) важливо не перекладати повністю відповідальність, а чітко знати, який результат потрібен на виході, і давати конкретні завдання — інструмент працює на тебе, а не замість тебе.", "Найкращою мотивацією в роботі з клієнтами є щире бажання віддавати й допомагати людям, а не власне его чи потреба щось довести — тоді питання наявності клієнтів вирішується само собою, оскільки люди відчувають цей намір."], "p": false, "c": "Розстановки", "extra": ""}, {"t": "Суспільство.CLUB зустріч з Олею 25.08", "d": "2025-08-26", "u": "https://youtu.be/6Fj5ztNhBlw", "s": "Це запис групового Майстер Майнду, де ведуча на власних прикладах (загублені чоловіком гроші на кордоні, підозра на новоутворення при обстеженні) розкриває тему усвідомленого вибору реакції на ситуацію та впливу на власне життя через прийняття, а не контроль. Головна ідея — треба чітко знати, чого хочеш, приймати будь-який варіант розвитку подій і не намагатися контролювати процес, а лише результат.", "th": ["У будь-якій стресовій ситуації є кілька варіантів реакції, і саме усвідомлений вибір реакції (а не автоматична, з его чи образи) формує подальшу реальність — на прикладі ситуації з забутими чоловіком грошима на кордоні.", "Щоб отримати бажане (гроші, статус, здоров'я, стосунки), треба бути готовим прийняти все, що йде \"в комплекті\" з цим — зворотну сторону медалі, відповідальність, витрати, неприємні моменти обстежень тощо.", "Наміри можна ставити не лише глобальні, а й маленькі — на день, на тиждень, на конкретну ситуацію, і це теж працює та дає відчутний результат.", "Питання, на яких людина \"не зациклюється\" (не тримається за них з напругою), часто вирішуються найлегше і найшвидше, тоді як надмірна фіксація на бажаному, навпаки, віддаляє результат.", "Керівник/власник має контролювати лише результат, а не процес — коли людина сама вирішує, як саме зробити роботу, і отримує чіткий запит \"який результат і до якого терміну\", ефективність зростає.", "Складні люди чи ситуації в житті (конфліктний колишній чоловік, син, від'їзд брата в армію) можуть бути дзеркалом власних непропрацьованих моделей поведінки чи \"уроком\", який показує, що варто змінити в собі, а не в інших.", "Успішна і щаслива людина — це не та, у кого багато грошей чи речей, а та, хто не боїться показувати свою вразливість і почувається щасливою в усіх сферах життя одночасно — родині, оточенні, реалізації."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "Суспільство.CLUB зустріч по Інстаграму 21.08 з Вікторією Довжук", "d": "2025-08-22", "u": "https://youtu.be/dUApOBA2TtM", "s": "Це запис лекції Віки для учасниць закритого клубу про те, як будувати систему продажів та просування в інстаграмі для експертів, сервісного та товарного бізнесу. Головна ідея — успішний онлайн-бізнес тримається на трьох китах: трафік, побудова довіри аудиторії та продуктова лінійка, а все починається з чіткого розуміння болей свого цільового клієнта.", "th": ["Будь-який бізнес (експертний, сервісний, товарний) потребує трьох основних елементів: трафік людей, побудова довіри через \"прогрівочну станцію\" контенту, та продуктова лінійка, яка поступово закриває різні потреби клієнта.", "Довіра будується через розуміння клієнта: людина не стане клієнтом, якщо не відчуває комфорту і не поділяє цінності експерта — приклад із салоном краси, де майстер, що нав'язливо продає, втрачає клієнтів, на відміну від того, хто будує стосунки.", "Контент повинен розподілятися приблизно так: 60% рілсів — \"хукові\", розраховані на холодну аудиторію через болі; 30% — утеплюючі, через кейси й історії; 10% — прямий продаж із чітким закликом до дії.", "Ключове завдання — чітко прописати \"ядро\" цільового клієнта: його болі, страхи, заперечення, про що він думає зранку, чого не отримав від попередніх спроб вирішити проблему; найкраще для цього — проаналізувати себе як колишнього клієнта.", "У профілі важливий кожен елемент (ім'я, опис на 150 символів) — вони мають закривати головну біль аудиторії і бути точно орієнтованими на конкретний сегмент клієнтів, а не на всіх підряд.", "Реклама (платний трафік) є необхідною навіть для органічного росту — безкоштовні інструменти на кшталт рілсів працюють повільніше, а без постійного оновлення аудиторії довгостроково \"вигорає\" навіть хороша прогрівочна система.", "Тренд ринку зміщується у бік індивідуалізованого підходу та малих груп замість масових потокових навчань — люди готові платити більше за те, щоб їх \"вели за руку\" до конкретного результату, а не залишали самостійно розбиратися."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Суспільство.CLUB ченеллінг медитація з Леною Рибіною", "d": "2025-08-15", "u": "https://youtu.be/tcNZERj1WpU", "s": "Це запис групової медитаційної сесії, присвяченої темі ченнелінгу — техніки з'єднання з Вищим Я, ангелами чи іншими духовними сутностями для отримання відповідей на важливі питання. Ведуча пояснює теорію ченнелінгу, а потім проводить покрокову медитацію: заземлення, очищення чакр, встановлення енергетичного захисту та зустріч з Вищим Я для отримання послань.", "th": ["Ченнелінг — це від слова \"channel\" (канал): людина виступає провідником, підключаючись до якогось джерела енергії (Творця, Вищого Я, душі, ангелів, архангелів) і проводячи цю енергію через себе.", "Правильність підключення визначається за відчуттями: якщо енергія правильна — відчуття розширюючі, легкі, піднесені; якщо щось не те — виникає стиснення, зжимання чи холод, і тоді можна просто \"відключитися\" й уявити очищення (наприклад, душ).", "Ніяка сила не може нашкодити людині без її свідомої або несвідомої згоди, оскільки світла завжди більше — це важливо знати і пам'ятати, щоб не боятися практики.", "Алгоритм медитації складається з кроків: заземлення, проходження по чакрах з їх очищенням та наповненням, підняття енергії через корону, формування енергетичного кокона, встановлення потрійного захисту (з формулою про допуск лише сутностей зі світла Творця) та власне підключення до Вищого Я.", "Під час зустрічі з Вищим Я можна ставити будь-які питання, навіть дрібні, оскільки ця сутність знає все про душу людини, її шлях та минулі втілення, і немає \"незначних\" питань.", "Ангели-охоронці та наставники не можуть порушувати свободу волі людини, тому важливо звертатися до них напряму з проханнями про допомогу — тоді вони отримують \"дозвіл\" діяти адресно, а не лише опосередковано.", "Здатність чути/бачити послання — це навичка, яку потрібно тренувати поступово (\"як м'яз\"); у кожної людини свій домінантний канал сприйняття (ясне знання, яснобачення через картинки, відчуття в тілі), і варто звертати увагу, який канал працює найкраще, та розвивати саме його."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Суспільство.CLUB MM з Олею на пакеті POWER 14/08", "d": "2025-08-15", "u": "https://youtu.be/QecGnZ62PIM", "s": "Це запис групового Майстер Майнду, де ведуча на прикладах зі свого життя (переїзд у Грецію, забуті чоловіком гроші, вибір перукаря та тренера) розкриває тему усвідомленого вибору себе замість ролі \"хорошої дівчинки\". Головна ідея — коли людина повністю обирає себе і чітко знає, чого хоче, без сумнівів, реальність починає підлаштовуватися, тоді як постійні перешкоди сигналізують про рух не у своєму напрямку.", "th": ["Конструкція мислення \"якби... тоді б я\" не працює — реальність підлаштовується тільки під стовідсоткове рішення \"я хочу це і я це обираю\", без прив'язки до зовнішніх обставин.", "\"Везіння\" — це показник того, що людина рухається своїм шляхом і призначенням; постійні перепони, навпаки, сигналізують, що рух відбувається не в тому напрямку.", "Бути \"хорошою дівчинкою\" для інших (терпіти поганий сервіс, боятися образити майстра чи подругу, підлаштовуватися) — це зрада себе; натомість чесність із собою, навіть якщо вона незручна, завжди вигідна для власного стану та якості стосунків.", "Якщо результат взаємодії (з майстром, тренером тощо) не влаштовує, краще все одно залишити чайові/оплату повністю або навіть більше — це \"закриває гештальт\" енергетично і звільняє від прив'язки до негативної ситуації, на відміну від скупості, яка утримує зв'язок.", "Не варто ображатися на людей, які не обирають вас (не приходять на важливі події, зраджують довіру) — це їхній дорослий вибір, і краще прийняти це спокійно, зробивши власний висновок про подальші стосунки, без дитячої образи.", "Прийняття всього, що приносить доля (і хорошого, і поганого), без боротьби з обставинами, відкриває канал для достатку та можливостей — коли людина готова тільки до хорошого, це звужує \"пропускний канал\" її реальності.", "Матеріальні і нематеріальні бажання (діти, стосунки) варто приймати цілісно — з усіма недоліками й труднощами, а не лише в ідеалізованому вигляді, інакше очікування не відповідатимуть реальності і викликатимуть розчарування."], "p": true, "c": "Мастермайнди", "extra": ""}, {"t": "Суспільство.CLUB зустріч з Інною 07.08", "d": "2025-08-08", "u": "https://youtu.be/kRZ3PjrJqaI", "s": "Це запис лекції Інни (учасниці спільноти, яка веде йогу та є наставницею), яка на основі власного 15-річного духовного досвіду розповідає про рівні свідомості — від несвідомого проживання ролей до стану \"автора свого життя\". Головна ідея — зовнішнє життя формується внутрішнім станом, і через усвідомленість та практику \"проживання зарядів\" людина може перестати страждати і почати свідомо впливати на власну реальність.", "th": ["Існує чотири умовні рівні свідомості за аналогією до фрази Шекспіра: актор (несвідоме проживання ролей і страждання), глядач/спостерігач (усвідомлення ролей без залучення), режисер (свідомий вибір ставлення до ситуацій) та автор/вищий стан (тиша розуму, з якої народжуються ідеї).", "Практика \"проживання заряду\" — це занурення (мінімум на три хвилини) у неприємну емоцію без оцінки, аналізу чи спроби втекти від неї; це дозволяє емоції \"розчинитися\" і перестати впливати, на відміну від позитивних афірмацій, які дають лише тимчасовий результат.", "На людину впливає багато факторів і \"програм\" (кармічні, родові, галактичні тощо), тому немає сенсу винити себе чи інших за реакції та поведінку — усвідомлення цього знімає внутрішні претензії.", "Близьке оточення часто несвідомо \"провокує\" наші больові точки не випадково, а для того, щоб підняти заряди для проживання і звільнення — тому варто бути вдячними за це, а не ображатися.", "Стосунки з іншими людьми відображають наше ставлення до самих себе: якщо людина перебуває в ролі жертви, вона провокує тирана поруч; зміна власного внутрішнього стану автоматично змінює поведінку оточення.", "Тілесні та дихальні практики (йога, дихання) допомагають повернути увагу в момент \"тут і зараз\", оскільки саме присутність у моменті є ключем до виходу зі страждань — біль реальний, а страждання є ілюзією, породженою розумом.", "Внутрішня чесність із собою (визнання справжніх емоцій за маскою, наприклад заздрощів під виглядом критики) дозволяє тригерам втрачати силу — практику усвідомлення варто застосовувати постійно в житті, а не як окрему вправу \"сів і усвідомив\"."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Суспільство.CLUB ММ з POWER 31/07", "d": "2025-08-01", "u": "https://youtu.be/g93-2HjXb4c", "s": "Це запис групового Майстер Майнду з елементами розстановок, де ведуча обговорює з учасницями тему енергій \"відшарування\" старого досвіду, дозволу собі нового, а також проводить дві розстановки — для Марини (щодо проявлення в соцмережах) та Яни (щодо того, чого вона насправді хоче в житті). Головна ідея — без чіткого розуміння того, чого людина хоче насправді (а не поверхневих цілей типу \"підписники\" чи \"стабільність\"), бажане не може реалізуватися, і важливо навчитися брати відповідальність за власне щастя, а не перекладати гіперопіку на інших.", "th": ["Зараз відбувається енергетичне \"відшарування\" старих програм і страхів, і землі вже \"нема куди\" їх приймати — тому старе потрібно відпускати в простір, спостерігаючи за своєю готовністю до змін.", "Важливо шукати новизну в житті — пробувати нове (їжу, маршрути, досвід), бо це активізує нейронні зв'язки та відкриває можливості, на відміну від автоматичного, звичного способу життя.", "У розстановці для Марини виявилось, що справжнім бажанням за \"проявленням в соцмережах\" було не заробити грошей, а отримати визнання власної значущості (\"я не просто хороша дівчинка, а крута\") — і дозволити собі це визнати виявилось складніше, ніж сформулювати бізнес-ціль.", "Люди часто копіюють чужі практики та контент без розуміння суті (\"зіпсований телефон\"), і відповідальність за те, що вони потім \"продають\" далі, лежить на них самих, а не на першоджерелі інформації.", "У розстановці для Яни виявилось, що вона не знає, чого хоче насправді (вживає розмиті слова \"свобода\", \"стрес\", \"сім'я\"), і поки людина не розуміє свого справжнього бажання, реальність не може дати їй те, за чим вона звертається.", "Гіперопіка над рідними (постійна допомога, контроль, порятунок) робить їх слабшими і позбавляє можливості прожити власний досвід душі — натомість варто довіряти їхній силі та спрямовувати енергію на себе.", "Практика \"Я є\" (промовляння чи викрикування цієї фрази, особливо біля води, в лісі, на природі) допомагає повернути себе до контакту з собою і своїми базовими потребами, коли людина загубилась у гіперопіці над іншими та невизначеності власних бажань."], "p": true, "c": "Мастермайнди", "extra": ""}, {"t": "Суспільство.CLUB зустріч з учасницями клубу 24.07", "d": "2025-07-25", "u": "https://youtu.be/9juziD-0VGU", "s": "Це запис групового Майстер Майнду, де ведуча розповідає про важливість рівня свідомості, чіткого визначення цілей та довіри до вищих сил і власного роду. Головна ідея — щоб досягти бажаного, потрібно точно знати, куди рухаєшся (навіть якщо шлях невідомий), обирати себе замість підлаштування під інших, та використовувати різні інструменти (нумерологію, звернення до роду, зміну імені) як допоміжні засоби на цьому шляху.", "th": ["Потрібно ставити перед собою амбітні цілі, навіть не знаючи як до них дійти — головне не обмежувати себе рамками \"неможливо\", а поставити ціль і рухатися, довіряючи, що шлях складеться.", "Чоловікам достатньо знати одне правило: якщо дружина задоволена (не лише фізично, а й фінансово захищена), у нього все буде добре в бізнесі — приклади показують, що коли чоловіки починають давати гроші дружинам, їхні справи покращуються.", "Важливо обирати себе навіть коли це складно і йде проти авторитету чи статусу іншої людини — відмова від невигідних умов, навіть впливовим людям, дає відчуття власної сили та звільняє енергію.", "Нова мантра \"яким подарунком цей світ може бути для мене?\" допомагає перевести фокус з претензій до світу на пошук можливостей і рішень у кожній ситуації, включно зі складними.", "Можна брати приклад (\"мімікрія\") з людей чи персонажів, чиї якості захоплюють (дисципліна спортсменів типу Усика чи Роналду), щоб мотивувати себе на дії, яких сам не робив би.", "Усік свідомо підключається до потужних \"егрегорів\" (казацтва та православ'я) замість покладання лише на власні сили — це приклад того, як можна брати допомогу від роду, вищих сил, а не покладатися тільки на себе.", "Нумерологія, вибір імені, номерів карток/машин — це додаткові інструменти (як пральна машина чи GPS), які допомагають налаштуватися на потрібну хвилю, але не знімають особистої відповідальності за власний стан і дії."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "Суспільство.CLUB зустріч POWER 17/07", "d": "2025-07-18", "u": "https://youtu.be/uOLkA4wvcQk", "s": "Це запис групового Майстер Майнду, де ведуча ділиться історіями зі своєї поїздки до Греції та розкриває тему \"бути собою\" — вміння обирати себе навіть у дрібницях, не підлаштовуючись під колектив чи очікування інших. Головна ідея — усвідомлення власних цінностей та відмова терпіти дрібні незручності (замість накопичення прихованого стресу) відкриває шлях до внутрішньої свободи і, як наслідок, до легшого й багатшого життя.", "th": ["Важливо визначити свої головні цінності (наприклад, свобода, здоров'я) і детально розписати, що конкретно для вас це означає — це дає чітке розуміння, на що ви згодні, а на що ні.", "Вибір себе не означає конфлікт чи агресію — можна спокійно і без сварки сказати \"мені так не підходить\", і оточення це сприйме нормально, навіть якщо спочатку дивуються.", "Накопичені дрібні \"мовчазні\" незручності (як тісне взуття, що муляє) створюють приховану напругу, яка рано чи пізно виливається у більші конфлікти або проблеми зі здоров'ям — краще одразу проговорювати дискомфорт.", "Є різниця між \"терпінням\" (коли ти пригнічуєш незгоду і застрягаєш у \"вивченій безпорадності\") та \"прийняттям\" (коли ти свідомо і спокійно погоджуєшся на обставини без внутрішнього спротиву чи роздратування).", "\"Готовність\" отримати бажане (гроші, можливості, стосунки) приходить лише через розуміння себе — не можна різко отримати те, до чого психологічно не готовий, бо це може \"розірвати\" або призвести до втрати цього.", "Дозволяючи собі маленькі відмови та вибори (наприклад, не брати участі у спільних витратах, які не відповідають своїм принципам), людина поступово звільняється від ролі \"хорошої дівчинки\", яка пригнічує справжні почуття заради схвалення інших.", "Приклад з дитиною (відкладене виконання бажання — \"почекай тиждень на кактуси\") показує, що вміння чекати чи не отримувати все одразу формує здорове ставлення до бажань і запобігає втраті інтересу."], "p": true, "c": "Мастермайнди", "extra": ""}, {"t": "Суспільство.CLUB Майстермайнд з Олею", "d": "2025-07-01", "u": "https://youtu.be/0NQxPDn4jA4", "s": "Це запис групового Майстер Майнду, де ведуча відповідає на питання учасниць про гроші, мотивацію та лінь, а також розбирається ситуація з бухгалтером, який роками обкрадав бізнес однієї з учасниць. Головна ідея — гроші й бажане приходять через внутрішній вибір і дозвіл собі, а не через очікування \"коли з'являться гроші, тоді я вирішу\"; спочатку вибір — потім дії та результат.", "th": ["Гроші завжди \"в тобі\", а не десь у всесвіті чи в чужих руках — потрібно перетворювати свої бажання на потреби (\"це моя життєва необхідність\"), і тоді кошти на них знаходяться.", "Правильна послідовність: спочатку робиш вибір (\"я їду\", \"я обираю\"), а потім з'являються ресурси й обставини для реалізації — а не навпаки, коли чекаєш грошей, щоб потім наважитися.", "Дрібні лінощі типу поспати замість того щоб щось робити — це не завжди лінь, а може бути екологічним ставленням до себе й відновленням ресурсу, який потім дає більше енергії для справ.", "Важливо мати не одну велику ціль, а й проміжні маленькі радісні цілі (\"піт-стопи\"), інакше на шляху до великої мети людина \"зношує шини\" і не отримує підживлення емоціями.", "У ситуації з бухгалтером, яка роками таємно обкрадала бізнес, головний урок — власник сам створює умови для крадіжки, коли немає чіткої прозорої системи контролю фінансів (єдина особа для оплат, платіжні дні, окремий чат для узгодження витрат).", "Варто регулярно запитувати себе \"кому я зараз віддаю своє життя?\" — щоб відрізняти дії, які роблять свідомо і з любов'ю, від тих, що робляться з почуття провини чи страху чужої думки.", "Дитинство та травми можна усвідомити й змінити своє ставлення до них, але не варто нескінченно виправдовувати бездіяльність минулим — важливо знати, куди рухаєшся, тоді \"розчищення\" старого має сенс і результат."], "p": false, "c": "Мастермайнди", "extra": ""}, {"t": "Суспільство.CLUB зустріч з Танею Мордик по стихіям в астрології", "d": "2025-06-27", "u": "https://youtu.be/yNL6aHKiYZo", "s": "Це запис лекції Тані, яка проводить свій дебютний астрологічний виступ у групі, присвячений двом темам: чотирьом стихіям в астрології (вогонь, повітря, земля, вода) та кармічним вузлам (Раху і Кету) в 12 будинках гороскопу. Головна ідея — стихії показують баланс енергій людини, а кармічні вузли вказують на досвід із минулого життя та напрямок, у якому варто розвиватися в поточному житті.", "th": ["Кожна стихія (вогонь, повітря, земля, вода) відповідає певному типу темпераменту: вогонь — холерик (активний, запальний, лідер), повітря — сангвінік (комунікабельний, непостійний), земля — меланхолік (практичний, вперта), вода — флегматик (емпатичний, чутливий, пасивний).", "При нестачі певної стихії варто компенсувати її відповідними діями: вогню — бувати на сонці, в сауні; повітря — гуляти, кататися на велосипеді; землі — ходити босоніж, бувати на природі; води — бувати біля водойм, дивитися емоційні фільми, щоб \"виплакати\" емоції.", "Південний кармічний вузол (Кету) показує напрацьовані в минулому житті якості та зону комфорту, а північний вузол (Раху) вказує на сферу, яку потрібно розвивати в поточному житті — вони завжди розташовані в протилежних будинках гороскопу (наприклад, 1-й і 7-й, 2-й і 8-й).", "Кармічні вузли роблять повне коло по натальній карті за 18,5 років, тому найсильніші \"перевірки\" правильності обраного життєвого шляху відбуваються у віці 36-38 та 54-56 років.", "Для точного розрахунку положення вузлів необхідний точний час народження людини; якщо час невідомий, для визначення стихій можна умовно використовувати \"космограму\" з часом 12:00 дня, але для вузлів потрібна точність, яку можна встановити через процедуру ректифікації у спеціаліста.", "Кожна пара будинків (наприклад, 2-й і 8-й — фінанси, 4-й і 10-й — сім'я та кар'єра, 6-й і 12-й — служіння та духовність) описує протилежні життєві сфери, і завдання людини — перейти від напрацьованого в минулому досвіду (південний вузол) до розвитку нової, ще не освоєної якості (північний вузол).", "Гороскопи фірм і компаній іноді підбирають персонал з урахуванням переважання стихій у співробітників — наприклад, підбирають \"вогняний\" колектив для активної, ініціативної роботи або \"заземлених\" людей для чіткого виконання завдань."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Суспільство.CLUB зустріч з Олею 19.06", "d": "2025-06-20", "u": "https://youtu.be/4DJudnoiY_I", "s": "Це запис групового Майстер Майнду, де ведуча розкриває тему усвідомленого вибору як основи для змін у житті. Головна ідея — спочатку людина робить вибір і входить у певний внутрішній стан, а вже потім реальність підлаштовується під цей вибір; при цьому важливо привласнювати собі результати своїх дій, а не приписувати зміни зовнішнім обставинам чи іншим людям.", "th": ["Формула реалізації бажань: спочатку внутрішній стан і вибір, а потім матеріальне втілення — а не навпаки (\"коли це станеться, тоді я буду щасливою\").", "Людина може відповідати лише за власні вибори та дії, а не за вибори інших (навіть дітей чи близьких) — це знімає зайву відповідальність і дозволяє зосередитися на собі.", "Формула досягнення мети складається з трьох елементів: істинна особиста мета (не нав'язана ззовні), відчуття тотальної безпеки (фізичної та фінансової) та тотальна довіра/віра в те, що бажане здійсниться, навіть не знаючи як.", "Важливо давати собі час на реалізацію вибору і не \"зривати настройки\" через нетерпіння — якщо очікуваний результат не приходить за кілька днів, це не означає, що метод не працює.", "Тренувати навичку \"створення\" реальності краще на дрібних, безпечних речах (виграти щось, отримати дрібний подарунок), перш ніж переходити до масштабних цілей — це напрацьований навик, як м'яз.", "Коли людина сама змінюється та йде до свого вибору, змінюється і простір навколо неї, включно з близькими людьми (чоловіком, дітьми) — але важливо привласнювати ці результати собі, а не заздрити чи применшувати свій внесок.", "Робота з батьками (мама-тато) — це насамперед внутрішня робота над власною цінністю та впевненістю, а покращення стосунків із батьками є лише бонусом, а не головною метою цього процесу."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "Суспільство.CLUB зустріч з Юлією Ждановою корисні ANTI-AGE звички у харчуванні", "d": "2025-06-19", "u": "https://youtu.be/cVQcURBz1YQ", "s": "Це запис лекції нутриціолога Юлі на тему анти-ейдж підходу до здоров'я, де вона пояснює зв'язок між станом ЖКТ, засвоєнням поживних речовин та зовнішнім виглядом. Головна ідея — краса і молодість починаються зсередини, а здоров'я шкіри, волосся та загальне самопочуття напряму залежать від роботи кишківника, печінки та правильного насичення організму амінокислотами, колагеном і вітамінами.", "th": ["Здоров'я починається не з того, що ми їмо, а з того, що засвоюється — тому першочергово важливо налагодити роботу ЖКТ (жовчного, кишківника), а вже потім насичувати організм добавками, інакше вони просто не подіють.", "Базові щоденні звички: тепла вода зранку, денна норма води (2-2,5 літри) до 18:00, правильний різнокольоровий сніданок з овочами, корисними жирами та білком (наприклад, два яйця).", "Солодке краще їсти одразу після основного прийому їжі, а не окремо — це менш шкідливо для рівня цукру; для зменшення тяги до солодкого допомагає добавка хром та періодична протипаразитарна програма (чорний горіх, поударко, хлорофіл).", "Регулярний стілець (раз на день) — важливий показник здоров'я органів детоксикації; якщо його немає, жодні косметологічні процедури не дадуть результату, оскільки токсини повертаються в організм.", "Раз на рік варто робити чекап аналізів (залізо, феритин, вітамін Д, ТТГ), причому орієнтуватися не лише на нижню межу референсу, а прагнути показників ближче до верхньої межі для повноцінного функціонування організму.", "Колаген та амінокислоти є основою для зміцнення сполучної тканини (шкіра, суглоби, внутрішні органи), але колаген має бути гідролізованим (розкладеним на пептиди), без цукру/підсолоджувачів, і ефект на шкірі може проявитися не раніше ніж через місяць, оскільки організм спочатку спрямовує ресурси на важливіші процеси.", "Після 35 років жінкам рекомендується обмежити свіжу молочку (залишивши тверді витримані сири) та продукти, що провокують запалення (глютен, цукор, алкоголь, соуси) — це помітно покращує стан шкіри та загальне самопочуття."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "12.06 Розстановки на пакеті POWER", "d": "2025-06-13", "u": "https://youtu.be/tNhHB1r0658", "s": "Це запис групового Майстер Майнду з елементами розстановок, де ведуча проводить дві потужні сесії — для Лени (про повернення до внутрішньої дитини та безумовного щастя) та для Юлі (про страх брати гроші за свої послуги, пов'язаний із травматичними словами матері). Головна ідея — досягнення однієї великої цілі недостатньо, потрібно постійно ставити нові цілі та повертатися до контакту зі своєю \"внутрішньою дитиною\", а також пропрацьовувати стосунки з батьками, оскільки саме звідти походять блоки у дорослому житті, включно з фінансовими.", "th": ["Досягнення великої мети без проміжних цілей може призвести до спустошення (\"маленька смерть\" для мозку) — тому важливо ставити собі декілька цілей одночасно, щоб не зупинятися в русі.", "У розстановці для Лени виявилось, що вона в дитинстві втратила стан безумовного щастя через батьківський розлад та погрози батька; повернення контакту з \"внутрішньою дитиною\" зняло фізичне напруження в тілі.", "Музика, смаки та запахи з дитинства можуть бути потужним інструментом для повернення до себе та відновлення втрачених станів і енергій.", "У розстановці для Юлі виявилось, що страх брати гроші за послуги пов'язаний із травматичною фразою матері (\"ти навіть проституткою не зможеш бути\"); проговорення цього напряму з \"фігурою мами\" в розстановці зняло фізичне напруження та страх.", "Ціну на свої послуги не можна встановлювати, орієнтуючись на ринок чи інших людей — вона має відповідати внутрішньому відчуттю власної цінності, інакше буде дисбаланс в енергообміні з клієнтами.", "Непропрацьовані стосунки з батьками (особливо протилежної статі) часто відтворюються згодом у стосунках з партнерами — приклад із власного досвіду ведучої про розрив і відновлення стосунків з батьком та зміни в шлюбі.", "Практики (типу \"мама-тато\") працюють, якщо їх реально виконувати, а не робити частково чи відкладати — регулярна робота над собою призводить до реальних змін у стосунках і фінансовому становищі найближчим часом."], "p": true, "c": "Розстановки", "extra": ""}, {"t": "10/06 Сексологічна практика з Анастасією Авраменко Суспільство.CLUB", "d": "2025-06-10", "u": "https://youtu.be/mCJ29lgUK7A", "s": "Це запис групового заняття з сексологом, яка проводить арт-терапевтичну практику з ліплення з пластиліну символу \"чоловічої частини\" (аніми/анімуса) для аналізу балансу чоловічої й жіночої енергії учасниць. Головна ідея — сексуальність і внутрішня гармонія залежать від трьох сфер (фізіологія, психологія, соціальне оточення), і через метафоричну роботу можна виявити та пропрацювати заблоковані частини себе.", "th": ["На сексуальність і загальний стан людини впливають три фактори: фізіологія (здоров'я, гормони, сон, харчування), психологія (установки, табу, засвоєні з дитинства заборони) та соціальне оточення (сім'я, партнери, медіа, порноконтент).", "Жінки, за версією ведучої, підсвідомо бояться \"не здобути\" ознак повноцінної жіночості (місячні, груди, вагітність), тоді як чоловіки бояться \"втратити\" те, що бачать із народження (статевий орган, ерекцію) — звідси різне ставлення до тіла та сексуальності.", "Легалізація власної сексуальності і \"чоловічої частини\" в собі (незалежно від статі та орієнтації) — важливий крок до внутрішньої гармонії; придушення цієї частини може призводити до дисбалансу, надмірної \"чоловічості\" (\"баба з яйцями\") або навпаки — заблокованості.", "Фантазії не дорівнюють бажанню їх реалізувати — це безпечний спосіб уяви, який не потребує засудження чи почуття провини.", "У жінок збудження здебільшого приходить поступово, через прелюдію та емоційну готовність (на відміну від швидшого чоловічого механізму), тому емоційний стан і обставини дня напряму впливають на здатність отримати задоволення.", "Практика передбачає серію рефлексивних запитань до створеного символічного об'єкта (який він, як я до нього ставлюсь, чого йому бракує, що я можу для нього зробити) — це допомагає виявити приховані установки, страхи чи неприйняття власної сили та впевненості.", "Порнографія називається \"фантастичним жанром\", далеким від реальності, і її вплив на сприйняття власного тіла та сексуальності варто усвідомлювати й критично переосмислювати."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Біохакінг підсвідомості та вплив через принти HELISSEN. Селена Хеліссен", "d": "2025-05-28", "u": "https://youtu.be/kqupdePIwUk", "s": "Це запис презентації бренду одягу \"Селена Хелісен\", де засновниця Селена та її колега Тетяна розповідають про метод створення \"принтів\" (візерунків на тканині), які нібито впливають на підсвідомість людини через кольори, фрактали та пропорції. Учасниці демонструють різні вироби (хустки, халати, сукні) з принтами під конкретні запити — гроші, кохання, захист, здоров'я — та пояснюють методику підбору й тестування.", "th": ["Метод \"Селена Хелісен\" заснований на поєднанні понад 17 наук (історія, археологія, психофізіологія, семіотика тощо), а створення одного принту містить від сотень тисяч до мільйонів математичних співвідношень кольору, форми та пропорцій.", "За словами ведучої, 95% рішень людина приймає на рівні підсвідомості, і принти впливають саме на цей рівень через колір, фрактальні візерунки та символи, оминаючи свідомий раціональний контроль.", "Кожен принт розроблений під конкретний запит (гроші, кохання, здоров'я, захист від негативу, повернення додому, стосунки з чоловіком тощо), і в асортименті компанії налічується близько 40 тисяч унікальних принтів.", "Спосіб обрання принту: клієнтка дивиться на різні варіанти й визначає, який подобається, який ні, а який нейтральний — при цьому принти, які \"не подобаються\", нібито вказують на внутрішні блоки чи проблеми, які варто пропрацювати, а ті, що подобаються, — дають додаткову підтримку.", "Проводиться повне тестування (2-4 години), під час якого клієнтка приміряє різні принти без дзеркала, орієнтуючись на тілесні відчуття, а результати нібито дозволяють визначити стан здоров'я, емоційні блоки та життєві сфери, що потребують уваги.", "Принти можна комбінувати (носити кілька одночасно — під одягом, на тілі, в аксесуарах), а розмір виробу впливає на швидкість і спосіб \"дії\" — великі вироби (сукні, халати) створюють ефект \"коконa\", маленькі (хустки) легше зняти й \"відпустити\" ситуацію.", "Наведено приклади підтверджених випадків дії принтів — захист від ракетних ударів, покращення стосунків через \"принт пам'яті\", використання клієнтами-чоловіками, зокрема бізнесменами, для вирішення ділових питань."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Мастермайнд з Ольгою Ковальчук. ТРАВЕНЬ", "d": "2025-05-27", "u": "https://youtu.be/6Ug_jWlURx8", "s": "Це запис групового Майстермайнду, де ведуча обговорює з учасницями теми фінансового планування, енергетичної ємкості та внутрішнього дозволу собі мати гроші й досягати цілей. Головна ідея — потрібно чітко знати, чого хочеш, звільнити енергію від дрібних непомічених стресів, ставити амбітні цілі без прив'язки до конкретних очікувань, і дозволити собі отримувати гроші так само легко, як і витрачати.", "th": ["На початку кожного нового місяця корисно від руки (не в телефоні) прописувати витрати багатошарово: обов'язкові базові, другорядні, навчання, інвестиції та бажані \"зайві\" покупки — це формує чіткий фінансовий план.", "Багато енергії втрачається на непомічені дрібні стреси (наприклад, тривога через паркування машини), і усвідомлення та \"відпускання\" цих стресів звільняє значний ресурс для досягнення важливих цілей.", "Планування на далеку перспективу створює обмежуючі очікування — краще ставити ціль раз на місяць (яку суму хочеш отримати), а потім фокусуватися лише на діях, не думаючи постійно про кінцевий результат.", "Варто ста
