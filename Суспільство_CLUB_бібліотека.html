<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Бібліотека — Суспільство.CLUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16130F;
  --green:#294A3A;
  --green-deep:#1D3529;
  --taupe:#BFA599;
  --beige:#DFD6CF;
  --paper:#E9E3DD;
  --surface:#F6F3F0;
  --line:rgba(41,74,58,.16);
  --line-soft:rgba(41,74,58,.09);
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:"Onest","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-weight:300;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
#gate :focus-visible{outline-color:var(--taupe)}
.gate-field input:focus-visible{outline:none}

/* ─────────── GATE ─────────── */
#gate{
  position:fixed;inset:0;z-index:100;
  background:var(--green-deep);
  color:var(--beige);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
#gate.hidden{display:none}
.gate-inner{width:100%;max-width:390px;text-align:center}
.seal{width:124px;height:124px;margin:0 auto 30px;display:block}
.seal .ring{animation:spin 34s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.gate-eyebrow{
  font-size:10px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--taupe);margin-bottom:18px;font-weight:400;
}
.gate-title{
  font-family:var(--serif);font-style:italic;font-weight:300;
  font-size:clamp(38px,10vw,52px);line-height:1;letter-spacing:-.01em;
  margin-bottom:14px;
}
.gate-note{font-size:14px;color:rgba(223,214,207,.62);margin-bottom:32px;line-height:1.6}
.gate-field{display:flex;border-bottom:1px solid rgba(191,165,153,.4);transition:border-color .25s}
.gate-field:focus-within{border-color:var(--taupe)}
.gate-field input{
  flex:1;background:none;border:none;color:var(--beige);
  padding:12px 2px;font-size:16px;letter-spacing:.06em;
}
.gate-field input::placeholder{color:rgba(223,214,207,.32);letter-spacing:.02em}
.gate-field button{padding:12px 4px 12px 16px;color:var(--taupe);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.gate-field button:hover{color:var(--beige)}
.gate-err{
  min-height:20px;margin-top:14px;font-size:13px;color:#D89A8C;
  opacity:0;transition:opacity .2s;
}
.gate-err.show{opacity:1}

/* ─────────── HEADER ─────────── */
header{
  position:sticky;top:0;z-index:40;
  background:var(--green);color:var(--beige);
  border-bottom:1px solid rgba(0,0,0,.2);
}
.bar{
  max-width:1120px;margin:0 auto;padding:16px 24px;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.wordmark{
  font-size:11px;letter-spacing:.26em;text-transform:uppercase;
  font-weight:400;white-space:nowrap;
}
.wordmark span{font-family:var(--serif);font-style:italic;font-size:19px;letter-spacing:.02em;text-transform:none;margin-left:9px;vertical-align:-1px}
.tier{
  margin-left:auto;display:flex;align-items:center;gap:10px;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;
}
.tier-dot{width:6px;height:6px;border-radius:50%;background:var(--taupe)}
.tier.is-power .tier-dot{background:#E4C89B;box-shadow:0 0 0 3px rgba(228,200,155,.2)}
.tier button{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(223,214,207,.5);padding-left:10px;border-left:1px solid rgba(223,214,207,.2)}
.tier button:hover{color:var(--beige)}

/* ─────────── CONTROLS ─────────── */
.controls{background:var(--surface);border-bottom:1px solid var(--line)}
.controls-inner{max-width:1120px;margin:0 auto;padding:20px 24px 16px}
.search{
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:18px;
}
.search svg{flex:none;opacity:.42}
.search input{flex:1;background:none;border:none;font-size:17px;color:var(--ink);padding:2px 0}
.search input::placeholder{color:rgba(22,19,15,.34)}
.hello{
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:30px;line-height:1;color:var(--green);
  margin:4px 0 20px;
}
.tabs{
  display:flex;gap:4px;overflow-x:auto;
  border-bottom:1px solid var(--line);
  margin:0 0 18px;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  position:relative;flex:none;padding:11px 16px 13px;
  font-size:14px;color:rgba(22,19,15,.5);white-space:nowrap;
  transition:color .18s;
}
.tab:hover{color:var(--green)}
.tab.on{color:var(--green);font-weight:500}
.tab.on::after{
  content:"";position:absolute;left:16px;right:16px;bottom:-1px;
  height:2px;background:var(--green);
}
.tab b{font-weight:inherit;font-size:11px;opacity:.5;margin-left:7px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chips-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(22,19,15,.34);margin-right:4px}
.chip{
  font-size:12px;padding:6px 13px;border:1px solid var(--line);
  border-radius:100px;color:rgba(22,19,15,.62);
  transition:all .18s;white-space:nowrap;
}
.chip:hover{border-color:var(--green);color:var(--green)}
.chip.on{background:var(--green);border-color:var(--green);color:var(--beige)}
.chip.sep{border:none;pointer-events:none;padding:6px 2px;color:rgba(22,19,15,.2)}
.count{
  max-width:1120px;margin:0 auto;padding:14px 24px 0;
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(22,19,15,.42);
}

/* ─────────── LEDGER ─────────── */
main{max-width:1120px;margin:0 auto;padding:8px 24px 100px}
.yr{
  display:flex;align-items:baseline;gap:16px;
  padding:34px 0 10px;
}
.yr b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:34px;color:var(--green)}
.yr i{flex:1;height:1px;background:var(--line);font-style:normal}
.yr em{font-style:normal;font-size:11px;letter-spacing:.16em;color:rgba(22,19,15,.38)}

.row{border-bottom:1px solid var(--line-soft)}
.row-head{
  width:100%;display:flex;align-items:flex-start;gap:20px;
  padding:17px 4px;text-align:left;transition:background .18s;
}
.row-head:hover{background:rgba(255,255,255,.5)}
.date{
  flex:none;width:52px;padding-top:2px;
  font-size:11px;letter-spacing:.08em;color:rgba(22,19,15,.44);
  font-variant-numeric:tabular-nums;line-height:1.35;
}
.date b{display:block;font-weight:500;font-size:15px;color:var(--ink);letter-spacing:0}
.meat{flex:1;min-width:0}
.title{font-size:16px;font-weight:400;line-height:1.4;margin-bottom:6px}
.tags{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tag{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(22,19,15,.4)}
.pw{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:#8A6A3E;
}
.pw svg{opacity:.8}
.caret{flex:none;padding-top:5px;opacity:.3;transition:transform .25s,opacity .2s}
.row-head:hover .caret{opacity:.6}
.row.open .caret{transform:rotate(180deg);opacity:.7}

/* locked */
.row.locked .row-head{cursor:default}
.row.locked .title{color:rgba(22,19,15,.42)}
.row.locked .date{color:rgba(22,19,15,.25)}
.row.locked .date b{color:rgba(22,19,15,.35)}
.row.locked .row-head:hover{background:transparent}
.lockmark{flex:none;padding-top:3px}

/* body */
.body{display:none;padding:2px 4px 30px 72px}
.row.open .body{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.body .sum{
  font-family:var(--serif);font-size:19px;line-height:1.52;
  color:rgba(22,19,15,.86);margin-bottom:22px;max-width:66ch;
}
.body h4{
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(22,19,15,.4);font-weight:500;margin-bottom:12px;
}
.body ul{list-style:none;max-width:70ch}
.body li{
  position:relative;padding-left:20px;margin-bottom:11px;
  font-size:14.5px;line-height:1.62;color:rgba(22,19,15,.78);
}
.body li::before{
  content:"";position:absolute;left:2px;top:10px;
  width:5px;height:1px;background:var(--taupe);
}
.watch{
  display:inline-flex;align-items:center;gap:9px;margin-top:24px;
  background:var(--green);color:var(--beige);
  padding:11px 22px;border-radius:100px;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  text-decoration:none;transition:background .2s;
}
.watch:hover{background:var(--green-deep)}
.extra{
  display:inline-flex;align-items:center;gap:8px;margin:24px 0 0 12px;
  color:var(--green);font-size:12px;letter-spacing:.1em;
  text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px;
}

.empty{padding:80px 4px;text-align:center;color:rgba(22,19,15,.4)}
.empty p{font-family:var(--serif);font-style:italic;font-size:24px;margin-bottom:8px;color:rgba(22,19,15,.55)}

/* power teaser strip */
.teaser{
  background:linear-gradient(180deg,rgba(41,74,58,.05),rgba(41,74,58,.02));
  border:1px solid var(--line);border-radius:3px;
  padding:26px 28px;margin:40px 0 8px;
  display:flex;gap:24px;align-items:center;flex-wrap:wrap;
}
.teaser-txt{flex:1;min-width:240px}
.teaser p:first-child{
  font-family:var(--serif);font-style:italic;font-size:23px;
  color:var(--green);margin-bottom:6px;
}
.teaser p:last-child{font-size:14px;color:rgba(22,19,15,.6);line-height:1.55}
.teaser .n{font-family:var(--serif);font-size:52px;color:var(--taupe);line-height:1}

footer{
  border-top:1px solid var(--line);
  padding:28px 24px;text-align:center;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(22,19,15,.32);
}

@media(max-width:640px){
  .bar{padding:14px 18px;gap:12px}
  .wordmark{font-size:10px;letter-spacing:.2em}
  .wordmark span{font-size:17px}
  .tier{font-size:9px;letter-spacing:.14em}
  .controls-inner{padding:16px 18px 14px}
  .count{padding:12px 18px 0}
  main{padding:4px 18px 80px}
  .row-head{gap:13px;padding:15px 2px}
  .date{width:42px;font-size:10px}
  .date b{font-size:14px}
  .title{font-size:15px}
  .body{padding-left:0;padding-bottom:26px}
  .body .sum{font-size:17px}
  .yr b{font-size:28px}
  .bar{flex-wrap:nowrap}
  .hello{font-size:25px;margin:2px 0 16px}
  .tabs{margin:0 -18px 16px;padding:0 18px;-webkit-overflow-scrolling:touch}
  .tab{padding:10px 13px 12px;font-size:13.5px}
  .tab.on::after{left:13px;right:13px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{font-size:12px;padding:6px 12px;flex:none}
  .search input{font-size:16px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<!-- ══════════ GATE ══════════ -->
<div id="gate">
  <div class="gate-inner">
    <svg class="seal" viewBox="0 0 100 100" aria-hidden="true">
      <g class="ring">
        <path id="arc" d="M50,50 m-37,0 a37,37 0 1,1 74,0 a37,37 0 1,1 -74,0" fill="none"/>
        <text fill="#BFA599" font-size="6.6" letter-spacing="2.2" font-family="Onest,sans-serif">
          <textPath href="#arc" startOffset="0">СУСПІЛЬСТВО.CLUB · БІБЛІОТЕКА · </textPath>
        </text>
      </g>
      <circle cx="50" cy="50" r="26" fill="none" stroke="rgba(191,165,153,.35)" stroke-width=".7"/>
      <text x="50" y="57" text-anchor="middle" fill="#DFD6CF" font-size="21"
            font-family="Cormorant Garamond,serif" font-style="italic">С</text>
    </svg>
    <p class="gate-eyebrow">Закритий доступ</p>
    <h1 class="gate-title">Бібліотека</h1>
    <p class="gate-note">Усі записи зустрічей, лекцій та практик клубу.<br>Введіть код доступу зі свого тарифу.</p>
    <div class="gate-field">
      <input id="code" type="password" placeholder="код доступу" autocomplete="off"
             autocapitalize="off" spellcheck="false" aria-label="Код доступу">
      <button id="enter">Увійти</button>
    </div>
    <p class="gate-err" id="err">Такого коду немає. Перевірте розкладку.</p>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app" hidden>
  <header>
    <div class="bar">
      <div class="wordmark">Суспільство.CLUB <span>Бібліотека</span></div>
      <div class="tier" id="tier">
        <i class="tier-dot"></i><span id="tierName">Light</span>
        <button id="out">Вийти</button>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="controls-inner">
      <p class="hello" id="hello" hidden></p>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/>
        </svg>
        <input id="q" type="search" placeholder="Пошук за темою, спікером, ключовим словом…" aria-label="Пошук">
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <p class="count" id="count"></p>
  <main id="list"></main>
  <footer>Суспільство.CLUB · рік у полі Ольги Ковальчук</footer>
</div>

<script>
/* ═══════════════════════════════════════════════════
   НАЛАШТУВАННЯ — те, що можна міняти
   ═══════════════════════════════════════════════════ */

// Запасні загальні коди — для твоєї перевірки.
// Щоб вимкнути, зроби значення порожніми: light:"" , power:""
const CODES = { light: "svitlo2026", power: "power2026" };

// ─────────── СПИСОК УЧАСНИЦЬ ─ ПОЧАТОК ───────────
// Не редагуй вручну. Згенеруй в адмінці й встав сюди замість цього блоку.
const USERS = [];
// ─────────── СПИСОК УЧАСНИЦЬ ─ КІНЕЦЬ ───────────

// Мастермайнди й розстановки — це рівень Power за форматом клубу,
// тому вкладки "Розстановки" і "Мастермайнди" закриті для Light цілком.
// Якщо колись знадобиться відкрити їх для Light — постав false.
const ALL_MM_AND_ROZSTANOVKY_ARE_POWER = true;

const DATA = [{"t": "ОСуспільство.CLUB розстановки з Олею на POWER 25/06", "d": "2026-06-26", "u": "https://youtu.be/kXPTAx_Fwxc", "s": "Це запис групових розстановок жіночого клубу з декількома учасницями, де розбирають запити про блокування грошей, зайву вагу та сепарацію від дітей. Головна ідея — справжні блоки часто ховаються за поверхневими симптомами (страх продавати консультації, зайва вага, нездатність відпустити дітей), і їх можна розкрити через розстановку фігур та чесність із собою щодо справжніх потреб (влада, свобода, любов до себе).", "th": ["У розстановці Каті виявилось, що її переконання \"брати гроші можна лише за гарантований результат клієнта\" насправді приховує страх \"облажатися перед мамою\" та бажання влади і контролю над результатом, а не турботу про клієнтів.", "Ведуча дала Каті завдання — щодня ходити пішки 20 хвилин і робити глибокі присідання для вивільнення енергії Марса, а також пройти курс по роботі з батьківськими програмами \"мама-папа\".", "У запиті Яни про штрафи, які \"забирають\" гроші від консультацій, з'ясувалось, що вона не знає, навіщо їй потрібні гроші і одразу віддає зароблене іншим (монтажеру), замість того щоб спочатку інвестувати в себе та прописати фінансовий план з чіткими статтями витрат.", "У розстановці Альони лишній вагу пов'язали зі страхом успіху, відсутністю зв'язку з власним тілом і пригніченою агресією/злістю, яку вона роками не дозволяла собі проявляти, бажаючи бути \"хорошою дівчинкою\".", "Через практику крику \"Я хочу тебе побачити\" та фізичного вивільнення (тупання, биття по столу) Альона змогла частково розблокувати придушену злість і відчути полегшення в тілі.", "Озвучено принцип: \"гроші приходять на радість\" — у розстановці фінансового запиту Ані з'ясувалось, що гроші асоціюються з радістю та свободою, а справжня реалізація приходить через задоволення від процесу, а не через тривожне \"виправдання\" мрії (наприклад, ферми альпак).", "У завершальній розстановці Марини з'ясувалось, що вона не сепарувалася від своїх дітей (і сама не сепарована від батьків) — через проговорювання слів відпускання та визнання, що діти \"впораються\", відчулось полегшення і збільшення енергетичної дистанції між фігурами.", "Підкреслено загальний принцип роботи клубу: важливо розпечатувати пригнічену агресію, бо вона є енергією, яка показує, \"що мені не підходить\", і допомагає зрозуміти справжні бажання, навіть якщо спочатку легше визначити, чого людина точно не хоче."], "p": true, "c": "Розстановки", "extra": ""}, {"t": "ОСуспільство.CLUB Юлія Норець Ріст блогу в Інстаграм: розбір сторінок", "d": "2026-06-26", "u": "https://youtu.be/srox28Hp6t0", "s": "Це запис ефіру з блогеркою Юлією, яка розбирає сторінки в Інстаграм учасниць жіночого клубу та дає практичні рекомендації щодо ведення блогу й побудови особистого бренду. Головна ідея — успіх у соцмережах досягається тестуванням контенту методом спроб і помилок, а не теоретичним плануванням, і важливо розкривати себе як особистість, а не лише експертну тему.", "th": ["Свою унікальну впізнавану рубрику чи формат неможливо просто вигадати за столом — її знаходять лише методом тестування десятків різних відео та аналізу того, що реально \"залітає\" по переглядах.", "Відео потрібно починати з найцікавішого моменту історії (тригерний хук на початку), а не розповідати довгу передісторію, інакше глядач \"засне\" або перемкне, не дочекавшись цікавої частини.", "Сторінки з домінуванням вузької експертної теми (наприклад, лише про таргет) менш ефективні для набору аудиторії, ніж сторінки, де експертність поєднується з особистими історіями, оскільки люди підписуються на людину, а не на тему.", "Рекомендовано перевдягатися і записувати відео в різні дні, а не знімати кілька роликів одним махом в однаковому одязі, бо аудиторія це підсвідомо відчуває як неживий, \"напиляний\" контент.", "Шапка профілю не повинна містити застарілі чи занадто прямі символи (наприклад, значок грошей для фінансової ніші) — вони \"удешевлюють\" сторінку й відштовхують потенційну аудиторію.", "Для просування на іноземний ринок потрібно вести контент саме іноземною мовою; змішування мов на одній сторінці працює погано і ускладнює залучення бренд-партнерств.", "Опубліковані пости не варто видаляти навіть якщо вони \"не зайшли\" — це частина накопиченого контенту для аналізу та тестування, і деякі публікації можуть \"розкритися\" з затримкою (через 5-10 днів).", "Оптимальна частота постингу — приблизно 3 рази на тиждень (записані за один день у різних образах), хоча на старті ведучої власного блогу вона публікувала контент майже щодня протягом кількох місяців."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Юлія Грибінник Обрати себе: психологія автентичного стилю", "d": "2026-06-23", "u": "https://youtu.be/uSm7_cBSyTo", "s": "Це запис лекції стилістки та логотерапевтки Юлії Грибінник про психологію автентичного стилю, побудований на інтерактивній роботі з метафоричними картками. Головна ідея: одяг завжди говорить про нас, а справжній стиль — це не сліпе слідування трендам чи конформізм, а усвідомлений вибір, що відображає внутрішні цінності людини та допомагає визначити, хто вона зараз і якою хоче стати.", "th": ["Одяг інтегрує три виміри буття — соматичний (тіло), психічний (емоції) та ноетичний (духовний, ціннісний), і саме в останньому вимірі лежить справжня автентичність людини.", "Автентичність і конформізм — полярні поняття: автентичність завжди про вираження власного \"я\" та своїх цінностей, тоді як конформізм — про наслідування трендів заради схвалення групи без власного вибору.", "Одна і та ж річ (наприклад, куртка з окулярами в капюшоні бренду C.P. Company) може нести абсолютно різний зміст для різних людей — дизайнера, який її створив, фанатів, що привласнили її як символ приналежності, чи звичайного покупця.", "Принцип \"fake it till you make it\" щодо одягу — це не про маніпуляцію чи брехню, а про терапевтичний вплив: якщо людині внутрішньо резонує певний образ (сміливість, яскравість), вона може поступово, невеликими елементами (аксесуар, білизна певного кольору) інтегрувати це в свій гардероб, а не одразу купувати кардинально нову річ.", "Розрослий гардероб і шопоголізм часто пов'язані з неусвідомленим пошуком швидкого \"дофаміну\", а не з реальною потребою в речах; корисна практика — попрощатися подумки з непотрібними речами та подякувати їм замість накопичення відчуття марно витраченого ресурсу.", "Для усвідомленого вибору одягу варто задавати собі п'ять питань: що саме приваблює в цій речі, яку емоцію хочу відчути, чи купила б я це, якби ніхто мене не бачив, чи допомагає ця річ виразити або приховати частину себе, і що ця покупка говорить про мене сьогодні.", "Штучний інтелект може бути корисним помічником у підборі стилю (кольоротипи, окуляри), але має обмеження — не завжди враховує контекст, підтон шкіри чи індивідуальні пропорції тіла, тому його поради варто перевіряти практично, а не сприймати як директивні."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "ОСуспільство CLUB розстановки з Олею на POWER", "d": "2026-06-23", "u": "https://youtu.be/LaGwkRZ8W40", "s": "Це запис групової сесії \"розстановок\" клубу для тарифу Power, де ведуча Ольга допомагає учасницям пропрацювати запити про стосунки, сексуальність та зайву вагу через рольове моделювання ситуацій. Головна ідея: щоб отримати бажані стосунки чи стан, потрібно перестати \"доводити свою цінність\" емоційно недоступним чоловікам і натомість розкачати власну жіночу енергію та внутрішню самоцінність, яка притягує людей і можливості.", "th": ["Немає \"емоційно холодних\" людей — є люди, яким ти не цікава; якщо чоловіка щиро цікавить жінка, він знайде час, гроші та можливості для неї, тому варто одразу відходити від тих, хто цього не робить, замість намагатися \"заслужити\" увагу.", "Прагнення \"довести свою цінність\" емоційно недоступній людині часто є проявленою дитячою травмою (стосунки з батьком) і працює як внутрішній тригер, який варто розпізнавати як сигнал негайно відступити, а не заглиблюватися в стосунки.", "Порівняння \"квіточки\" і \"алое\": квіточка існує просто для краси і не мусить постійно доводити свою корисність, тоді як прагнення бути \"корисною\" (алое) часто маскує невпевненість у власній цінності.", "Жіноча сексуальна та життєва енергія потребує постійного \"підживлення\" увагою з різних джерел (не лише від партнера) — фліртувати, приймати компліменти, ходити туди, де є люди, важливо навіть без наміру діяти далі, просто для розкачування внутрішнього стану.", "Набір ваги чи проблеми зі шкірою можуть бути захисним механізмом тіла, який відволікає психіку та \"займає\" зайву енергію, поки людина не готова заповнити своє життя реалізацією чи стосунками; тілу варто \"дати спокій\" і зосередитися на первинній причині.", "Техніка \"розсоздаю, знищую\" — усвідомлене промовляння фрази для видалення обмежуючого переконання, після чого варто запитувати простір/всесвіт \"покажи мені, як може бути по-іншому\", щоб отримати новий досвід, який перезаписує стару програму мислення.", "Приклад із життя інших людей (успішні пари, спортсмени на кшталт Ямаля) допомагає переконструювати переконання \"мені це недоступно\" на \"якщо їм це доступно — значить, це можливо і мені\", що є ключовим кроком для зміни свого мислення й реальності."], "p": true, "c": "Розстановки", "extra": ""}, {"t": "Міні-розклад на Таро Тота для розуміння внутрішнього ставлення до власного бажання з Катею", "d": "2026-06-21", "u": "https://youtu.be/82pyerUOW3Y", "s": "", "th": [], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "ОСуспільство.CLUB зустріч з Олею Ковальчук 16/06", "d": "2026-06-17", "u": "https://youtu.be/I_2EFptk9Eo", "s": "Це запис лекції-зустрічі жіночого клубу про \"легкість з грошима\" — ведуча пояснює, що тривожність щодо грошей походить від внутрішньої боротьби з собою, а не від зовнішніх обставин, і дає практичні інструменти для зняття цієї напруги. Після знайомства новеньких учасниць йде розгорнута лекція про природу грошей, контроль та головні причини, чому гроші не приходять легко.", "th": ["Легкість з грошима — це не про те, що вони легко приходять, а про відсутність внутрішньої боротьби (претензій до себе); коли людина задовольняє свій ресурс і робить тільки те, що їй посильно, тривожність зникає.", "Запропонована техніка \"розблокування тіла\": фізично стряхнути напругу з плечей рухом \"раз-два-три\" кілька разів, після чого проговорити фразу \"я відкриваю вікно можливостей для грошей\" без прив'язки до конкретного джерела (бо прив'язка до одного джерела обмежує можливості).", "Контроль варто переключати із зовнішнього (курс долара, ціни, інфляція — на що людина не може вплинути) на внутрішній — контроль власного стану, ресурсу та реакцій на ситуації.", "Названо три головні причини, чому гроші не приходять легко: 1) людина постійно намагається довести свою цінність, 2) страх втратити те, чого ще немає, 3) оточення людей з дефіцитним мисленням, які постійно нарікають на нестачу грошей.", "Кожна точка зору про гроші — це \"куплене\" переконання з дитинства чи оточення, а не об'єктивна правда; варто усвідомлювати, що ці переконання можна переглядати і змінювати.", "Гроші завжди приходять під справжнє, \"намолене\" бажання чи рішення — наведено особисті приклади (купівля дорогої машини, інвестиція в наставництво), коли гроші з'являлися несподівано після прийняття твердого внутрішнього рішення, навіть без видимого фінансового ресурсу на момент рішення.", "Щоб навчити дітей фінансової грамотності, важливо дозволяти їм самостійно витрачати свої гроші та робити власні помилки, а не контролювати чи забирати їхні кошти — це їхня \"зона відповідальності\", а не батьківська."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "ОСуспільство.CLUB зустріч з Олею Ковальчук 15/07", "d": "2026-06-16", "u": "https://youtu.be/yofTZq0ZL7Q", "s": "Це запис лекції на тему «легкості з грошима», де ведуча пояснює, що жіноча легкість формується не бездіяльністю, а через відчуття задоволення в повсякденних діях, звернення до п'яти органів чуття та роботу з енергією. Учасниці разом з ведучою також виконують практику для «притягування» бажань і обговорюють свої інсайти щодо грошей, стосунків з батьками та побутових звичок.", "th": ["Жіноча легкість — це не про бездіяльність, а про виконання справ у задоволенні, без примусу та надмірного навантаження на себе.", "Перший крок до легкості — навести порядок у своєму фізичному просторі (прибирання, розхламлення), оскільки хаос і роздратування навколо непомітно забирають велику кількість енергії.", "Правило «якщо лінь — значить хрінь»: якщо на якусь справу постійно бракує бажання її робити, це сигнал, що на неї немає ресурсу, і її варто делегувати або взагалі відмовитися від неї.", "Важливо усвідомлено звертати увагу на свої п'ять відчуттів (смак, запах, слух, дотик, зір) у щоденному житті — це формує на підсвідомому рівні відчуття задоволення від життя і притягує позитивні зміни.", "Правило «рахунку одного дня»: розглядати, що можна зробити вже сьогодні в межах наявних ресурсів (грошей, часу, сил), а не відкладати рішення проблеми на невизначене «коли з'являться гроші/час».", "Для подолання того, що дратує в житті, є «правило трьох»: прибрати подразник, замінити його на краще або просто попросити про допомогу — люди часто не використовують доступні їм ресурси та можливості.", "Для розвитку масштабніших бажань корисно шукати нові враження та досвід (нові смаки, місця, відчуття) — рекомендація «п'ять нових речей на місяць»; це розширює нейронні зв'язки і є профілактикою вікових когнітивних порушень.", "Практика «зачерпування» бажання тазом і закріплення руками на животі описана як інструмент енергетичної фіксації бажання; учасниці ділилися відчуттями тепла, спокою та підтвердженнями того, що попередні практики (наприклад, з грошима від колишнього чоловіка) спрацювали."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "ОСуспільство.CLUB майстермайнд з Олею на POWER 12/06", "d": "2026-06-14", "u": "https://youtu.be/h1WRXABaaD8", "s": "Це запис групової зустрічі/мастермайнду в жіночому клубі, де учасниці діляться особистими історіями та підтримують одна одну. Розмова охоплює різні теми: від ставлення до кредитів як інвестицій, особистих курйозних історій, до глибших тем про самореалізацію, навчання та особистий бренд. Учасниці обмінюються досвідом проходження навчальних курсів і обговорюють внутрішній опір, який заважає реалізовувати плани.", "th": ["Настя поділилась запитом про колишнього чоловіка, який не сплачує офіційні аліменти (отримує зарплату в конверті), і отримала пораду енергетично \"повернути собі свою енергію\" — уявити розрив зв'язку та сказати \"забери все своє, віддай мені моє\", замість того щоб витрачати енергію на злість та очікування.", "Наведено приклад історії Оксани, чий чоловік зрадив її, але після того як вона енергетично \"відпустила\" ситуацію та згодом побажала йому щастя, він сам почав надсилати їй гроші та переписав майно.", "Яна поділилась важким запитом про стосунки з мамою (яка має біполярний розлад) та братом, які тиснуть на неї почуттям вини; Настя розповіла власну історію, як свого часу \"обрала себе\", залишивши маму, яка потім потрапила в психіатричну лікарню, і досі вважається \"поганою донькою\".", "Запропонована практика \"1-2-3\" — фізичне розслаблення тіла (потрусити руками, стрибнути) для зняття напруги, після чого проговорюється фраза \"я відкриваю вікно можливостей\" для залучення бажаних результатів (грошей, клієнтів тощо).", "Згадано \"клірінг\" (фразу-формулу з Access Consciousness), який допомагає розчинити дуальність суджень \"правильно/неправильно\" в стресових ситуаціях, і ним можна \"почистити\" не лише ситуації, а й стосунки з конкретними людьми (мамою, братом).", "Ведуча поділилась особистою історією про відрядження в Індію та проблеми з координацією рейсів чоловіка, яка завершилась висновком: важливо \"здатися\" — зробити все, що можеш, а далі відпустити контроль і довіритися процесу.", "Учасниці домовилися про спільну подорож (Чехія, Португалія або Лісабон) на початок жовтня та плани щодо запрошення спікерки Юлії для розбору сторінок учасниць і ведення блогінг-курсу."], "p": true, "c": "Мастермайнди", "extra": ""}, {"t": "ОСуспільство.CLUB зустріч з Анною Медведєвою \"Проявлення — ключ до керування бажаннями\"", "d": "2026-06-14", "u": "https://youtu.be/Zb9PrqSUdyQ", "s": "Це запис вебінару психотерапевта Ані Мєдвєдєвої про тему \"проявленості\" для учасниць жіночого клубу. Аня пояснює, що прояв — це основа керування нашими бажаннями, і проводить практичну вправу із розстановками за допомогою паперових фігурок, щоб дослідити зв'язок між \"Я\", бажаннями, духом, світом і місією.", "th": ["Існує два типи проявлення: \"стрибнути зі скелі\" (різкий, спонтанний прояв) і системне проявлення, як політ на літаку без турбулентності.", "Прояв — це основа керування нашими бажаннями: щоб щось отримати, треба стати тією версією себе, яка може це отримати і втримати.", "Між людиною і світом існує зона напруги — світ має \"вакантні місця\" під навички й потенціал кожної людини, але щось блокує передачу цього потенціалу у світ.", "Тертя зі світом при проявленні трансформує людину, як алмаз, який обточують з усіх сторін, перетворюючи камінь на дорогоцінність.", "Дух — це чиста енергія, найвища концентрація якої через людину і є справжньою проявленістю; дух передає ідеї та інтуїцію, але не може сам діяти за людину.", "Життя, побудоване лише на закритті дефіцитів (\"морква ззаду\") або на досягненні бажань (\"морква спереду\"), без зв'язку з духом призводить до кризи — відчуття \"все є, але що далі?\", яка часто настає у 30-50 років. Щоб уникнути цієї кризи, потрібно поєднувати власні бажання з духом (чимось більшим за сенсом), а не жити лише заради задоволення бажань чи виживання.", "Місія — це не конкретна професія чи форма діяльності, а унікальна автентична енергія людини, яку можна проводити через будь-яку форму (бізнес, материнство, мистецтво), і ця форма може змінюватися протягом життя.", "У \"зоні тертя\" між людиною і світом є чотири складні фактори, які потрібно навчитися витримувати: хейтери (показник тертя та джерело агресії-енергії), жертви (люди, які тримають баланс стабільності світу, не йдучи в розвиток), подієвий ряд (невпевненість, яка приховує безкінечний простір можливостей) та \"нічого\" (порожнеча, яку треба прийняти, а не боротися з нею).", "Жертви (близькі люди, які не розвиваються і не підтримують зміни) мають власну важливу місію — тримати стабільність світу, поки інші проявляються, і не варто витрачати енергію на спроби їх \"врятувати\" чи \"витягнути\" в розвиток."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "ОСуспільство.CLUB майстермайнд з Олею на POWER", "d": "2026-06-11", "u": "https://youtu.be/qiwKxnO8TQs", "s": "Це запис Мастермайнду, де ведуча відповідає на запити учасниць щодо розширення фінансового мислення, придбання нерухомості, пошуку нових життєвих горизонтів та роботи з енергією і намірами. Головна ідея: розширення життя (грошей, житла, можливостей) починається не з розрахунку «звідки взяти ресурси», а з чіткого прийняття рішення, конкретного бачення бажаного і дій у межах поточних можливостей — решту «дороблює» простір.", "th": ["Розширення не має бути схоже на «розрив» чи різке урізання витрат — воно повинно відбуватися так, щоб не створювати внутрішнього напруження й тривоги, інакше мозок сприймає це як загрозу, а не як зростання.", "Головне — прийняти рішення про бажане (квартира, машина, робота) без знання «як саме це станеться»; мозок і простір самі знаходять шлях, коли є чітка ціль, а не абстрактне бажання.", "Мозок працює як навігатор: якщо не задати конкретну «точку призначення», а тільки загальний напрямок, він приведе в «якесь місце», а не туди, куди насправді потрібно.", "Вибираючи, на чому підвищити рівень життя (спортзал, косметика, продукти), варто орієнтуватися не на ціну, а на власне відчуття задоволення й комфорту від цього вибору, а не на те, «що прийнято» чи «що дешевше».", "Роздратування від побутових дрібниць (незручне житло, невдалий інтер'єр) забирає ресурс і енергію, тому варто або змінювати те, що дратує, або усвідомлено погоджуватися з умовами — а не терпіти мовчки.", "Коли людині бракує енергії й «іскри» для нових цілей, причина часто не у фінансах, а у втраті цікавості чи внутрішньому дозволі собі хотіти більшого (зокрема через родинні установки на кшталт «треба бути скромною/хорошою дівчинкою»).", "За будь-яким бажанням (зміна роботи, нерухомість тощо) стоїть глибша потреба — сенс, свобода, гроші, вплив; варто виявити саме цю приховану потребу, а не орієнтуватися лише на поверхневий запит.", "Неусвідомлене засудження чужого способу заробітку чи стилю життя (наприклад, «легких грошей») підсвідомо блокує власну можливість отримувати ресурси так само легко."], "p": true, "c": "Мастермайнди", "extra": ""}, {"t": "ОСуспільство.CLUB практика розслаблення від Лени Рибіної", "d": "2026-06-04", "u": "https://youtu.be/zAaShLd4PtE", "s": "Це запис групової практики уваги в тіло та енергії ці, яку проводить учасниця Лена для жіночого клубу. Практика спрямована на роботу з другою чакрою (жіночою), фокусується на поступовому розслабленні всього тіла для звільнення енергії, з можливістю використання цього методу для роботи з тривожними ситуаціями.", "th": ["Практика спрямована на роботу з другою чакрою — жіночою, яка пов'язана із задоволенням, і основний фокус — це розслаблення, через яке звільняється і вільніше тече енергія в тілі.", "Побічна дія практики — людина починає відчувати напруження в тілі, яке раніше сприймала як норму і не помічала, а тепер може його відмовити і відпустити.", "Рекомендується робити практику кілька разів (краще зранку або ввечері), оскільки ефект накопичувальний, і найсильніше відчувається приблизно з третього дня; з практикою тіло розслабляється швидше і потребує менше часу (спочатку ~40 хвилин, потім менше).", "Для практики потрібне спокійне місце і положення сидячи з прямою спиною, ногами на підлозі, не схрещеними — оскільки тут більше уваги до тіла і матеріальної енергії, на відміну від практик з верхніми чакрами, де можна сидіти в позі лотоса.", "Практика включає послідовне розслаблення всього тіла — від голови, обличчя, горла, через внутрішні органи (печінка, селезінка, нирки, кишківник), спину, таз, до ніг і стоп, з можливістю відправляти зайву напругу \"в землю\".", "У ділянці низу живота (друга чакра) пропонується уявити червоний енергетичний шар, який зростає при розслабленні та розтікається по всьому тілу, наповнюючи його енергією та любов'ю, а наприкінці практики можна спрямовувати цю енергію в ділянки тіла, де відчувається нестача.", "Практику можна модифікувати — наприклад, додатково \"проводити\" енергетичним шаром по тілу руками, ніби знімаючи тривожні ситуації, що дозволяє працювати з конкретними джерелами стресу."], "p": false, "c": "Зустрічі зі спікерами", "extra": "https://app.notion.com/p/fee15c82d5bf4400b8082bb501e6a702?v=fda6101b080b42dba4c12b39f5c5241a&source=copy_link"}, {"t": "27.05 ОСуспільство.CLUB розстановки з Альоною Кононенко на POWER", "d": "2026-05-28", "u": "https://youtu.be/S-6keGqq8VY", "s": "Це запис групових розстановок жіночого клубу, де Альона веде сесії з кількома учасницями — Маріною, Олею, Ярденою, Лєною — досліджуючи блоки навколо блогу, грошей, сексуальності та інших тем. Головна ідея — справжні перешкоди в проявленні часто ховаються за знеціненням власних досягнень, забороною приймати допомогу та подавленою жіночою/сексуальною енергією, які можна розблокувати через визнання своїх заслуг і дозвіл собі бути \"поганою дівчинкою\".", "th": ["На початку обговорено різницю між \"інфошахрайством\" (продаж порожніх обіцянок) і чесним продуктом — наведено приклад Лери Бородіної, яка співпрацювала з науковцем для продажу \"твердого знання\", та пояснено стратегію набору великої кількості людей на перший потік курсу для отримання кейсів.", "У розстановці Марини виявилось, що її страх вести блог пов'язаний зі знеціненням власних досягнень (шлях від звичайного працівника до фінансової грамотності в крипті) — запропоновано техніку: визнати \"це все результат моєї роботи і моїх заслуг\" та виписати свій шлях досягнень як основу майбутнього блогу.", "У розстановці Альони виявився глибокий блок на прийняття грошей за допомогу іншим — асоціація \"брати гроші = продавати себе\", пов'язана з родовою програмою (історія прадідів, що втратили багатство) та забороненою в дитинстві \"ранньою сексуальністю\".", "Пояснено механізм формування блоку: якщо дитину в 4-7 років (період ранньої сексуальності) засуджували за прояви почуттів/захоплення, формується звичка уникати контакту з тілом і переживати все на рівні душі, а не тіла.", "Альоні запропоновано фізичну практику — потанцювати на самоті, \"відпустити\" подавлену жіночу/сексуальну енергію, дозволити собі \"бути поганою дівчинкою\" замість постійного вирішення проблем.", "У розстановці Лєни з'ясувалось, що звільнена енергія (після завершення активного пошуку роботи) хоче бути спрямована не в стару роботу, а в нову діяльність (інстаграм/творчість) — причому підходити до цього потрібно не як до \"роботи\", а з мотивації показати іншим жінкам, що можна поєднувати ролі (мама, працівниця, творча особистість) без вигорання.", "Підсумкова думка ведучої: трансформація відбувається \"по краплинці\" — навіть якщо зараз немає енергії щось змінити одразу, підсвідомість вже \"побачила\" інформацію і зміни можуть проявитися через тижні чи місяці."], "p": true, "c": "Розстановки", "extra": ""}, {"t": "26.05ОСуспільство.CLUB розстановки з Альоною Кононенко на POWER", "d": "2026-05-28", "u": "https://youtu.be/BBO2V3b0Z5c", "s": "Це запис групової розстановки в жіночому клубі, де Вікторія працює із запитом про проявлення в блозі та особистий бренд, використовуючи учасниць як фігури (гроші, аудиторія, клієнти, перешкоди). Головна ідея — Вікторії потрібно дозволити собі проявлятися заради самого процесу й внутрішнього задоволення, а не ховатися за ціль заробітку грошей.", "th": ["У розстановці Вікторія розподілила ролі: гроші, аудиторія, клієнти, перешкода і сама проявлена версія себе, а учасниці (Яна, Альона, Ярдена, Оля) ставали відповідними фігурами.", "Виявилось, що гроші Вікторії йдуть більше через її експертність та клієнтів, а блог і проявленість потрібні їй для іншого — для впізнаваності та внутрішнього задоволення.", "Клієнти Вікторії приходять переважно \"по сарафанці\" (через рекомендації), і їм не важливо, чи вона проявляється в блозі, чи ні — для них це не визначальний фактор.", "Ключовий інсайт: проявленість потрібна Вікторії не для грошей, а щоб \"потішити свою внутрішню дитину\" — отримати визнання, оплески, відчуття, що вона \"класна\".", "Гроші мають бути не ціллю проявленості, а побічним ефектом (бонусом) від внутрішнього дозволу собі бути яскравою та видимою.", "Наведено приклад блогерки Тані Чотач, яка стала блогером просто тому, що захотіла, без чіткого плану, а потім це переросло у ведення івентів.", "Зроблено висновок, що коли людина дає собі дозвіл \"бути собою\", це автоматично підвищує цінність її роботи і \"чек\" за послуги зростає сам по собі."], "p": true, "c": "Розстановки", "extra": ""}, {"t": "ОСуспільство.CLUB зустріч з Юлією ЕлсаррагАгресія як портал у проявлення", "d": "2026-05-25", "u": "https://youtu.be/KhlG8Zgd9fI", "s": "Це запис зустрічі жіночого клубу з психологинею та менторкою Юлією Елсарраг на тему агресії як ресурсу та проявленості. Юлія використовує метафоричні картки, щоб дослідити з учасницями, що заважає їм проявляти свою агресію — життєву енергію, — і пропонує практичні способи її екологічного вивільнення.", "th": ["Агресія розглядається не як негативна емоція (\"зриваюся на дітей\"), а як ресурсна частина, потенціал, який або проявляється (захист себе, самостверждення), або подавляється і потім \"роздирає людину зсередини\".", "З дитинства жінок навчали стримувати агресію через заборони (\"не можна злитися\", \"не проявляйся\", \"що люди подумають\"), і ця енергія \"запаковувалась у коробочку\", яку тепер потрібно розпаковувати.", "Тілесні сигнали подавленої агресії: стиснута щелепа, зажаті плечі, стиснута грудна клітина, головний біль, нерозслаблені руки, проблеми зі сном.", "Ключове питання для самоаналізу: \"Що я сьогодні зробила для себе?\" — якщо людина робить тільки для чоловіка, дітей, дому, а не для себе, це ознака непроявленої агресії.", "Запропоновано питання для роботи з картками: \"Кому вигідно, щоб я була без сили?\" — це допомагає усвідомити кореневі причини страху проявляти агресію (наприклад, роль \"старшої сестри\", яка завжди мала всім допомагати і не могла проявляти агресію).", "Правильне вивільнення агресії — це усвідомлення емоції через зв'язок із тілом і свідома дія (спортзал, крик у подушку чи стаканчик, розривання паперу на клаптики, ведення щоденника емоцій), а не зливання її на близьких людей.", "Проявлення агресії безпосередньо пов'язане з вмінням заявляти про свої кордони, потреби, не боятися називати ціни на свої послуги та покращує стосунки з чоловіком, дітьми та собою; рекомендується вести щоденник вдячності/емоцій та використовувати ChatGPT для інтерпретації власних снів і пошуку в них ресурсу."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "ОСуспільство.CLUB зустріч з Юлею Скибою", "d": "2026-05-17", "u": "https://youtu.be/D_Wi-kKcQt8", "s": "Це запис лекції Юлії Скібок, експерта з фен-шуй та східної астрології Бацзи, про поточний 20-річний енергетичний період (2024-2044) та його вплив на жінок середнього віку. Головна ідея — ми живемо в \"енергії вогню\", яка робить жінок найпотужнішою соціальною категорією, але водночас несе ризики виснаження, тому важливо знати свій особистий елемент і свідомо балансувати зовнішню активність з внутрішньою опорою.", "th": ["Згідно з китайською метафізикою, поточний 20-річний період (2024-2044) називається триграмою Лі, або \"середня донька/жінка середнього віку\", що означає максимальну концентрацію енергії та впливу саме в цій соціальній категорії незалежно від фактичного віку.", "Енергія вогню — яскрава, потужна, привертає увагу, але швидко вичерпується і погано контролюється; цей період досягає максимального розквіту у 2026 році і поступово стабілізується з 2030 року, а з 2044 року прийде енергія води (стабільність, холодна голова).", "Через домінування зовнішньої (\"янської\") активності при слабкій внутрішній опорі існує ризик лавиноподібного зростання емоційних та психологічних захворювань, тому необхідно свідомо культивувати дисципліну, рутину та внутрішні опори (фінансові, сімейні, здоров'я).", "Кожна людина має свій \"елемент особистості\" за Бацзи (земля, вода, дерево, вогонь або метал), який визначає головний фокус на 2026-2027 роки: земля — експертність і системність, вода — гроші й конкретні вимірювані цілі, дерево — самовираження й публічність, вогонь — люди й партнерства (з обережністю щодо фінансів), метал — управління й вибудовування системи.", "Авторка наголошує: у поточну епоху варто діяти швидко й сміливо, бо помилки швидко забуваються через перевантаження інформацією, тож варто пробувати проявлятися, не чекаючи \"ідеального моменту\".", "Жіноча конкуренція за чоловіків історично була біологічно зумовленою, але зараз жінки менше залежать від чоловіків як ресурсу для життя, тому їхня енергія перенаправляється в підтримку та кооперацію між собою (тренд \"сестринства\").", "Авторка рекомендує не намагатися розвивати всі сфери життя одночасно, а свідомо \"качнути\" саме ту сферу, яка відповідає поточному особистому елементу — це створює рушійну силу, яка згодом дозволяє легше розвивати інші сфери."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "ОСуспільство.CLUB зустріч з Олею Ковальчук", "d": "2026-05-12", "u": "https://youtu.be/M-y-WV0UJp8", "s": "Це запис зустрічі жіночого клубу у форматі \"запити-відповіді\", де ведуча відповідає на питання учасниць про стабільність у кризі, стосунки при різниці в доходах, страх розслаблення та роль дисципліни в житті. Головна ідея — справжня стабільність і легкість приходять не із зовнішніх обставин, а з прийняття рішень та дисципліни, яка є формою свободи й любові до себе.", "th": ["На запит про падіння бізнесу в Еміратах через війну ведуча порадила змінити парадигму мислення: стабільність є лише всередині людини, а будь-яка криза — це \"вікно можливостей\", а не приклеюватися до старого.", "Рекомендується практика створення бачення свого майбутнього (через рік і через п'ять років) незалежно від зовнішніх обставин, за прикладом того, як Майкл Джексон описував свій бажаний образ.", "На запит про різницю в доходах з чоловіком учасниці поділилися досвідом: важливо не порівнювати себе з соціальними стандартами, а знайти свою \"точку безпеки\" — умову (наприклад, чоловік закриває базові потреби), за якої людина відчуває розслаблення.", "Розширення і зростання в стосунках можливе лише через розслаблення, а не через напругу чи спроби підлаштувати партнера під зовнішній стандарт \"ідеального чоловіка\".", "На запит про страх розслаблення ведуча пояснила, що секрет легкого життя — це прийняття рішень: коли людина один раз приймає рішення (а не торгується з собою щодня), зникає внутрішня боротьба і з'являється легкість.", "Дисципліна визначена не як обмеження свободи, а як вища форма свободи та любові до себе — вона дає внутрішню опору, дозволяє керувати собою замість контролю зовнішніх обставин, і веде до здійснення мрій.", "Порада: приймати рішення на короткий термін (мінімум місяць) щодо нових звичок, знаходити дисципліну в тому, що подобається (різноманітність одягу для тренувань, цікаві тренери), і завжди ставити власні потреби (спорт, відпочинок) в розклад наперед, перед іншими справами."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "ОСуспільство.CLUB майстермайнд з Олею на POWER 07/05", "d": "2026-05-07", "u": "https://youtu.be/MgcbtzyATLY", "s": "Це запис майстер-майнду жіночого клубу, де Яна розповідає історію про відмову купити курс у Каті Козлової та отриману за це агресивну реакцію, а інші учасниці (Аня — про звільнення з роботи, Маріна — про труднощі з прийняттям розслабленого життя) діляться своїми запитами про цінність, контроль і дозвіл собі насолоджуватися. Головна ідея — справжня цінність людини не залежить від роботи, грошей чи зовнішнього схвалення, і важливо вчитися слухати себе, а не виправдовуватися перед іншими.", "th": ["Яна відмовилась купувати курс (350 євро) після майстер-воркшопу Каті Козлової, чесно пояснивши собі справжні причини, але почала виправдовуватися перед групою, після чого отримала образливу реакцію (\"ти брехуха\") та звинувачення в небажанні інвестувати в себе.", "Ведуча пояснила, що коли людина виправдовується замість простого \"ні\", вона стає \"винною\" і \"нижчою\", через що на неї можна чинити психологічний тиск — натомість важливо казати \"я не йду, тому що так вирішила\" без пояснень.", "У запиті Ані про звільнення з роботи (через \"негативність\", хоча команда плакала на прощання) ведуча показала, що почуття сорому пов'язане з хибним переконанням, що цінність людини залежить від роботи чи результатів — натомість цінність є вродженою і не залежить від зовнішніх обставин.", "У запиті Марини про труднощі прийняти розслаблений стан життя (після років постійної праці) ведуча пояснила, що це \"соціальний доробок\" і порівняння з іншими, а не справжня дитяча позиція — рекомендовано просто насолоджуватися моментом без почуття провини.", "Пояснено різницю між контролем та відповідальністю: людина контролює лише себе (свою дисципліну, свої дії), а результат (як це розгорнеться у світі) — це вже поза контролем, і спроба контролювати зовнішнє веде до обмежень.", "Наведено приклад: коли ведуча сама \"дозволила\" собі піти в рекламну інтеграцію та бізнес-навчання без конкретної мети заробітку, можливості (пропозиції від бізнес-школи, рекламодавців) почали приходити самі, ілюструючи принцип \"роби з задоволення, а не з потреби\".", "Яна поділилась фінальним інсайтом про відчуття самоцінності — усвідомлення того, що вона не повинна \"виправдовувати\" своє життя в Києві (виховання дітей, підтримка чоловіка), а може цінувати поточний етап без порівняння з кар'єрними досягненнями інших."], "p": true, "c": "Мастермайнди", "extra": ""}, {"t": "ОСуспільство.CLUB зустріч з трихолом Юлією Седлецькою краса вашого волосся", "d": "2026-05-04", "u": "https://youtu.be/MoqwbXdbCMc", "s": "Це повторний запис лекції трихолога та нутриціолога Юлії Сідлецької для жіночого клубу про здоров'я волосся й шкіри голови. Головна ідея — волосся та шкіра є маркерами внутрішнього стану організму, а різні типи випадіння волосся (себорейний дерматит, дифузна та андрогенетична алопеція) тісно пов'язані зі станом кишківника, гормонами та харчуванням.", "th": ["Волосся і шкіра голови — це маркери внутрішнього стану організму: за кольором, густиною та структурою волосся трихолог визначає дефіцити та проблеми всередині тіла; волосся як \"нежиттєво важливий\" орган страждає першим при нестачі ресурсів.", "Себорейний дерматит — хронічне запальне захворювання, пов'язане з активністю сальної залози та розмноженням умовно-патогенного мікробіому (грибів роду Malassezia); дорослій людині потрібно мити голову через день-два (а не рідше), і використовувати шампунь за типом шкіри, а не волосся.", "70-80% імунітету знаходиться в кишківнику, і запалення кишківника (коли ворсинки атрофуються, а непереварена їжа потрапляє в кровообіг) викликає системне запалення, що проявляється на шкірі як себорейний дерматит, акне, екзема, псоріаз чи розацеа.", "Названо кілька типів випадіння волосся: дифузне (рівномірне по всій голові, тригери — пологи, антибіотики, дієти, стрес, дефіцити), андрогенетична алопеція за жіночим типом (центральний проділ у формі \"ялиночки\", пов'язана з чутливістю фолікулів до гормонів, потребує перевірки гінекологом), та хронічне телогенове випадіння.", "Після 23 років густина волосся ніколи не повертається до рівня, який був у віці 8-23 років (пік гормонального росту); з кожним наступним десятиліттям волосся стає тоншим, і це нормальний фізіологічний процес.", "Для відновлення гормонального балансу та здоров'я волосся рекомендується цикл насіння (льняне та гарбузове в першу половину циклу, кунжут і соняшник — у другу), трав'яні настої (кропива, м'ята, розторопша) та антизапальне харчування (прибрати цукор, фастфуд, трансжири, алкоголь; додати омега-3, оливкову олію, антиоксиданти).", "Алкоголь навіть у малих кількостях змушує печінку перемикатися повністю на детоксикацію токсину замість виконання своїх звичайних функцій (зберігання нутрієнтів, активація вітаміну D), що порушує гормональний детокс і впливає на стан волосся та шкіри."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Трансформаційна гра \"Любоі і гроші\" з Юлею Ждановю 30/04", "d": "2026-05-01", "u": "https://youtu.be/oBnVURPUkOI", "s": "Це запис групової трансформаційної гри \"Любов і гроші\" для жіночого клубу, яку проводить Юлія. Учасниці формують запити, що поєднують гроші/реалізацію і стосунки/любов до себе, а карти гри (ресурси, перешкоди, дії, події) допомагають їм побачити приховані установки та запустити нові інсайти у своєму житті.", "th": ["Гра побудована на принципі \"ефекту метелика\" — можна прямо в грі побачити, які події в житті запускає той чи інший вибір чи сценарій, перш ніж робити це в реальності.", "У Марини карта \"дія\" показала, що їй потрібно зробити хоча б одну маленьку дію щодо запуску блогу/курсу, а через серію подальших карт (плоди вчинків, шкільна перемога) виявилось, що вона має \"синдром хорошистки\" — звикла досягати легко, не напружуючись, і їй треба привласнити собі свої таланти й знання, а не знецінювати їх.", "В кількох учасниць (Анна, Алла) випали карти про прийняття соціальної допомоги та довіру — урок про те, що варто дозволяти собі приймати підтримку від інших людей, а не намагатися все робити самостійно.", "У Альони перешкода \"страх повторити невдачу минулого\" (пов'язана з нерухомістю в Україні) трансформувалась у рішення відпустити страх і довіритися новому рішенню щодо купівлі будинку в США.", "Кілька учасниць отримали інсайти про \"калорійність нереалізованих ідей\" і незакритих гештальтів — тобто застій у тілі (зайва вага, напруга) може бути пов'язаний із відкладеними рішеннями та непроявленими намірами.", "У Альони карта про відпочинок з чоловіком (\"кава в ліжко\", морозиво) розкрила приховане почуття провини за те, що вона не заробляє гроші в сім'ї, тоді як чоловік працює — і потребу дозволити собі розслабитися та довіритися.", "Гра завершилась обміном картками, подарунками імунітету та подяками — учасниці відзначили, що поле гри запустило реальні зміни (наприклад, домовленості про спільні ефіри, рекомендації, дзвінки рідним) ще до завершення сесії."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "ОСуспільство.CLUB розстановки з Олею на POWER", "d": "2026-04-21", "u": "https://youtu.be/kV9MF1y7Vi8", "s": "Це запис групової зустрічі з елементами особистого досвіду ведучої та практики розстановок. Спочатку ведуча розповідає історію про те, як інтуїція вберегла її та дітей під час обстрілу в Києві біля її житлового комплексу, а також ділиться роздумами про дитячі психологічні травми, реакції батьків на стрес та важливість емоційної гігієни. Далі йде серія розстановок для учасниць з запитами про гроші, реалізацію та внутрішні блоки (сертифікати, самооцінка, страх системи тощо).", "th": ["Розвиток інтуїції та вміння слухати тіло допомогли ведучій відмовитися від заходу, що врятувало її дітей під час обстрілу — вона наголошує на важливості вправ на інтуїцію.", "Дитяча психологічна травма виникає не стільки від самої події, скільки від нездатності батьків впоратися зі своїми емоціями — якщо батьки в ресурсі, подія не травмує дитину.", "Емоційна гігієна спілкування — важливо вміти перемикати розмову з негативу на позитив і не втягуватися в чужі драматичні історії (\"для конфлікту потрібні двоє\").", "У розстановці на тему \"де мої гроші\" виявилось, що ідея з орендою суконь викликає відчуття тиску й нудоти, натомість з'єднання косметології та ароматерапії в єдину пропозицію дає відчуття полегшення та потенціал для клієнтів і грошей.", "Порушено концепцію трьох частин особистості: дитина (енергія, інтерес), дорослий (відповідальність за результат) і батьківська частина (контроль/критика) — без \"дорослого\" немає результату, навіть якщо є ідея та контроль.", "У іншій розстановці показано, що надмірна прив'язаність до сертифіката/диплома як умови для встановлення вартості послуг є \"радянською установкою\" (\"без бумажки ти букашка\"), яка тисне на клієнтів і гроші.", "Рекомендація вчитися обирати речі в житті \"якби вартість не мала значення\" — внутрішній дозвіл собі на бажане нібито відкриває можливості для його реалізації."], "p": true, "c": "Розстановки", "extra": ""}, {"t": "ОСуспільство.CLUB зустріч з Олею Ковальчук 19.03", "d": "2026-04-18", "u": "https://youtu.be/d8DZ5RLn5zY", "s": "Це запис групової зустрічі про тему можливостей: чому люди їх не бачать, як стрес і обмежене мислення закривають нас від подій, які могли б статися. Ведуча на власних прикладах (машина, будівельний проєкт, зустріч з давнім знайомим) пояснює, як фраза \"як може бути ще краще\" та зв'язок з тілом допомагають розширювати внутрішній дозвіл собі на бажане і бачити нові можливості.", "th": ["Ретикулярна формація мозку — відділ, що починає \"притягувати\" в поле зору те, про що ми думаємо; думки як хвилі, що дають імпульси в простір.", "У моменти успіху (\"пруха\") варто питати себе \"як може бути ще краще?\", щоб не зупинятися на досягнутому і відкривати нові пласти можливостей.", "У моменти невдач той самий принцип \"як може бути ще краще\" допомагає мозку шукати вихід замість занурення в стрес — приклад з машиною, що зламалась перед ТО.", "Історія про будівельний проєкт: обмеження (\"треба купити землю, потрібно 3 млн доларів\") зникло, коли випадкова зустріч з давнім знайомим показала альтернативний шлях (оренда землі замість купівлі).", "Внутрішній дозвіл собі хотіти і мати більше — ключова тема; наводяться приклади (подруга-мільйонерка, історія з машиною Мерседес, \"прошивка\" рівня життя).", "Рекомендується техніка зв'язку з тілом: рука на груди, рука на живіт, відчувати дихання і промовляти собі дозвільні фрази — це працює швидше за психологічне \"розкопування\" причин.", "Для дисципліни потрібна мотивація, яка базується на власних цінностях (не абстрактних типу \"свобода\", а конкретно розписаних); радиться вести щоденник, щоб не втрачати інсайти та фіксувати прогрес.", "Практична порада: планувати кілька сценаріїв (найкращий, оптимальний, найгірший) для важливих ситуацій, щоб зменшити стрес від невизначеності; також згадується \"м'язовий тест\" для перевірки правдивості цінностей через тіло."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "ОСуспільство.CLUB майстермайнд з Олею на POWER", "d": "2026-04-07", "u": "https://youtu.be/qbUXpcgRj2o", "s": "Це запис групового майстер-майнду, де ведуча обговорює з учасницями поточну \"тривожну\" енергетику у світі, консультує щодо конкретних життєвих запитів (нерухомість, пасивний дохід, ведення блогу), а також ділиться концепціями про проявленість у соцмережах, енергію \"дарування-отримання\" та внутрішній дозвіл собі на успіх.", "th": ["Ведуча радить не піддаватися паніці від тривожних новин і коліванню системи, а тримати внутрішню точку опори та концентруватися на собі.", "Учасниці Яні порадили не продавати квартиру в Україні, а зробити ремонт (можна знайти довірену людину чи бригаду) і здавати її, перетворивши \"баласт\" на пасивний дохід — нерухомість завжди має приносити гроші, а не забирати їх.", "Нерухомість символічно пов'язується з темою \"мама\" — якщо є втрати чи проблеми з нерухомістю, рекомендується пропрацювати тему стосунків з мамою.", "До блогу/соцмереж варто ставитися як до бізнесу і капіталу — коли людина починає сприймати проявленість серйозно (і отримує підтримку близьких), змінюється й результат; наводяться приклади заробітку на контенті (сервіровки, реклама, колаборації з брендами).", "\"Притяжки\" — практика активації себе як \"магніту\" для клієнтів/грошей/можливостей через уявне включення в стан відкритості до прийому, але важливо враховувати свою \"ємкість\", щоб не перевантажитися запитами.", "Не всі люди — цільова аудиторія; варто прийняти, що частина людей не піде за тобою, і зосередитися на тих, кому дійсно підходиш, не намагаючись \"перелічити\" чи переконати всіх.", "Описано концепцію енергії \"дарування-отримання\" — вищий рівень, ніж \"він-він\": дарувати без очікування віддачі від конкретної людини, довіряючи, що повернеться з інших джерел; ведуча каже, що завдяки цій установці змогла спокійно провести вебінар з низькою конверсією без емоційного вигорання.", "Наприкінці учасниці обмінюються особистими інсайтами (відмова від токсичних клієнтів як \"звільнення місця\", зміна назви візи \"хаус вайф\" на \"вихователька поколінь\", сімейна традиція фарбування яєць на Чистий четвер як оберіг для дому)."], "p": true, "c": "Мастермайнди", "extra": ""}, {"t": "ОСусіпільство.CLUB лекція по чат-ботам від Вікторії Довжук 12.03", "d": "2026-03-12", "u": "https://youtu.be/EDR3r6X_DsA", "s": "", "th": [], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "ОСуспільство.CLUB майстермайнд з Олею на POWER 05/03", "d": "2026-03-05", "u": "https://youtu.be/6XjX0lcnzps", "s": "Це запис групового майстер-майнду, де ведуча ділиться інструментами Access Consciousness (числові коди для \"розблокування\" ситуацій) та консультує учасниць щодо особистих запитів — страху проявленості, відчуття \"мені вже досить\" (страх втратити мотивацію рухатись далі), кордонів з дітьми та батьками. Наприкінці обговорюється різниця у висвітленні воєнних подій в Україні та Дубаї, а також поради щодо збереження заощаджень.", "th": ["Описано числові коди Access Consciousness: 5-9-11 (розблокування систем, документів, черг), 7 (на удачу, тільки для інших, не для себе), 9 (жорстке \"завершення циклів\", не рекомендується), 1-2/12 (створення нового майбутнього), 1-2-3 (прибирання \"помилок\" і застрягань).", "На прикладі поламаної машини ведуча показала техніку \"як може бути ще краще\" в моменті стресу — зрештою ситуація вирішилась вигідніше (безкоштовний ремонт за гарантією та безкоштовна машина від бренду).", "Обговорено межу між \"потішити его\" і \"прийняти свої заслуги\" в роботі з клієнтами: відповідальність наставника — дати максимум того, що можеш, а відповідальність людини — взяти це чи ні; не варто порівнювати свої кейси з чужими.", "Порушення енергообміну (безкоштовна допомога без запиту чи домовленості) веде до трикутника \"рятівник-жертва-переслідувач\" і зрештою до знецінення того, хто допомагав.", "Ретикулярна формація мозку пояснює, чому після зацікавлення певною темою людина починає \"бачити\" її всюди (аналогія з алгоритмами соцмереж) — світ завжди залишається збалансованим, просто змінюється фокус уваги.", "На запит \"чому мені досить і я не хочу більшого\" відповідь: це нормальний стан, коли внутрішня \"ємкість\" заповнена і її потрібно дати час \"вистоятися\", а не штучно вигадувати нові цілі — можливості приходять на ємкість, а не \"видивлені\".", "Порада не тримати готівку (долари/євро) у великих сумах через ймовірні зміни у фінансовій системі, а натомість вкладати в нерухомість чи землю; рекомендація спостерігати за світовими подіями \"не вовлікаючись\" емоційно, оскільки страх і тривога \"живлять\" конфлікти."], "p": true, "c": "Мастермайнди", "extra": ""}, {"t": "ОСуспільство.CLUB розстановки з Олею на POWER 24/02", "d": "2026-02-24", "u": "https://youtu.be/13fPbg1Gjzo", "s": "Це запис групової сесії з кількома розстановками для учасниць клубу: одна щодо участі в конкурсі краси й страху перед проявленістю, інша про блокування у грошах через нестачу \"місця\" для клієнтів у графіку, і третя про виснаження жінки, яка одноосібно утримує родину, поки чоловік не працює. Наскрізна ідея — внутрішні родові програми, страхи та відсутність чітких меж заважають людям приймати ресурси й можливості, які вже є в їхньому житті.", "th": ["У розстановці з приводу конкурсу краси виявлено родову програму (від бабусі/прабабусі) страху \"виділятися\", яку треба усвідомлено подякувати і відпустити, взявши повну відповідальність за своє життя на себе.", "Урок для учасниці з судовим процесом: справжня сила — не в постійній боротьбі й контролі, а в довірі та розслабленні (\"сила в слабкості\"); запропоновано практику для розкриття другої чакри та підтримки зв'язку з тілом.", "Блокування грошей і клієнтів пов'язане не з нестачею проявленості в Інстаграмі, а з відсутністю чітко виділеного часу/\"місця\" для клієнтів у власному графіку — коли з'являється чіткий графік, клієнти приходять самі.", "Наведено принцип: у бюджеті мають бути \"нераціональні\" покупки для душі (дороге мило, непотрібні речі) — це підтримує \"пропускну здатність\" для отримання грошей, а не лише раціональні витрати.", "У випадку жінки, яка одна утримує сім'ю, поки чоловік не працює, наголошено: зміни настають лише тоді, коли людина внутрішньо приймає рішення \"з мене досить\" і готова до наслідків — розмови та вмовляння самі по собі нічого не змінюють.", "Порада щодо реалізації творчого проєкту (дитячі товари/піжами): орієнтуватися на ринки Америки, Канади чи Ізраїлю, де є попит і клієнтура, а не обмежуватися Україною чи Францією, де немає ресурсу для розвитку.", "Згадана історія про літніх батьків у Криму, які приховано підтримують Україну — приклад того, що \"мовчазна більшість\" насправді проукраїнська, хоч і боїться це показувати відкрито."], "p": true, "c": "Розстановки", "extra": ""}, {"t": "ОСуспільство.CLUB лекція про здоровʼя зубів від Інни Якиим 23/02", "d": "2026-02-23", "u": "https://youtu.be/Xxbnzk7Ltak", "s": "Це запис зустрічі зі стоматологом-ортодонтом Інною Яким, яка розповідає про комплексний вплив здоров'я порожнини рота на весь організм — від запалень ясен до старіння обличчя та розвитку дитячого скелета. Далі відповідає на практичні питання учасниць про електричні щітки, пасти, іригатори та догляд за зубами дітей і дорослих.", "th": ["Запалення ясен (гінгівіт) займає площу приблизно двох долонь, і бактерії з цього запалення потрапляють у кров, впливаючи на серце (мікроінфаркти, атеросклероз) і мозок (мікроінсульти, абсцеси).", "Перед косметологічними процедурами (філери, мезотерапія, ін'єкції) обов'язково потрібно перевірити порожнину рота у стоматолога — запалення підвищує ризик ускладнень.", "Старіння обличчя значною мірою пов'язане зі зменшенням кісткової тканини щелепи; косметологічні процедури без виправлення прикусу/положення зубів (ортодонтичного чи ортопедичного лікування) дають лише тимчасовий ефект, тоді як правильний прикус створює природний \"ліфтинг\" обличчя.", "Дітям критично важливо їсти тверду їжу (моркву, яблука, скоринку хліба, стейк) для правильного росту щелепи; недостатнє жування призводить до звуження щелепи, ротового дихання та підвищеного карієсу через пересихання слизової.", "Бруксизм (скрегіт зубами) уві сні — нормальний механізм зняття стресу, але при патологічному (надмірному) прояві може викликати стирання зубів, головний біль та біль у м'язах; лікується капами.", "Рекомендовано регулярні візити до стоматолога: дітям — раз на три місяці, дорослим — раз на півроку, бажано до одного лікаря для відстеження динаміки через фотопротокол.", "Щодо гігієнічних засобів: рекомендовано електричні щітки з поєднанням звукового і механічного очищення (наприклад, Oral-B iO), пасти без мас-маркету (Тебодон з маслом чайного дерева при запаленні ясен), а іригатор названо \"must have\" для якісного очищення між зубами."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "ОСуспільство.CLUB зустріч з Олею Ковальчук 19/02", "d": "2026-02-20", "u": "https://youtu.be/J_cAHTC3PhM", "s": "Це запис групової зустрічі, де ведуча розвиває тему легкості у ставленні до грошей і прийняття, а також ділиться конкретною технікою прописування трьох бажань різного рівня складності. Обговорюються страхи, внутрішній дозвіл, різниця між \"треба\" і \"хочу\", а також довіра до простору замість постійного контролю та боротьби.", "th": ["Техніка \"три бажання\": щодня записувати від руки три бажання — легке (досяжне за 3-6 місяців), середнє (з \"розтяжкою\") і глобальне (за межами розуміння) — для налаштування мозку на прийняття цілей, при цьому краще прив'язуватися до рівня комфорту життя, а не до конкретних сум грошей.", "Важливо розрізняти \"треба\" (обов'язок) і \"хочу\" (свідомий вибір); коли людина не обирає себе сама, цього не зробить ніхто інший — рекомендується шукати способи делегувати те, що не хочеться робити, не на шкоду собі.", "Страх — це, по суті, незнання; коли людина погоджується і на найкращий, і на найгірший сценарій розвитку подій, тривога зникає і часто реалізується оптимальний варіант.", "Рекомендується \"тренувати мозок не думати\" — знаходити монотонні заняття (в'язання, читання художньої літератури, тренування з тренером) для відновлення ресурсу, оскільки постійна розумова діяльність \"перегріває\" психіку і викликає тривожність.", "Цілі й дії потрібно співвідносити з рівнем власного енергетичного ресурсу (за аналогією з батареєю телефону) — не варто починати нові проєкти, коли ресурсу залишилось 20%, краще спочатку відновитися.", "Прийняття остаточного рішення \"закрити питання\" (а не постійне обмірковування без дії) запускає процес вирішення ситуації — приклад із податковою перевіркою бізнесмена та з \"зависаючою\" кілька місяців справою клієнтки.", "Стабільність (наприклад, у роботі в наймі) — це ілюзія; справжня фінансова свобода приходить від відповідальності за власне життя і розуміння, що гроші залежать від людини, а не від зовнішніх обставин (роботодавця, країни проживання тощо)."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "ОСуспільство.CLUB лекція по інстаграму від Катерини Водянік 13.02", "d": "2026-02-15", "u": "https://youtu.be/GLiI5KJV7jU", "s": "Це запис лекції SMM-експертки Катерини про алгоритми Instagram та тренди 2026 року для особистого блогу. Головна ідея — Instagram працює за логічними принципами вірусності (репост, додивленість, збереження), а не на лайках чи хаотичному постингу, і успіх блогу залежить від щирості, розуміння цільової аудиторії та правильно підібраного формату контенту.", "th": ["Три головні критерії, за якими Instagram просуває контент: чи будуть його репостити, чи додивляться до кінця, чи будуть зберігати — контент без цих елементів алгоритмічно не просувається.", "Instagram оперує відсотками, а не абсолютними цифрами: якщо один невдалий пост отримав низькі перегляди, наступні відео порівнюються з цим показником, і блог потрапляє в \"тіньовий бан\" — тому краще не постити слабкий контент взагалі.", "Оптимальна частота публікацій — приблизно 1 відео на 2 дні (не по 5-30 відео на день, як радять деякі курси); час публікації слід підбирати під активність цільової аудиторії (для мам — не пізній вечір).", "Головний тренд 2026 року — \"бути людиною\": щирість, показ побуту та особистих деталей створює більше \"точок дотику\" з аудиторією, що зміцнює зв'язок і підвищує лояльність та продажі; надмірно \"вилизаний\" контент і купа ШІ-зображень відштовхують.", "У стрічці/рілсах має домінувати експертний контент (близько 75%), а в сторіз — навпаки, більше особистого, живого контенту (сторіз не повинні перевантажувати експертизою); контент в стрічці має відповідати темі, на яку залітають реели, інакше нові підписники підуть.", "Автовідповідачі в чат-ботах не варто використовувати — люди цінують відчуття індивідуального спілкування; водночас чат-боти для видачі посилань/матеріалів працюють добре і дозволяють уникнути частого постингу зовнішніх посилань у сторіз (що знижує охоплення).", "Для змішування кількох тем/хобі в одному блозі радять обрати одну основну тему як \"парасольку\" (як приклад з експерткою з китайської медицини, де голкотерапія, БАДи та гіпноз об'єднані одним брендом), інакше різна аудиторія просто гортатиме нецікавий їй контент і блог не зростатиме."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "ОСуспільство.CLUB майстермайнд з Олею на POWER 10/02", "d": "2026-02-11", "u": "https://youtu.be/WZ-Lb6xjHNY", "s": "", "th": [], "p": true, "c": "Мастермайнди", "extra": ""}, {"t": "ОСуспільство.CLUB Марина Гичка Лекція про криптовалюту та її користування", "d": "2026-02-02", "u": "https://youtu.be/tjq3-aSJUKY", "s": "Це запис зустрічі, де учасниця Марина розповідає жіночій групі базові поняття про криптовалюту — блокчейн, мережі, біржі, гаманці — та ділиться власним практичним досвідом купівлі, зберігання і стейкінгу криптовалюти. Головна ідея — крипта це насамперед інструмент контролю, безпеки і збереження вартості грошей, а не швидкий спосіб розбагатіти.", "th": ["Криптовалюта створювалася не для заробітку, а як хедж проти інфляції та недовіри до фінансової системи (біткоїн з'явився як відповідь на кризу 2008 року); заробіток — вторинний ефект від обмеженості й незалежності активу.", "Блокчейн — це розподілений цифровий реєстр, записи в якому неможливо підробити чи видалити; монети/токени переміщуються по \"мережах\" (доріжках), і при переказі критично важливо, щоб мережа відправлення і отримання співпадали.", "Гаманці бувають кастодіальні (всередині біржі, для участі в акціях/стейкінгу), гарячі (Trust Wallet, MetaMask — підключені до мережі, зручні для щоденного користування) і холодні (флешка/картка, офлайн, для зберігання великих сум).", "Ключове правило безпеки — обов'язково зберігати seed-фразу (записану на папері, не в цифровому вигляді): пароль можна відновити, а seed-фразу — ні; також не переходити за посиланнями з email/SMS нібито від бірж (Binance, Bybit) — це завжди скам.", "Рекомендована стратегія для новачків — DCA (регулярна купівля невеликими сумами щотижня): купувати біткоїн, ефір і 1-2 монети з топ-10 на CoinMarketCap/CoinGecko, розподіляючи заплановану суму на кілька тижневих покупок.", "Для інформації про монети, гаманці та біржі варто користуватися лише офіційними платформами CoinMarketCap і CoinGecko, а не переходити за випадковими посиланнями з інтернету.", "Порада щодо продажу/фіксації прибутку: варто заздалегідь ставити конкретні фінансові цілі (портфель \"на 2 роки\", \"на 4 роки\" відповідно до біткоїн-циклів) і слідкувати за зростанням активу, щоб не пропустити момент продажу — інакше є ризик \"просидіти\" в активі кілька циклів без фіксації прибутку."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "ОСуспільство.CLUB розстановки з Олею на POWER 29/01", "d": "2026-01-29", "u": "https://youtu.be/JfV-aIPi5QM", "s": "Це запис групової зустрічі з кількома розстановками для учасниць: одна щодо стосунків із чоловіком і невміння просити допомоги, друга про завершення бізнес-конфлікту з німецькими партнерами, третя про рішення народжувати дитину, четверта про судову тактику, і завершується обговоренням ідеї нового проєкту про \"конект з тілом\". Наскрізна тема — навчитися просити, довіряти й дозволяти собі проявлятися замість самостійного \"тягнення все на собі\".", "th": ["У розстановці про стосунки виявлено, що жінка бере на себе всю відповідальність і не просить чоловіка про допомогу, через що він відчуває себе непотрібним — рекомендація починати з дрібних прохань (заправити машину, помити авто), щоб побудувати довіру поступово.", "У розстановці про німецьких партнерів з'ясувалося, що учасниця \"віддавала\" свою внутрішню силу і потенціал компанії-партнеру замість того, щоб реалізувати їх самостійно; рішенням стало усвідомлення власної цінності (\"зірка\") і подяка партнерам за отриманий досвід.", "У розстановці про рішення народжувати дитину показано, що партнер \"дзеркалить\" бажання жінки — коли вона внутрішньо готова діяти рішуче, партнер починає активно діяти (будувати житло, дбати про сім'ю).", "У розстановці про судовий процес рекомендовано змінити пасивну \"тактику жертви\" на активний, аргументований захист власної гідності — без енергії руйнування, а з метою не мати претензій до себе.", "Обговорення нового проєкту про \"конект з тілом\": наголошено, що фокус має бути не на схудненні як меседжі (це може відлякати і знецінити цінність), а на відновленні зв'язку з тілом, з якого схуднення чи інші зміни є лише побічним ефектом.", "Запропонована практика-формула: звертатися до свого тіла з питанням \"покажи мені свою гнучкість/красу/стрункість\" кілька разів на день — це допомагає тілу самому підказувати, що їсти чи коли тренуватися, без примусу.", "Підкреслено, що заплановані значні зміни (тіла, ваги, форми) потребують часу на \"доформування\" структури донесення цінності — авторці ідеї порадили дати собі кілька тижнів, щоб чітко сформулювати пропозицію, перш ніж її запускати."], "p": true, "c": "Розстановки", "extra": ""}, {"t": "ОСуспільство.CLUB зустріч з Олею Ковальчук", "d": "2026-01-21", "u": "https://youtu.be/e8grTbLTZQ8", "s": "Це запис першої зустрічі жіночого клубу на новий рік, присвяченої темі \"легкість у грошах\". Ведуча пояснює концепцію внутрішнього дозволу — узгодженість між думками, словами, відчуттями і діями — та обговорює з учасницями теми виснаження, гри замість боротьби, дисципліни через підтримку, і відмову від ролі \"хорошої дівчинки\" на користь власної автентичності.", "th": ["Внутрішній дозвіл складається з чотирьох компонентів: думаю, говорю, відчуваю і роблю одне й те саме — коли є неузгодженість (наприклад, мозок блокує те, що підказує відчуття), виникають \"збої\" в отриманні бажаного.", "Кількість грошей дорівнює рівню внутрішнього дозволу; те, що дається легко, люди схильні знецінювати, вважаючи цінним лише те, що \"заслужено\" через страждання.", "Рекомендується визначити свої \"суперсили\" — те, що виходить легко і з цікавістю — і перестати сприймати їх як само собою зрозуміле, а усвідомлено цінувати.", "Роздратування від оплати рахунків можна свідомо переключати на вдячність за можливість це зробити — вдячність і негативні емоції не можуть співіснувати одночасно.", "Запропоновано вправу з \"назвою фільму про своє життя\" і \"назвою фільму, якби грав головну роль\" — якщо назви різняться
