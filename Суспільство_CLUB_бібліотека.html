иклад, образ сходинок як шлях до мети через маленькі кроки, або дівчина у воді як символ спокою серед \"буревію\" зовнішніх обставин) — це і є суть метафоричних карт.", "За підсумками зустрічі створено майже повну колоду метафоричних карт для клубу, які планується використовувати надалі, зокрема в медитаціях налаштування на місяць."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Лекція Ірини Селезньової \"Основи крипто інвестицій\"", "d": "2024-04-04", "u": "https://youtu.be/P04LjncbFAA", "s": "Це запис лекції криптоінвесторки Ірини Селезньової про основи криптовалютного ринку, блокчейн-технологію та способи заробітку на криптовалюті. Головна ідея: криптовалюта — це технологія майбутнього з реальним потенціалом заробітку (від інвестицій до трейдингу та дропів), яка потребує систематичного навчання, диверсифікації портфеля та обережності через шахрайські схеми, але вже стає легалізованою і доступною для будь-кого незалежно від технічної підготовки.", "th": ["Блокчейн — це децентралізована база даних без єдиного керуючого органу, яка забезпечує швидшу, дешевшу та прозорішу передачу інформації (включно з фінансовими операціями), ніж традиційні банки, і використовується не лише для криптовалют, а й для токенізації нерухомості, голосувань, логістики.", "Головні ризики крипторинку — висока волатильність цін, неповне державне регулювання та потенціал шахрайства, однак великі компанії (Visa, PayPal) вже інтегрують криптовалюту, а низка розвинених країн (Канада, Швейцарія, Японія, Естонія) легалізували її обіг.", "Існує кілька способів заробітку на криптовалюті: пасивні інвестиції та криптодепозити (мінімум часу, помірний прибуток), IDO — інвестиції в стартапи до виходу на біржу (вищий ризик і потенційний дохід до тисяч відсотків), трейдинг (активна щоденна торгівля, потребує більше знань і часу) та дропи/airdrop (виконання завдань проєктів за винагороду без вкладень).", "Перед купівлею будь-якої монети важливо перевіряти її наявність на надійних платформах (CoinMarketCap, CryptoRank) — відсутність лістингу на цих ресурсах є сигналом потенційного шахрайства.", "Для формування портфеля рекомендується розподіляти кошти між низькоризиковими активами (топ-10 монет за капіталізацією — біткоїн, ефір тощо) та високоризиковими молодшими монетами (не більше 15-33% портфеля залежно від рівня досвіду інвестора).", "Зберігати криптовалюту безпечніше на особистому гаманці (MetaMask, апаратні гаманці типу Ledger, Trezor), а не на біржі, оскільки біржа є централізованим об'єктом з можливими ризиками; водночас важливо надійно зберігати приватні ключі від гаманця.", "Криптовалюта розглядається як зручна альтернатива традиційним переказам грошей в умовах банківських обмежень (ліміти НБУ на зняття та перекази за кордон) завдяки фіксованим мінімальним комісіям незалежно від суми переказу."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "МАСТЕРМАЙНД з Ольгою Ковальчук", "d": "2024-03-29", "u": "https://youtu.be/Wbdmly5OUFU", "s": "Це запис Мастермайнду Ольги Ковальчук, де вона консультує учасниць — Аню (про відсутність \"горіння\" ідеєю та вигорання від материнства), Вікторію (про правильну постановку цілей) та Ілону (про страх спробувати новий бізнес). Головна ідея: рухатися до цілей потрібно не через насильне \"горіння\" чи страх, а через усвідомлений намір, поступові кроки та достатній внутрішній ресурс — саме стан, з якого людина діє, визначає результат, а не зовнішні обставини.", "th": ["Не всі люди повинні \"горіти\" ідеєю, щоб досягти успіху — за системою Human Design в кожної людини свій темп руху (хтось \"спалахує як сірник\", хтось діє повільно й стабільно, \"як бульдозер\"), і важливо розуміти свій тип, а не порівнювати себе з іншими.", "Дії від потреби (коли рішення приймаються лише в кризовій ситуації, \"коли диванчик загорівся\") — це реактивна, виснажлива модель поведінки; натомість варто вчитися діяти проактивно, з наміром, а не чекаючи на черговий кризовий поштовх.", "Гроші приходять не тому, що людина багато працює, а завдяки її внутрішній енергії та стану — переконання \"якщо я не працюватиму, у мене не буде грошей\" є ілюзією; важливо працювати ефективно (мало часу, але з думанням), а не \"від забору до заходу\".", "Для постановки досяжних цілей потрібно робити їх конкретними й реальними для мозку (їздити дивитися будинки, машини, спілкуватися з людьми, які вже мають бажане) та розбивати великі цілі на проміжні кроки — різкий стрибок (наприклад, схуднути одразу на 30 кг) неефективний і виснажливий.", "\"Гвалтувати Всесвіт\" (форсувати результат, постійно перевіряти й втручатися, як з паростком авокадо) шкідливо — краще довіряти процесу та власному темпу, не порівнюючи свій шлях з чужим досвідом.", "Ключовий фактор успіху будь-якої справи — внутрішній намір і стан, з якого людина діє: коли є чітке рішення й впевненість (\"буде продаватися\", \"буде виходити\"), зовнішні обставини (війна, криза) не заважають результату; сумніви й страх, навпаки, забирають ресурс і \"розхитують\".", "Життєвий досвід (навіть невдалий матеріально) цінніший за самі гроші, оскільки формує здатність діяти по-іншому в майбутньому — люди, які уникають досвіду через страх втрати, залишаються в постійних сумнівах, тоді як пройдений досвід (навіть кризовий) дає ресурс і впевненість надалі."], "p": false, "c": "Мастермайнди", "extra": ""}, {"t": "\"Сила середовища\" Відкрита зустріч з Ольгою Ковальчук про формування особистості у якісному оточенні", "d": "2024-03-29", "u": "https://youtu.be/tuVDzVElCsA", "s": "Це запис презентаційної зустрічі Ольги Ковальчук, на якій вона розповідає про свій клуб \"Суспільство\" і головну ідею — силу якісного оточення для особистісного та фінансового зростання. Головна ідея: розвиток людини майже неможливий без якісного оточення, яке підтримує, розширює кругозір і \"підтягує\" до нового рівня норми, тоді як токсичне чи стагнуюче оточення тримає людину на місці, подібно до \"ефекту відра з крабами\".", "th": ["Оточення формує звички, поведінку та навіть відчуття \"норми\" людини — на особистому прикладі ведуча показала, як зростання її фінансового рівня узгоджувалося зі зміною кола спілкування (від автобусів у молодості до найму автомобіля в дорослому житті).", "Ефект \"відра з крабами\" — коли близьке оточення (навіть родичі) підсвідомо не дає людині розвиватися, \"затягуючи назад\", якщо вона намагається \"вилізти\" на новий рівень; для протидії цьому потрібно свідомо обирати підтримуюче середовище.", "Фінансове зростання — не про самі гроші, а про внутрішню свободу, впевненість у собі та роботу з родовими програмами; гроші приходять як наслідок внутрішнього стану людини.", "Якісне оточення дає п'ять ключових речей: емоційну підтримку, розширення кругозору, нові можливості для взаємодії й спільних проєктів, підвищення самооцінки через прийняття \"такою, яка є\", і формування здорових звичок.", "Наведено конкретні кейси учасниць клубу: одна почала вести соцмережі та здобула впевненість, подолавши тілесні прояви стресу (біль у горлі, кашель) через блокування власної проявленості; інша після першого виступу в клубі отримала пропозицію великого проєкту, і її дохід зріс на 40%."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "Лекція Василя Герасімова \"Еліксир кохання\"", "d": "2024-03-28", "u": "https://youtu.be/N5jhtBaMCqI", "s": "Це запис лекції рефлексотерапевта та остеопата Василя Герасімова про складові якісних партнерських стосунків. Головна ідея: любов проходить чотири етапи (платонічний, романтичний, еротичний, сексуальний), а міцні стосунки будуються на трьох компонентах — інтимності (близькості), пристрасті та відповідальності — водночас глибина сексуального контакту і оргазму залежить від тілесного відчуття безпеки, здатності дихати та бути присутнім у моменті, а не від механічної техніки.", "th": ["Тривалі стосунки будуються на трьох компонентах: інтимність/близькість (уміння ділитися секретами і слухати одне одного), відповідальність (розподіл побутових обов'язків) і пристрасть (сексуальний потяг) — якщо є лише два з трьох компонентів, виникають різні типи стосунків (курортний роман, дружнє кохання, безсмисленне кохання), а не повноцінна \"досконала любов\".", "Реакції тіла при страху й при збудженні фізіологічно дуже схожі (тремтіння, пітніння, прискорене серцебиття), тому важливо навчитися відрізняти справжнє тілесне відчуття безпеки (м'якість рухів, спокійне дихання, довіра) від імобілізації через страх, інакше секс залишається механічним без справжньої присутності.", "Запах партнера є ключовим маркером близькості — він формується емоційним станом людини, тож рекомендується \"перевіряти\" сумісність, нюхаючи непривичні місця тіла партнера після контакту, оскільки використання парфумів і дезодорантів може \"оманювати\" це природне відчуття.", "Гормон окситоцин формує ніжність і прив'язаність (виникає при контакті, обіймах), а вазопресин — прив'язаність через відчуття \"ковзання\" (наприклад, під час незахищеного сексу) — обидва гормони є \"хімічним клеєм\" стосунків.", "Оргазм буває локальним (розслаблення лише в ділянці тазу) і глобальним (розслаблення хвилею по всьому тілу, з нейрогенним тремором) — яскравість оргазму залежить від кількості подразників, свідомого дихання (більшість людей затримують дихання під час сексу) та дозволу собі звучати голосом.", "Після сексу важливий етап \"опрацювання досвіду\" — обговорення з партнером, що сподобалось, а що ні, оскільки без цього досвід залишається незавершеним і не може бути \"присвоєний\" для повторення в майбутньому.", "Зникнення лібідо часто пов'язане з нездатністю нервової системи розслаблятися іншими способами, крім сексу (як компенсаторний механізм при стресі), або зі станом горювання чи невисловленою образою в парі — у таких випадках рекомендується спільна фізична активність, ігри та тілесні практики (наприклад, \"побитися сніжками\" з паперу) для зближення без прямого сексуального контакту."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Лекція Ольги Ковальчук: \"Поєднання чоловічої та жіночої енергії\"", "d": "2024-03-27", "u": "https://youtu.be/WEV0yVYp7_4", "s": "Це запис неформальної бесіди Ольги Ковальчук з учасницями клубу про жіночу та чоловічу енергії, побудований на особистих спостереженнях з поїздки в жіноче коло в Іспанії. Головна ідея: порівняння себе з іншими за зовнішністю чи особистим життям руйнує жіночу енергію (на відміну від порівняння результатів, яке мотивує в чоловічій енергії), а справжня жіночність розвивається через прийняття себе, увагу до тіла, вміння обирати себе та вчасно відпочивати.", "th": ["Порівняння себе з іншими жінками за зовнішністю, стосунками чи дітьми забирає жіночу енергію і руйнує, тоді як порівняння результатів (кар'єра, досягнення) — це чоловічий принцип, який навпаки мотивує й дає енергію.", "У кожної людини є і чоловіча, і жіноча енергія в різних пропорціях; надмірна чоловіча енергія (відповідальність, дії, порівняння) з часом \"згинає\" жіночність, тому потрібно свідомо розвивати жіночу сторону, не пригнічуючи чоловічу.", "Жіночність проявляється через тіло та увагу до нього (догляд, повільність, задоволення), а не через зовнішні атрибути — тіло є \"інструментом\", і прискіпливе ставлення до нього (целюліт, зайва вага) блокує жіночу енергію.", "\"Мистецтво обирати себе\" — здатність відмовитися від чужих очікувань (наприклад, не поїхати на спільний захід, побути на самоті) заради власного відновлення — є ключовим елементом жіночності і не є зрадою по відношенню до інших людей.", "Описано архетипи жіночого розвитку: ніжне створення → муза → войовниця → руйнівниця (стан внутрішнього конфлікту й невдоволеності) → цариця (стан внутрішньої впевненості, коли людина точно знає, чого хоче, і \"дари\" приходять самі); важливо не застрягати на етапі руйнівниці.", "Порівняння себе з минулим версією себе (а не з іншими людьми) є здоровим способом бачити власний прогрес; водночас звинувачення себе за те, що \"могла зрозуміти щось раніше\", неконструктивне — кожна людина проходить свій шлях у свій темп.", "Для відновлення психоемоційного стану (особливо матерям з маленькими дітьми) необхідний справжній відпочинок — повне \"нічогонероблення\" (не хатні справи), регулярні проміжки часу для себе, оскільки хронічна нестача відновлення робить нервову систему \"оголеною\" і дратівливою."], "p": false, "c": "Зустрічі з Олею", "extra": ""}, {"t": "p2p з Еллою Лазар \"Складові WELLNES та як їх впровадити у своє \"швидке\" життя", "d": "2024-03-27", "u": "https://youtu.be/GPRtpJBRBMs", "s": "Це запис пір-то-пір зустрічі з Еллою Лазар про поняття \"велнес\" та практичні способи впровадити усвідомлений підхід до життя в умовах щоденного стресу й поспіху. Головна ідея: велнес — це не просто фізичне здоров'я чи спорт, а багатогранний баланс тіла, розуму й енергії, який досягається через маленькі щоденні звички, ранкові ритуали та усвідомлений вибір у всіх сферах життя, а не через одноразові грандіозні рішення.", "th": ["Велнес — це багатовимірне поняття, яке охоплює фізичний, емоційний, інтелектуальний, духовний, соціальний та фінансовий стани людини, а не лише спорт чи правильне харчування.", "\"Колесо балансу життя\" — інструмент самоаналізу, що дозволяє оцінити від 1 до 10 різні сфери життя (здоров'я, фінанси, стосунки, творчість, особистий розвиток тощо) і побачити, де найбільше просідання, щоб свідомо працювати над гармонією.", "За принципом з книги \"Атомні звички\" маленькі щоденні покращення на 1% мають кумулятивний ефект — людина, яка щодня стає трохи кращою, за рік стає приблизно у 37 разів кращою, тоді як одне \"феноменальне\" рішення не дає стійкого результату.", "Кожна звичка — це \"голосування\" за ідентичність людини, якою вона хоче стати; варто фокусуватися не на самому результаті звички, а на тому, якою людиною людина хоче бути через рік чи кілька років.", "Якісний ранковий ритуал (тепла вода з лимоном, \"ранкові сторінки\" для вивільнення думок, афірмації, легка зарядка чи медитація) визначає якість усього дня, оскільки перша година після пробудження налаштовує психоемоційний стан на весь день.", "Афірмації працюють ефективніше, якщо вони сформульовані рідною мовою підсвідомості людини та стосуються конкретних сфер, де є особисті \"затики\" чи обмежувальні переконання, а не є універсальними фразами з інтернету.", "Важливо практикувати усвідомленість — вміти казати \"ні\", коли це потрібно, не грати роль \"хорошої дівчинки\", рефлексувати свої емоційні стани та бути лагідними і люблячими до самих себе, оскільки без внутрішньої наповненості неможливо щиро віддавати щось іншим людям."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "зустріч p2p \"Основи нумерології\" з Вікторією Комарницькою (12.03)", "d": "2024-03-12", "u": "https://youtu.be/PfS4ylPnX2c", "s": "Це запис зустрічі пір-то-пір з нумерологинею Вікторією Комарницькою, яка розраховує і трактує число долі (число життєвого шляху) кожної учасниці клубу на основі дати народження. Головна ідея: число долі, отримане підсумовуванням цифр дати народження до однозначного числа, розкриває вроджений потенціал, сильні риси характеру та сфери, у яких людині варто розвиватися чи бути обережною.", "th": ["Число долі розраховується підсумовуванням усіх цифр повної дати народження до однозначного числа (наприклад, з 22 і 8 виходить 34, а далі 3+4=7); при цьому проміжне двозначне число також впливає на трактування підсумкового однозначного числа.", "Число 7 (шлях філософа, вченого, мудреця) означає людей стриманих зовні, але з сильними внутрішніми емоціями та потужною інтуїцією; вони важко виражають почуття у стосунках, але завжди \"виходять сухими з води\" завдяки сильним \"ангелам-охоронцям\".", "Число 9 у датах народження вказує на сильний зв'язок з родом і схильність до езотеричної діяльності (нумерологія, таро, робота з підсвідомістю); таким людям радять уникати конфліктів з родичами, оскільки зв'язок з родом дуже наповнює їх.", "Число 8 у матриці долі пов'язане з кармою та справедливістю — людям з цим числом усе \"повертається\" значно швидше, ніж іншим, тому важливо сплачувати податки, виконувати обіцянки та уникати негативних думок чи слів.", "\"Липневі\" люди за датою народження мають вроджену схильність до переїздів (себе чи родини) навіть до того, як це стає актуальним; це закладена риса, яка проявляється незалежно від зовнішніх обставин.", "Людям з надлишком \"чоловічої\" рушійної енергії (лідерство, контроль, відповідальність) важливо вчитися включати \"жіночність\" у спілкуванні з чоловіками та вчитися розслаблювати тіло (масажі, ванни, догляд), інакше вони швидко виснажуються, не помічаючи цього.", "Свобода (у діях, графіку, словах) є критично важливою цінністю для деяких типів (наприклад, число 5) — таким людям протипоказана жорстко регламентована офісна робота, натомість вони отримують можливості через активне спілкування з новими людьми, а не через планування."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Лекція Софії Безверхої \" Чому українська культура- це космос, а не лише шаровари, горілка і сало\"", "d": "2024-03-07", "u": "https://youtu.be/Meuj94jBeCg", "s": "Це запис лекції блогерки Софії Безверхої про глибину та велич української культури, знищеної й привласненої російською імперією та СРСР протягом століть. Головна ідея: справжня українська культура — це не лише \"шаровари, горілка і сало\", а потужна тисячолітня традиція (від Русі-України до світових митців), яку планомірно знищували, стирали й підміняли, тому зараз, під час війни, важливо повертатися до коренів, знати свою історію та бути амбасадорами України у світі.", "th": ["Так званий \"етнографічний\" образ України (танці, вареники, шаровари) — це \"обгортка без суті\", сформована імперією: справжніх українців позбавляли можливості розвивати власну високу культуру, дозволяючи лише сценічний, вульгаризований образ як \"кістку\", кинуту колонії.", "Слово \"Росія\" є калькою з давньогрецької назви \"Русія\", якою у Візантії називали Русь-Україну з центром у Києві; привласнивши цю назву у XVIII столітті, Московське царство змогло присвоїти й історію, культуру та спадщину Русі-України.", "Багатьох світових митців українського походження (Малевич, Рєпін, Пимоненко, Айвазовський, Куїнджі) радянська та російська пропаганда презентували як \"русскіх художників\", оскільки в Україні під час імперської окупації не дозволяли створювати власні навчальні заклади мистецтв.", "Радянська влада проводила цілеспрямоване знищення української інтелігенції (\"розстріляне відродження\") — письменників, художників, науковців (родина Крушельницьких, Михайло Бойчук, Алла Горська, Василь Симоненко), оскільки саме мислячі, освічені люди становили найбільшу загрозу імперській пропаганді.", "Українська мова зазнала щонайменше 134 задокументованих офіційних заборон і утисків, включно з мовною реформою 1933 року, яка \"залізла всередину\" мови та штучно уподібнювала її до російської, вилучаючи питомі слова, форми та літеру \"Ґ\".", "Голодомор супроводжувався не лише вилученням їжі, а й систематичним пограбуванням матеріальної культури — одягу, прикрас, вишитих сорочок — які люди змушені були обмінювати за безцінь у \"торгсінах\" на борошно чи хліб, щоб вижити.", "Наслідком колективних травм (голодоморів, репресій) є явище \"стокгольмського синдрому\" в частини українців — підсвідоме бажання бути схожими на своїх колишніх \"мучителів\" (Росію), щоб уникнути повторення переслідувань; подолати це можливо лише свідомим вольовим вибором і постійною роботою над собою."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "p2p з Анною Бєлановою \"Генерація зображень за допомогою ШІ\" (05.03)", "d": "2024-03-05", "u": "https://youtu.be/j1ZHNA0mYzY", "s": "Це запис пір-то-пір зустрічі з Анною Бєлановою, ІТ-спеціалісткою з освітою в галузі штучного інтелекту, яка розповідає про принципи роботи ШІ та практично демонструє генерацію зображень у ChatGPT (DALL-E 3) і Midjourney. Головна ідея: генеративні нейромережі дозволяють будь-кому легко створювати зображення, логотипи та метафоричні карти через текстові запити (промти), при цьому кожен інструмент має свої сильні й слабкі сторони, і опанувати їх можна лише практикою.", "th": ["Нейронні мережі навчаються за п'ятиетапним циклом: збір великої кількості даних, їх сортування/розмітка, навчання моделі (де математичний процес всередині залишається \"чорною скринькою\", яку ніхто до кінця не розуміє), тестування на відкладених даних та коригування результатів.", "Проривне зростання ШІ останніх років сталося завдяки тому, що математичні обчислення для нейромереж почали виконуватися на відеокартах (тих самих, що використовуються для майнінгу криптовалюти), що різко пришвидшило й здешевило процес навчання моделей.", "ШІ поділяються на класичні (прогнозують чи ідентифікують, наприклад передбачення погоди) та генеративні (створюють новий контент — зображення, текст), і саме генеративні ШІ зараз переживають бум популярності.", "DALL-E 3 (вбудований у ChatGPT) краще розуміє складні текстові запити, метафори та ідіоми будь-якою мовою, і є одним з небагатьох генераторів, здатних коректно наносити текст на зображення (наприклад, для логотипів).", "Midjourney має ширші можливості для редагування (масштабування, зміна пропорцій, варіації, розтягування зображення) та зберігає історію всіх згенерованих робіт, а також дозволяє вчитися, переглядаючи промти інших користувачів у спільному чаті на платформі Discord.", "Зображення, згенеровані в Midjourney, здебільшого публічно доступні іншим користувачам платформи (якщо не увімкнено платний \"silent mode\"), тоді як роботи, створені через ChatGPT/DALL-E, залишаються приватними, але не зберігаються довго в системі.", "Авторське право на ШІ-згенеровані зображення перебуває в \"сірій зоні\" — за ліцензією Midjourney користувачі можуть використовувати будь-які згенеровані в системі зображення (включно з чужими) для комерційних цілей, але це не захищено як традиційне авторське право."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "Лекція Антоніни Носко \"Особиста ефективність\"", "d": "2024-02-22", "u": "https://youtu.be/orA1CfCxsJA", "s": "Це запис лекції підприємниці Антоніни Носко про особисту ефективність через призму лін-методології (Lean), яку вона застосовує в бізнес-консалтингу. Головна ідея: особиста ефективність починається з чіткого усвідомлення власної цінності (що для мене важливо зараз) та регулярного виявлення і усунення \"втрат\" — часу, енергії й ресурсів, що витрачаються без користі, — за допомогою простих інструментів на кшталт системи 5S.", "th": ["Ефективність — динамічне поняття, яке змінюється кожні кілька місяців; тому важливо регулярно (раз на пів року) перепитувати себе \"що мені важливо зараз\", а не орієнтуватися на застарілі уявлення про продуктивність.", "Варто чітко розрізняти свій \"талант\" (природну сильну сторону) і \"тонкий лід\" (сфери, де людина завжди помилятиметься) — і делегувати все, що потрапляє в другу категорію, замість витрачати сили на неефективну боротьбу з власними слабкостями.", "Вправа \"ідеальний день\" (опис бажаного розпорядку від руки) допомагає усвідомити розрив між поточним і бажаним станом; рухатися до нього краще поступово — спочатку досягти \"50% результату\", а не одразу вимагати кардинальних змін.", "У лін-методології виділяють вісім видів втрат (очікування, транспортування, перевиробництво, зайві запаси, зайва обробка, брак, невикористаний потенціал людей тощо); аналіз робочого тижня через призму цих втрат зазвичай показує, що близько 80% дій — це втрати, а лише 20% — справжня цінність.", "Принцип \"не приймати брак\" означає, що не варто виправляти чи допрацьовувати неякісно виконану іншими роботу (наприклад, документи з помилками) — краще повернути її на доопрацювання виконавцю, інакше це забирає власний ресурс і позбавляє інших людей можливості розвиватися.", "Система 5S (сортування, впорядкування за принципом \"під рукою\"/\"рідко використовується\"/\"сміття\"/\"невизначено\", підтримання чистоти, стандартизація, звичка) застосовна не лише до фізичного простору (дім, кухня), а й до цифрових файлів, фотографій та навіть переписок.", "Практичний чек-лист особистої ефективності: раз на пів року перевіряти свою поточну цінність, раз на місяць проводити 5S в якійсь одній зоні життя, раз на тиждень аналізувати робочий час на предмет цінності проти втрат і приймати рішення про делегування."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "МАСТЕРМАЙНД з Ольгою Ковальчук", "d": "2024-02-21", "u": "https://youtu.be/jZNghciZ06c", "s": "Це запис Мастермайнду Ольги Ковальчук, де вона консультує учасниць клубу з приводу самоцінності, ціноутворення на власні послуги та рішення звільнитися з найманої роботи заради власної справи. Головна ідея: справжня цінність людини як спеціаліста визначається не зовнішніми факторами (конкуренцією, страхом відмови), а внутрішньою готовністю відокремити себе-особистість від себе-експерта і призначати ціну, яка резонує з реальною вартістю власної роботи, а не зі страхом втратити клієнта.", "th": ["Важливо відокремлювати \"себе як особистість\" від \"себе як спеціаліста/продукту\" — людина продає не себе, а свою експертність, час і ресурси, вкладені в набуття цих навичок; ототожнення себе з послугою призводить до відчуття, що продаєш власну душу.", "Заниження вартості своїх послуг створює емоційний \"борг\": людина, яка отримала цінність за заниженою ціною, підсвідомо почувається винною і рідше повертається, тоді як релевантна ціна формує здоровий обмін і повторні звернення клієнтів.", "Правильна вартість послуги відчувається як внутрішнє піднесення після оплати (без страху, без завищення); якщо при називанні ціни виникає страх, що не заплатять, — це ознака неготовності до цієї суми, а не показник об'єктивної переоцінки.", "Конкуренції як такої не існує — люди приходять на конкретну енергію та експертність людини; страх перед \"конкурентами\", які копіюють контент чи стиль, є проєкцією внутрішньої невпевненості, а не реальною загрозою, оскільки повторити чужу унікальність неможливо.", "Рішення звільнитися з найманої роботи заради власної справи вимагає повної готовності взяти 100% відповідальність за своє життя; корисно завчасно спланувати фінансову подушку та психологічно підготуватися до можливого проходження \"точки нуля\" як цінного досвіду.", "Не всім людям потрібно ставати підприємцями — є люди, чия сила проявляється в командній роботі й найманій позиції, і це не менш цінний шлях; головне — усвідомлена самоцінність і готовність відстоювати свої умови (наприклад, просити частку в бізнесі за вагомий внесок).", "Технології штучного інтелекту (ChatGPT, генерація аватарів, автоматизація) кардинально змінюють ринок професій найближчими роками, тому варто активно вивчати ці інструменти для оптимізації особистих і бізнес-процесів, оскільки ті, хто освоять їх першими, отримають значну перевагу."], "p": false, "c": "Мастермайнди", "extra": ""}, {"t": "р2р з Ольгою Денегою (13.02)", "d": "2024-02-21", "u": "https://youtu.be/G_MUjwl2ScM", "s": "Це запис першої зустрічі пір-то-пір (\"зустрічі рівних\") клубу Ольги Ковальчук, де учасниці знайомляться одна з одною, розповідають про свої професії та хобі, а Ольга Денега (модераторка зустрічі) розповідає про принципи роботи клубу та плани на березень. Головна ідея: клуб будується на живому спілкуванні рівних людей зі спільними цінностями, взаємній підтримці та обміні досвідом, а не на формальному навчанні за курсом.", "th": ["Клуб переходить на систему прийому нових учасниць лише через попереднє інтерв'ю, щоб зберігати спільність цінностей та атмосферу довіри й безпеки в спільноті.", "Практика щоденного написання подяк (5 днів поспіль) допомогла учасницям змістити фокус із втоми й негативу на усвідомлення хорошого у своєму житті — навіть ті, хто пропускав дні, відчували емоційне піднесення, читаючи подяки інших у чаті.", "Індивідуальні консультації та майстермайнди з Ольгою допомагають учасницям побачити приховані причини особистих блоків (наприклад, страх перед великими сумами грошей через родову історію розкуркулення) через погляд збоку та аційних частот серед емоцій (за наведеним дослідженням) — вище лише радість, свобода, єдність зі світом і безумовна любов, тоді як страх і горе перебувають на найнижчому рівні.", "Наукові дослідження (Каліфорнійський університет та інші) показують, що практика вдячності покращує прийняття рішень, енергійність, знижує ризик серцево-судинних захворювань, покращує приживання донорських органів і прискорює одужання від ПТСР у ветеранів.", "Вдячність не спрацює, якщо перед цим не пропрацьовані образи та негативні емоції — \"стрибати\" одразу у вдячність, ігноруючи біль, є \"духовним самообходом\" (ілюзією розвитку), схожим на посадку квітів на непрочищеному болоті.", "Існує три рівні доступу до вдячності — минуле (пошук ресурсу навіть у важких подіях через питання \"чому моя душа обрала цей досвід\"), теперішнє (вдячність за прості речі, які сприймаються як даність) та майбутнє (вдячність наперед, яка притягує бажане, бо мозок не розрізняє уявну картинку від реальності).", "Існують \"три кола вдячності\" — собі (профілактика внутрішнього критика), іншим людям (метод \"зеленої ручки\" — конкретна подяка за дію замість критики зміцнює стосунки) та світу в цілому (вдячність без слів, через енергетичний потік)."], "p": false, "c": "Зустрічі зі спікерами", "extra": ""}, {"t": "p2p з Марією Гощицькою (20.02)", "d": "2024-02-21", "u": "https://youtu.be/fX1dkwlB8AI", "s": "Це запис пір-то-пір лекції маркетологині Марії Гощицької про побудову особистого бренду. Головна ідея: особистий бренд є у кожної людини незалежно від активності в соцмережах, і успішне його розвивання починається не з \"бути блогером\", а з чіткого визначення власної ідентичності, типу бренду, цільової аудиторії та відповідних каналів комунікації.", "th": ["Особистий бренд — це те, з чим вас асоціюють люди, ваша репутація та соціальний капітал, а не обов'язково активність в соцмережах; він є у кожного, просто масштаб і керованість цим впливом різняться.", "Існує кілька типів особистого бренду (медійні особист const MON = ["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
const CATS = ["Зустрічі з Олею","Зустрічі зі спікерами","Розстановки","Мастермайнди"];

if (ALL_MM_AND_ROZSTANOVKY_ARE_POWER) {
  DATA.forEach(r => { if (r.c === "Мастермайнди" || r.c === "Розстановки") r.p = true; });
}

let tier = "light", cat = "all", year = "all", q = "", who = "";

const $ = id => document.getElementById(id);
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── gate ── */
function tryEnter(){
  const v = $("code").value.trim().toLowerCase();
  if (!v) return;
  const u = USERS.find(x => (x.p||"").toLowerCase() === v);
  if (u)                                              unlock(u.t === "power" ? "power" : "light", u.n);
  else if (CODES.power && v === CODES.power.toLowerCase()) unlock("power", "");
  else if (CODES.light && v === CODES.light.toLowerCase()) unlock("light", "");
  else { $("err").classList.add("show"); $("code").value=""; $("code").focus(); }
}
function unlock(t, name){
  tier = t; who = name || "";
  $("gate").classList.add("hidden");
  $("app").hidden = false;
  $("tierName").textContent = t === "power" ? "Power" : "Light";
  $("tier").classList.toggle("is-power", t === "power");
  $("hello").textContent = who ? `Привіт, ${who}!` : "";
  $("hello").hidden = !who;
  render();
}
$("enter").onclick = tryEnter;
$("code").addEventListener("keydown", e => {
  $("err").classList.remove("show");
  if (e.key === "Enter") tryEnter();
});
$("out").onclick = () => location.reload();

/* ── chips ── */
const YEARS = [...new Set(DATA.map(r => r.d.slice(0,4)).filter(Boolean))].sort().reverse();

$("tabs").innerHTML =
  `<button class="tab on" data-v="all" role="tab">Усе<b>${DATA.length}</b></button>` +
  CATS.map(c => `<button class="tab" data-v="${esc(c)}" role="tab">${esc(c)}<b>${DATA.filter(r=>r.c===c).length}</b></button>`).join("");

$("chips").innerHTML =
  `<span class="chips-label">Рік</span>` +
  YEARS.map(y => `<button class="chip" data-v="${y}">${y}</button>`).join("");

$("tabs").onclick = e => {
  const b = e.target.closest(".tab"); if (!b) return;
  cat = b.dataset.v;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.v === cat));
  render(); window.scrollTo({top:0,behavior:"smooth"});
};
$("chips").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  year = (year === b.dataset.v ? "all" : b.dataset.v);
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.v === year));
  render();
};

let timer;
$("q").oninput = e => { clearTimeout(timer); timer = setTimeout(() => { q = e.target.value.trim().toLowerCase(); render(); }, 160); };

/* ── render ── */
function render(){
  const locked = r => r.p && tier !== "power";
  let rows = DATA.filter(r => {
    if (cat  !== "all" && r.c !== cat)            return false;
    if (year !== "all" && r.d.slice(0,4) !== year) return false;
    if (q) {
      const hay = locked(r) ? r.t : (r.t + " " + r.s + " " + r.th.join(" ") + " " + r.c);
      if (!hay.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const nLocked = rows.filter(locked).length;
  const nOpen   = rows.length - nLocked;
  $("count").textContent =
    tier === "power"           ? `${rows.length} ${plural(rows.length)}`
    : !nLocked                 ? `${nOpen} ${plural(nOpen)}`
    : !nOpen                   ? `${nLocked} ${plural(nLocked)} · доступно на Power`
    : `${nOpen} ${plural(nOpen)} · ще ${nLocked} на Power`;

  if (!rows.length) {
    $("list").innerHTML = `<div class="empty"><p>Нічого не знайшлося</p><span>Спробуйте інше слово або зніміть фільтри</span></div>`;
    return;
  }

  let html = "", curYear = "";
  rows.forEach((r, i) => {
    const y = r.d.slice(0,4);
    if (y !== curYear) {
      curYear = y;
      const n = rows.filter(x => x.d.slice(0,4) === y).length;
      html += `<div class="yr"><b>${y}</b><i></i><em>${n} ${plural(n)}</em></div>`;
    }
    html += card(r, i, locked(r));
  });

  if (tier !== "power" && nLocked) {
    html += `<div class="teaser">
      <span class="n">${nLocked}</span>
      <div class="teaser-txt">
        <p>Це рівень Power</p>
        <p>Мастермайнди й розстановки — про розбір власного запиту, а не спостереження за чужим. Щомісяця, разом з Олею.</p>
      </div>
    </div>`;
  }

  $("list").innerHTML = html;
}

function plural(n){
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return "запис";
  if (a >= 2 && a <= 4 && (b < 10 || b > 20)) return "записи";
  return "записів";
}

function card(r, i, lock){
  const [Y,M,D] = r.d.split("-");
  const date = `<div class="date"><b>${+D}</b>${MON[+M-1]}</div>`;

  if (lock) return `<article class="row locked">
    <div class="row-head">
      ${date}
      <div class="meat">
        <div class="title">${esc(r.t)}</div>
        <div class="tags">
          <span class="tag">${esc(r.c)}</span>
          <span class="pw">${lockSvg}Доступно на Power</span>
        </div>
      </div>
      <div class="lockmark">${sealSvg}</div>
    </div>
  </article>`;

  const theses = r.th.length
    ? `<h4>Головне із зустрічі</h4><ul>${r.th.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`
    : "";
  const extra = r.extra
    ? `<a class="extra" href="${esc(r.extra)}" target="_blank" rel="noopener">Додаткові матеріали →</a>` : "";

  return `<article class="row" data-i="${i}">
    <button class="row-head" onclick="this.parentNode.classList.toggle('open')" aria-expanded="false">
      ${date}
      <div class="meat">
        <div class="title">${esc(r.t)}</div>
        <div class="tags"><span class="tag">${esc(r.c)}</span>${r.p ? `<span class="pw">${lockSvg}Power</span>` : ""}</div>
      </div>
      <svg class="caret" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="body">
      ${r.s ? `<p class="sum">${esc(r.s)}</p>` : ""}
      ${theses}
      ${r.u ? `<a class="watch" href="${esc(r.u)}" target="_blank" rel="noopener">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Дивитись запис</a>` : ""}
      ${extra}
    </div>
  </article>`;
}

const lockSvg = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;
const sealSvg  = `<svg width="26" height="26" viewBox="0 0 40 40" aria-hidden="true">
  <circle cx="20" cy="20" r="15" fill="none" stroke="#BFA599" stroke-width="1" stroke-dasharray="2 2.6"/>
  <circle cx="20" cy="20" r="11" fill="rgba(191,165,153,.13)"/>
  <text x="20" y="23.4" text-anchor="middle" fill="#8A6A3E" font-size="7.2"
        font-family="Onest,sans-serif" letter-spacing=".6">PW</text>
</svg>`;

$("code").focus();
</script>
</body>
</html>
